<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GLOW CARS · Prototipo 360 BMW X6M</title>
<style>
:root{--bg:#070707;--card:#111;--gold:#d8b36a;--line:#292929}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.wrap{width:min(100%,1050px)}
.top{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:14px}
.eyebrow{color:var(--gold);font-size:12px;font-weight:900;letter-spacing:2px;text-transform:uppercase}
h1{font-size:clamp(24px,5vw,42px);margin:7px 0 0}.note{color:#999;font-size:13px;text-align:right}
.viewer{position:relative;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#252525,#090909 65%);box-shadow:0 18px 70px rgba(0,0,0,.45);touch-action:none;user-select:none}
.viewer img{display:block;width:100%;height:min(68vh,680px);object-fit:contain;background:#0b0b0b;pointer-events:none}
.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(0,0,0,.72);border:1px solid #4b4b4b;border-radius:999px;padding:10px 16px;font-weight:800;font-size:13px;white-space:nowrap;backdrop-filter:blur(8px)}
.counter{position:absolute;right:14px;top:14px;background:rgba(0,0,0,.72);border:1px solid #444;border-radius:999px;padding:7px 11px;font-size:12px;color:#ddd}
.controls{display:flex;align-items:center;gap:10px;margin-top:12px}.controls button{width:48px;height:48px;border-radius:50%;border:1px solid #555;background:#151515;color:#fff;font-size:25px}.bar{height:5px;flex:1;background:#252525;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:var(--gold);width:0%}
.small{color:#777;font-size:12px;margin-top:10px;line-height:1.5}
@media(max-width:600px){body{padding:8px}.top{align-items:start}.note{display:none}.viewer{border-radius:15px}.viewer img{height:62vh}.hint{bottom:12px;font-size:12px;padding:9px 13px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="eyebrow">GLOW CARS · DEMO 360</div><h1>BMW X6M 575CV</h1></div>
    <div class="note">Arrastra con el dedo para girar el coche</div>
  </div>
  <div id="viewer" class="viewer" aria-label="Visor 360 del BMW X6M">
    <img id="frame" alt="BMW X6M vista 360" draggable="false">
    <div id="counter" class="counter">1 / 12</div>
    <div id="hint" class="hint">↔ Arrastra para girar</div>
  </div>
  <div class="controls">
    <button id="prev" aria-label="Vista anterior">‹</button>
    <div class="bar"><span id="progress"></span></div>
    <button id="next" aria-label="Vista siguiente">›</button>
  </div>
  <div class="small">Prototipo táctil: utiliza las fotos reales actuales del vehículo como fotogramas. La versión definitiva puede usar una secuencia más densa para que el giro sea todavía más fluido.</div>
</div>
<script>
const frames=[
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354322135-7jhr8pxnufv.jpeg',
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354322633-oh5vxib7ryp.jpeg',
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354323064-f6ntnqjegos.jpeg',
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354323555-1netta7ep08.jpeg',
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354323973-kw6gvy2wq2b.jpeg',
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354324579-bi10slm95pw.jpeg',
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354325705-pm6s8617u4f.jpeg',
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354326320-eonsx0fszk.jpeg',
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354326698-vvcv5klp6gl.jpeg',
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354327139-6hwe7exph84.jpeg',
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354327547-mxmoiswor.jpeg',
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354327893-9mqykq2avuv.jpeg'
];
frames.forEach(src=>{const i=new Image();i.src=src});
const viewer=document.getElementById('viewer'), img=document.getElementById('frame'), counter=document.getElementById('counter'), progress=document.getElementById('progress'), hint=document.getElementById('hint');
let index=0,drag=false,startX=0,lastStep=0;
function show(n){index=(n+frames.length)%frames.length;img.src=frames[index];counter.textContent=`${index+1} / ${frames.length}`;progress.style.width=`${((index+1)/frames.length)*100}%`}
function pointX(e){return e.touches?.[0]?.clientX ?? e.clientX}
function start(e){drag=true;startX=pointX(e);lastStep=0;hint.style.opacity='.35'}
function move(e){if(!drag)return;e.preventDefault();const dx=pointX(e)-startX;const step=Math.trunc(dx/28);if(step!==lastStep){show(index-(step-lastStep));lastStep=step}}
function end(){drag=false;hint.style.opacity='1'}
viewer.addEventListener('pointerdown',start);viewer.addEventListener('pointermove',move);window.addEventListener('pointerup',end);viewer.addEventListener('touchstart',start,{passive:true});viewer.addEventListener('touchmove',move,{passive:false});viewer.addEventListener('touchend',end);
document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);
show(0);
</script>
</body>
</html>

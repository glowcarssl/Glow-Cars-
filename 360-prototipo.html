<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GLOW CARS · BMW X6M 2016 · Escenario 360</title>
<style>
:root{--gold:#d8b36a;--bg:#050505;--panel:#111}
*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}body{padding:8px}.wrap{max-width:1180px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:8px 2px 12px}.ey{color:var(--gold);font-size:12px;letter-spacing:2px;font-weight:900}.head h1{margin:5px 0 0;font-size:clamp(26px,5vw,42px)}.note{color:#999;font-size:13px}.stage{position:relative;overflow:hidden;border:1px solid #2b2b2b;border-radius:22px;min-height:620px;background:radial-gradient(circle at 50% 38%,#2b2b2b 0,#151515 34%,#080808 68%,#030303 100%);touch-action:none;user-select:none;box-shadow:0 20px 80px #0008}.wall-lines:before,.wall-lines:after{content:"";position:absolute;top:0;bottom:0;width:3px;background:linear-gradient(transparent,#cfa963,#fff1c0,#cfa963,transparent);box-shadow:0 0 22px #d8b36a99}.wall-lines:before{left:8%}.wall-lines:after{right:8%}.logo{position:absolute;left:50%;top:7%;transform:translateX(-50%);text-align:center;color:#d8b36a;font-size:clamp(34px,7vw,88px);font-weight:900;letter-spacing:5px;text-shadow:0 0 18px #d8b36a66,0 3px 0 #6d5225;white-space:nowrap}.logo small{display:block;font-size:12px;letter-spacing:6px;color:#b98f4b;margin-bottom:6px}.platform{position:absolute;left:7%;right:7%;bottom:8%;height:28%;border-radius:50%;background:radial-gradient(ellipse at center,#242424 0,#151515 52%,#070707 72%);border:2px solid #cfa963;box-shadow:0 0 0 10px #0b0b0b,0 0 0 12px #7a5a25,0 8px 40px #000,0 0 28px #d8b36a55 inset}.platform:after{content:"";position:absolute;left:5%;right:5%;bottom:-12px;height:18px;border-radius:50%;background:#050505;border-bottom:3px solid #d8b36a;box-shadow:0 8px 22px #d8b36a55}.car-zone{position:absolute;left:7%;right:7%;top:20%;bottom:14%;display:flex;align-items:center;justify-content:center;overflow:hidden}.car-zone:after{content:"";position:absolute;left:5%;right:5%;bottom:4%;height:34%;background:radial-gradient(ellipse at center,#0009 0,#0000 68%);pointer-events:none}.frame{position:absolute;width:100%;height:100%;object-fit:contain;object-position:center;pointer-events:none;transition:opacity .11s ease,transform .11s ease;filter:saturate(1.05) contrast(1.03);mask-image:radial-gradient(ellipse 53% 43% at 50% 56%,#000 60%,transparent 96%);-webkit-mask-image:radial-gradient(ellipse 53% 43% at 50% 56%,#000 60%,transparent 96%)}.frame.back{opacity:0}.angle{position:absolute;top:15px;left:15px;background:#000c;border:1px solid #5d4a2a;border-radius:999px;padding:9px 13px;color:var(--gold);font-size:12px;font-weight:900}.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#000c;border:1px solid #555;border-radius:999px;padding:10px 15px;font-size:12px;font-weight:900;white-space:nowrap}.controls{display:flex;gap:10px;align-items:center;margin-top:12px}.controls button{height:46px;min-width:46px;border-radius:999px;border:1px solid #555;background:#111;color:#fff;font-size:22px;font-weight:900}.controls .auto{font-size:13px;padding:0 16px}.bar{height:5px;background:#242424;flex:1;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:var(--gold)}.sub{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:9px;color:#888;font-size:12px}.thumbs{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px}.thumb{flex:0 0 88px;background:#111;border:1px solid #333;border-radius:10px;padding:6px;color:#aaa;font-size:11px;text-align:center}.thumb.active{border-color:var(--gold);color:var(--gold)}
@media(max-width:700px){body{padding:4px}.note{display:none}.stage{min-height:520px;border-radius:16px}.logo{top:8%}.car-zone{left:0;right:0;top:18%;bottom:17%}.platform{left:2%;right:2%;bottom:10%;height:24%}.hint{bottom:12px}.sub{display:block}.sub span{display:block;margin-bottom:8px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div><div class="ey">GLOW CARS · PROTOTIPO 360</div><h1>BMW X6M 2016</h1></div><div class="note">Escenario fijo · solo cambia el coche</div></div>
  <div id="stage" class="stage">
    <div class="wall-lines"></div>
    <div class="logo"><small>SHOWROOM</small>GLOW CARS</div>
    <div class="platform"></div>
    <div class="car-zone"><img id="imgA" class="frame" draggable="false"><img id="imgB" class="frame back" draggable="false"></div>
    <div id="angle" class="angle">0°</div>
    <div id="hint" class="hint">↔ Arrastra para girar el coche</div>
  </div>
  <div class="controls"><button id="prev">‹</button><div class="bar"><span id="progress"></span></div><button id="next">›</button><button id="auto" class="auto">▶ Auto</button></div>
  <div class="sub"><span>El fondo, el logo y la plataforma permanecen fijos. He suavizado el cambio entre vistas para que se note menos el salto entre fotos.</span><span id="count">1 / 12</span></div>
  <div id="thumbs" class="thumbs"></div>
</div>
<script>
const frames=[
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354322135-7jhr8pxnufv.jpeg',
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354322633-oh5vxib7ryp.jpeg',
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354323064-f6ntnqjegos.jpeg',
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354323555-1netta7ep08.jpeg',
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354323973-kw6gvy2wq2b.jpeg',
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354324579-bi10slm95pw.jpeg',
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354325705-pm6s8617u4f.jpeg',
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354326320-eonsx0fszk.jpeg',
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354326698-vvcv5klp6gl.jpeg',
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354327139-6hwe7exph84.jpeg',
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354327547-mxmoiswor.jpeg',
'https://hqsiglpdnylsfbideglc.supabase.co/storage/v1/object/public/glow-cars/cars/1787354327893-9mqykq2avuv.jpeg'
];
frames.forEach(s=>{const i=new Image();i.src=s});
const A=document.getElementById('imgA'),B=document.getElementById('imgB'),stage=document.getElementById('stage'),angle=document.getElementById('angle'),progress=document.getElementById('progress'),count=document.getElementById('count'),thumbs=document.getElementById('thumbs'),autoBtn=document.getElementById('auto');
let idx=0,front=A,back=B,drag=false,startX=0,lastStep=0,timer=null;
function deg(i){return Math.round(i*360/frames.length)}
function renderThumbs(){thumbs.innerHTML=frames.map((_,i)=>`<button class="thumb ${i===idx?'active':''}" data-i="${i}">${deg(i)}°</button>`).join('');thumbs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>show(+b.dataset.i)))}
function show(n){n=(n+frames.length)%frames.length;if(n===idx&&front.src)return;idx=n;back.src=frames[idx];back.style.opacity='1';back.style.transform='scale(1.015)';front.style.opacity='0';front.style.transform='scale(.99)';setTimeout(()=>{const t=front;front=back;back=t;back.style.opacity='0';back.style.transform='scale(1)'},115);angle.textContent=`${deg(idx)}°`;count.textContent=`${idx+1} / ${frames.length}`;progress.style.width=`${((idx+1)/frames.length)*100}%`;renderThumbs()}
function px(e){return e.clientX}
function down(e){drag=true;startX=px(e);lastStep=0;stage.setPointerCapture?.(e.pointerId)}
function move(e){if(!drag)return;const dx=px(e)-startX;const step=Math.trunc(dx/22);if(step!==lastStep){show(idx-(step-lastStep));lastStep=step}}
function up(){drag=false}
stage.addEventListener('pointerdown',down);stage.addEventListener('pointermove',move);stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
document.getElementById('prev').onclick=()=>show(idx-1);document.getElementById('next').onclick=()=>show(idx+1);
autoBtn.onclick=()=>{if(timer){clearInterval(timer);timer=null;autoBtn.textContent='▶ Auto'}else{timer=setInterval(()=>show(idx+1),650);autoBtn.textContent='❚❚ Auto'}};
A.src=frames[0];angle.textContent='0°';progress.style.width=`${100/frames.length}%`;renderThumbs();
</script>
</body></html>

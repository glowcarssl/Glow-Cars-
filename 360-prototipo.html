<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GLOW CARS · BMW X6M 2016 · Prototipo 360</title>
<style>
:root{--bg:#050505;--panel:#0d0d0d;--gold:#d8b36a;--line:#2c2c2c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;padding:14px}
.wrap{width:min(100%,1180px);margin:auto}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:5px 0 14px}
.eyebrow{color:var(--gold);font-size:12px;font-weight:900;letter-spacing:2px}
h1{margin:5px 0 0;font-size:clamp(24px,5vw,42px)} .sub{color:#aaa;font-size:13px}
.viewer{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:radial-gradient(circle at 50% 45%,#242424,#090909 70%);touch-action:none;user-select:none}
.viewer img{display:block;width:100%;height:min(70vh,700px);object-fit:contain;background:#090909;pointer-events:none;image-rendering:auto}
.badge{position:absolute;left:14px;top:14px;background:rgba(0,0,0,.78);border:1px solid #555;padding:8px 12px;border-radius:999px;color:var(--gold);font-size:12px;font-weight:900}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(0,0,0,.76);border:1px solid #555;padding:10px 15px;border-radius:999px;font-size:13px;font-weight:900;white-space:nowrap}
.controls{display:flex;align-items:center;gap:10px;margin-top:12px}
.controls button{width:48px;height:48px;border-radius:50%;border:1px solid #555;background:#151515;color:#fff;font-size:26px;cursor:pointer}
.bar{height:5px;flex:1;background:#202020;border-radius:999px;overflow:hidden} .bar span{display:block;height:100%;width:0;background:var(--gold)}
.meta{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-top:10px;color:#888;font-size:12px}
.auto{border:1px solid #555;background:#111;color:#fff;border-radius:9px;padding:10px 12px;font-weight:800}
@media(max-width:600px){body{padding:7px}.head{align-items:flex-start}.sub{display:none}.viewer{border-radius:15px}.viewer img{height:65vh}.hint{bottom:10px;font-size:12px;padding:8px 11px}.badge{top:9px;left:9px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><div class="eyebrow">GLOW CARS · PROTOTIPO 360 IA</div><h1>BMW X6M 2016</h1></div>
    <div class="sub">Arrastra con el dedo para girar 360°</div>
  </div>
  <div id="viewer" class="viewer">
    <img id="frame" alt="BMW X6M 2016 vista 360" draggable="false">
    <div id="angle" class="badge">0°</div>
    <div id="hint" class="hint">↔ Arrastra para girar</div>
  </div>
  <div class="controls">
    <button id="prev" aria-label="Anterior">‹</button>
    <div class="bar"><span id="progress"></span></div>
    <button id="next" aria-label="Siguiente">›</button>
  </div>
  <div class="meta">
    <span>26 vistas generadas para esta demostración.</span>
    <button id="auto" class="auto">▶ Auto rotación</button>
  </div>
</div>
<script>
const frames=[];
</script>
</body>
</html>

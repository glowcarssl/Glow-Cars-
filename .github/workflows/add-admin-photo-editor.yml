name: Add admin photo editor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-admin-photo-editor:
    if: ${{ !contains(github.event.head_commit.message, 'Add admin photo editor controls') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add photo controls to admin editor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          marker = '<div class="form-actions"><button class="btn gold" onclick="save()">Guardar cambios</button>'
          block = '''<div class="field full upload" id="editPhotoUpload"><label>📸 Fotos del vehículo</label><p class="muted">Desde aquí puedes subir fotos nuevas sin salir de Modificar. En coches vendidos se conservarán como máximo 4.</p><input id="editfiles" type="file" accept="image/*" multiple onchange="previewEditFiles()"><div class="thumbs" id="editthumbs"></div><div class="progress"><i id="editbar"></i></div><div id="editUploadStatus" class="muted" style="margin-top:7px">Selecciona las fotos desde tu iPhone.</div><div class="form-actions"><button type="button" class="btn gold" onclick="replaceEditPhotos()">📸 Reemplazar fotos</button><button type="button" class="btn" onclick="appendEditPhotos()">➕ Añadir fotos</button></div></div>'''
          if 'id="editPhotoUpload"' not in s:
              if marker not in s:
                  raise SystemExit('editor marker not found')
              s = s.replace(marker, block + marker, 1)
          js_marker = 'async function save(){'
          js = '''function previewEditFiles(){const fs=[...$('editfiles').files];$('editthumbs').innerHTML=fs.map(f=>'<img src="'+URL.createObjectURL(f)+'">').join('');$('editUploadStatus').textContent=fs.length+' foto(s) seleccionada(s).'}\nasync function uploadEditFiles(files){let urls=[];for(let i=0;i<files.length;i++){let f=files[i],ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path='cars/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;$('editUploadStatus').textContent='Subiendo foto '+(i+1)+' de '+files.length+'…';let r=await fetch(U+'/storage/v1/object/'+BUCKET+'/'+path,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':f.type||'image/jpeg','x-upsert':'false'},body:f});if(!r.ok)throw Error('Error subiendo '+f.name+': '+await r.text());urls.push(U+'/storage/v1/object/public/'+BUCKET+'/'+path);$('editbar').style.width=((i+1)/files.length*100)+'%'}return urls}\nasync function replaceEditPhotos(){const files=[...$('editfiles').files];if(!files.length){$('editUploadStatus').textContent='Selecciona primero las fotos.';return}const sold=status($('estado').value).toLowerCase()==='vendido';if(sold&&files.length>4){$('editUploadStatus').textContent='❌ Un vendido puede tener como máximo 4 fotos.';return}try{$('editUploadStatus').textContent='Preparando…';$('editbar').style.width='0';const urls=await uploadEditFiles(files);$('imagen').value=urls.join('\\n');$('editUploadStatus').textContent='✅ Fotos preparadas. Pulsa “Guardar cambios” para asociarlas al coche.'}catch(e){$('editUploadStatus').textContent='❌ '+e.message}}\nasync function appendEditPhotos(){const files=[...$('editfiles').files];if(!files.length){$('editUploadStatus').textContent='Selecciona primero las fotos.';return}try{let current=imgs($('imagen').value), sold=status($('estado').value).toLowerCase()==='vendido';let available=Math.max(0,(sold?4:999)-current.length);if(available<=0){$('editUploadStatus').textContent=sold?'❌ Este vendido ya tiene 4 fotos.':'❌ No hay espacio para más fotos.';return}let selected=sold?files.slice(0,available):files;$('editUploadStatus').textContent='Preparando…';$('editbar').style.width='0';const urls=await uploadEditFiles(selected);$('imagen').value=current.concat(urls).join('\\n');$('editUploadStatus').textContent='✅ Fotos preparadas. Pulsa “Guardar cambios” para asociarlas al coche.'}catch(e){$('editUploadStatus').textContent='❌ '+e.message}}\n'''
          if 'function replaceEditPhotos()' not in s:
              if js_marker not in s:
                  raise SystemExit('save function marker not found')
              s = s.replace(js_marker, js + js_marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit admin update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Add admin photo editor controls"
          git push
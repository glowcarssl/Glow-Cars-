name: Add admin photo upload
on:
  push:
    branches: [admin-photo-upload-fix]
    paths: ['.github/workflows/add-admin-photo-upload.yml']
permissions:
  contents: write
jobs:
  patch-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin editor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          marker='<div class="field full"><label>URLs de fotos existentes</label><textarea id="imagen"></textarea></div>'
          insert=marker+'<div class="field full upload"><label>📸 Fotos del vehículo</label><select id="editPhotoMode"><option value="add">Añadir a las actuales</option><option value="replace">Reemplazar las actuales</option></select><input id="editfiles" type="file" accept="image/*" multiple onchange="previewEditFiles()"><div class="thumbs" id="editThumbs"></div><div class="progress"><i id="editBar"></i></div><div id="editUploadStatus" class="muted" style="margin-top:7px">Selecciona fotos desde el iPhone. En vendidos se conservarán como máximo 4.</div></div>'
          if marker not in s: raise SystemExit('editor marker not found')
          s=s.replace(marker,insert,1)
          old="function edit(id){let r=rows.find(x=>String(x.id)===String(id));if(!r)return;"
          new=old+"$('editfiles').value='';$('editThumbs').innerHTML='';$('editBar').style.width='0';$('editUploadStatus').textContent='Selecciona fotos desde el iPhone. En vendidos se conservarán como máximo 4.';"
          if old not in s: raise SystemExit('edit function marker not found')
          s=s.replace(old,new,1)
          marker2='function closeEditor(){$(\'editor\').hidden=true}'
          add="function previewEditFiles(){const fs=[...$('editfiles').files];$('editThumbs').innerHTML=fs.map(f=>'<img src=\"'+URL.createObjectURL(f)+'\">').join('');$('editUploadStatus').textContent=fs.length+' foto(s) seleccionada(s).'} async function uploadEditFiles(files){let urls=[];for(let i=0;i<files.length;i++){let f=files[i],ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path='cars/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;$('editUploadStatus').textContent='Subiendo foto '+(i+1)+' de '+files.length+'…';let r=await fetch(U+'/storage/v1/object/'+BUCKET+'/'+path,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':f.type||'image/jpeg','x-upsert':'false'},body:f});if(!r.ok){throw Error('Error subiendo '+f.name+': '+await r.text())}urls.push(U+'/storage/v1/object/public/'+BUCKET+'/'+path);$('editBar').style.width=((i+1)/files.length*100)+'%'}return urls}"
          if marker2 not in s: raise SystemExit('close editor marker not found')
          s=s.replace(marker2,add+marker2,1)
          start=s.find('async function save(){')
          end=s.find('function cleanKeys(',start)
          if start<0 or end<0: raise SystemExit('save function not found')
          save="""async function save(){try{let id=$('id').value,r=rows.find(x=>String(x.id)===String(id));let existing=imgs($('imagen').value),files=[...$('editfiles').files],photoUrls=existing;if(files.length){$('editUploadStatus').textContent='Preparando subida…';let uploaded=await uploadEditFiles(files);if($('editPhotoMode').value==='replace')photoUrls=uploaded;else photoUrls=existing.concat(uploaded);if(status($('estado').value)==='Vendido')photoUrls=photoUrls.slice(0,4);$('imagen').value=photoUrls.join('\\n');}let p={'Marca-modelo':$('modelo').value,'Precio':$('precio').value===''?null:Number($('precio').value),'Año':$('ano').value===''?null:Number($('ano').value),'Kilómetros':$('km').value===''?null:Number($('km').value),'Combustible':$('combustible').value,'Cambio':$('cambio').value,'estado':$('estado').value,'Descripción':$('descripcion').value,'Imagen':$('imagen').value};await api('?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(p)});$('editUploadStatus').textContent='✅ Fotos y datos guardados.';closeEditor();await load()}catch(e){$('editUploadStatus').textContent='❌ '+e.message;$('status').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}"""
          s=s[:start]+save+s[end:]
          p.write_text(s)
          PY
      - name: Commit patched admin
        run: |
          git config user.name 'glow-cars-bot'
          git config user.email 'glow-cars-bot@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add iPhone photo upload to modify vehicle'
          git push

name: Publicar Auto3 URL
on:
  push:
    paths:
      - '.github/workflows/publicar-auto3-url.yml'
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear URL nueva sin cache
        run: cp fotos-ia.html fotos-ia-auto3.html
      - name: Commit
        run: |
          git config user.name "glowcarssl"
          git config user.email "actions@users.noreply.github.com"
          git add fotos-ia-auto3.html
          git commit -m "Publicar Fotos IA Auto3 en URL nueva" || exit 0
          git push

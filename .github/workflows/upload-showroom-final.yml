name: Upload final showroom
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode showroom
        run: |
          python - <<'PY'
          import base64
          data = ''''''
          open('assets/showroom-glow-final.jpg','wb').write(base64.b64decode(data))
          PY
      - name: Update generator background
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in ['fotos-ia.html','fotos-ia-v4.html']:
              f=Path(p)
              if f.exists():
                  s=f.read_text(encoding='utf-8')
                  import re
                  s=re.sub(r'assets/showroom[^\"\']+\.(?:jpg|jpeg|png|svg)', 'assets/showroom-glow-final.jpg', s)
                  f.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/showroom-glow-final.jpg fotos-ia.html fotos-ia-v4.html || true
          git commit -m 'Use final approved showroom background' || exit 0
          git push

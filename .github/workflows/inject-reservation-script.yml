name: Integrar reservas Stripe

on:
  push:
    paths:
      - 'reserva.js'
      - '.github/workflows/inject-reservation-script.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrar script de reservas
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="reserva.js"></script>'
          if tag not in s:
              s = s.replace('</body></html>', tag + '</body></html>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit integración
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Integrar botón de reserva Stripe en V8'
          git push

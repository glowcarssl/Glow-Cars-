<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOW CARS TV · Gestión</title><style>
:root{--bg:#070707;--card:#111;--gold:#d8b36a;--line:#292929;--muted:#8d8d8d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif}.wrap{width:min(1050px,92%);margin:25px auto}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}h1,h2{margin-top:0}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:3px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea,select{width:100%;background:#080808;color:#fff;border:1px solid #383838;border-radius:9px;padding:12px;font:inherit}textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:9px;padding:12px 15px;font-weight:900;cursor:pointer}.gold{background:var(--gold);color:#080808}.outline{background:#111;color:#fff;border:1px solid #555}.muted{color:var(--muted);line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.post{display:grid;grid-template-columns:150px 1fr;gap:15px;border-top:1px solid var(--line);padding:15px 0}.thumb{width:150px;aspect-ratio:9/16;object-fit:cover;background:#000;border-radius:10px}.tag{display:inline-block;background:var(--gold);color:#111;padding:5px 8px;border-radius:6px;font-size:10px;font-weight:900;margin-bottom:8px}.status{margin-top:10px;color:#bbb}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.post{grid-template-columns:1fr}.thumb{width:100%;max-height:400px}}
</style></head><body><main class="wrap">
<div class="panel"><div class="eyebrow">GLOW CARS · TV</div><h1>Gestor de vídeos y proyectos</h1><p class="muted">Sube un vídeo desde el móvil, añade título y descripción y publícalo directamente en GLOW CARS TV.</p></div>
<div class="panel"><h2>Nueva publicación</h2><div class="grid"><input id="title" placeholder="Título del vídeo"><select id="type"><option value="video">Vídeo</option><option value="reel">Reel</option><option value="project">Proyecto</option></select><select id="car"><option value="">Sin vehículo asociado</option></select><input id="order" type="number" value="0" placeholder="Orden"><input id="video" type="file" accept="video/mp4,video/webm,video/quicktime"><input id="thumb" type="file" accept="image/*"></div><p><textarea id="description" placeholder="Descripción para el cliente"></textarea></p><label><input id="publish" type="checkbox" checked style="width:auto"> Publicar inmediatamente</label> &nbsp; <label><input id="featured" type="checkbox" style="width:auto"> Destacar</label><div class="actions"><button class="btn gold" onclick="publishPost()">🎬 Publicar vídeo</button><button class="btn outline" onclick="location.href='glow-tv.html'">Ver GLOW CARS TV</button></div><div id="status" class="status"></div></div>
<div class="panel"><h2>Publicaciones</h2><div id="posts" class="muted">Cargando…</div></div></main>
<script>
const U='https://hqsiglpdnylsfbideglc.supabase.co',K='sb_publishable_elNqKmc2_3zpeDxrlFKMFw_RdDz4nXz';const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let cars=[];
async function api(path,opt={}){let r=await fetch(U+path,{...opt,headers:{...H,...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
async function loadCars(){cars=await api('/rest/v1/GLOW-CARS?select=id,"Marca-modelo",Año&order=created_at.desc');$('car').innerHTML='<option value="">Sin vehículo asociado</option>'+cars.map(c=>`<option value="${c.id}">${esc(c['Marca-modelo'])} · ${esc(c.Año||'')}</option>`).join('')}
async function upload(file,folder){if(!file)return '';let safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');let path=folder+'/'+crypto.randomUUID()+'-'+safe;let r=await fetch(U+'/storage/v1/object/glow-cars/'+path,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':file.type||'application/octet-stream'},body:file});if(!r.ok)throw Error(await r.text());return U+'/storage/v1/object/public/glow-cars/'+path}
async function publishPost(){let title=$('title').value.trim(),vf=$('video').files[0],tf=$('thumb').files[0];if(!title||!vf)return alert('Añade un título y selecciona un vídeo.');$('status').textContent='Subiendo vídeo…';try{let video=await upload(vf,'tv/videos'),thumb=await upload(tf,'tv/thumbs');let body={title,description:$('description').value.trim(),content_type:$('type').value,video_url:video,thumbnail_url:thumb||null,car_id:$('car').value?Number($('car').value):null,published:$('publish').checked,featured:$('featured').checked,sort_order:Number($('order').value)||0};await api('/rest/v1/glow_cars_content_posts',{method:'POST',body:JSON.stringify(body)});$('status').textContent='Publicado correctamente. Ya puede aparecer en GLOW CARS TV.';['title','description','video','thumb'].forEach(id=>{if($(id).tagName==='INPUT')$(id).value='';else $(id).value=''});$('publish').checked=true;$('featured').checked=false;loadPosts()}catch(e){$('status').textContent='Error: '+e.message}}
async function loadPosts(){let a=await api('/rest/v1/glow_cars_content_posts?select=*&order=created_at.desc');if(!a.length){$('posts').innerHTML='Todavía no hay publicaciones.';return}$('posts').innerHTML=a.map(p=>{let label=p.content_type==='project'?'PROYECTO':p.content_type==='reel'?'REEL':'VÍDEO';let media=p.thumbnail_url?`<img class="thumb" src="${esc(p.thumbnail_url)}">`:`<video class="thumb" src="${esc(p.video_url)}" muted playsinline preload="metadata"></video>`;return `<article class="post">${media}<div><span class="tag">${label}</span><h3>${esc(p.title)}</h3><p class="muted">${esc(p.description||'')}</p><p class="muted">${p.published?'🟢 Publicado':'⚪ Oculto'} · ${p.featured?'⭐ Destacado':''}</p><div class="actions"><button class="btn outline" onclick="togglePublish(${p.id},${!p.published})">${p.published?'Ocultar':'Publicar'}</button><button class="btn outline" onclick="toggleFeatured(${p.id},${!p.featured})">${p.featured?'Quitar destacado':'Destacar'}</button><button class="btn outline" onclick="deletePost(${p.id})">Eliminar</button></div></div></article>`}).join('')}
async function togglePublish(id,v){await api('/rest/v1/glow_cars_content_posts?id=eq.'+id,{method:'PATCH',body:JSON.stringify({published:v})});loadPosts()}async function toggleFeatured(id,v){await api('/rest/v1/glow_cars_content_posts?id=eq.'+id,{method:'PATCH',body:JSON.stringify({featured:v})});loadPosts()}async function deletePost(id){if(!confirm('¿Eliminar esta publicación?'))return;await api('/rest/v1/glow_cars_content_posts?id=eq.'+id,{method:'DELETE'});loadPosts()}
Promise.all([loadCars(),loadPosts()]).catch(e=>$('status').textContent='Error de conexión: '+e.message);
</script></body></html>

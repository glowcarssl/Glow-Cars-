const U='https://hqsiglpdnylsfbideglc.supabase.co',K='sb_publishable_elNqKmc2_3zpeDxrlFKMFw_RdDz4nXz',T='GLOW-CARS';let frames=[],index=0,dragging=false,lastX=0,acc=0;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function imgs(c){return String(c.imagen??c.Imagen??'').split(/\n|,/).map(x=>x.trim()).filter(Boolean)}function name(c){return c['Marca-modelo']||c['marca-modelo']||'Vehículo'}async function load(){try{const id=new URLSearchParams(location.search).get('id');if(!id)throw new Error('Falta el ID del vehículo');const r=await fetch(`${U}/rest/v1/${encodeURIComponent(T)}?select=*&id=eq.${encodeURIComponent(id)}`,{headers:{apikey:K,Authorization:`Bearer ${K}`}});if(!r.ok)throw new Error('No se pudo consultar el vehículo');const rows=await r.json();if(!rows.length)throw new Error('Vehículo no encontrado');const c=rows[0];frames=imgs(c);if(!frames.length)throw new Error('Este vehículo todavía no tiene fotos');render(c)}catch(e){$('app').innerHTML=`<div class="error">${esc(e.message)}</div>`}}function render(c){$('app').innerHTML=`<div class="stage" id="stage"><img id="frame" src="${esc(frames[0])}" alt="${esc(name(c))}"><div class="hint">↔ Desliza para girar el vehículo</div></div><div class="controls"><button onclick="step(-1)">‹</button><button onclick="step(1)">›</button></div><div class="info"><strong>${esc(name(c))}</strong><p>Visor interactivo preparado para secuencias de fotografías 360°. Actualmente utiliza las fotos disponibles; en la siguiente fase incorporaremos fotogramas intermedios generados con IA.</p><div class="status">${frames.length} fotogramas disponibles</div></div>`;const s=$('stage');s.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;s.setPointerCapture?.(e.pointerId)});s.addEventListener('pointerup',()=>dragging=false);s.addEventListener('pointercancel',()=>dragging=false);s.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX;lastX=e.clientX;acc+=dx;if(Math.abs(acc)>=12){step(acc>0?1:-1);acc=0}});s.addEventListener('wheel',e=>{e.preventDefault();step(e.deltaY>0?1:-1)},{passive:false})}function step(n){if(!frames.length)return;index=(index+n+frames.length)%frames.length;$('frame').src=frames[index]}load();

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOW CARS · Visor 360°</title><style>body{margin:0;background:#070707;color:#fff;font-family:Arial}.wrap{max-width:1100px;width:94%;margin:auto;padding:25px 0}.top{display:flex;justify-content:space-between}.btn{padding:10px 15px;border:1px solid #555;border-radius:9px;color:#fff;text-decoration:none}.stage{margin-top:20px;background:#0d0d0d;border:1px solid #292929;border-radius:20px;overflow:hidden;touch-action:none}.stage img{width:100%;height:min(70vh,700px);object-fit:contain;display:block}.hint{text-align:center;color:#aaa;padding:14px}.info{margin-top:15px;padding:20px;background:#111;border:1px solid #292929;border-radius:15px}</style></head><body><div class="wrap"><div class="top"><h1>GLOW CARS · 360°</h1><a class="btn" href="index.html">← Volver</a></div><div id="app">Cargando…</div></div><script>const U='https://hqsiglpdnylsfbideglc.supabase.co',K='sb_publishable_elNqKmc2_3zpeDxrlFKMFw_RdDz4nXz',T='GLOW-CARS';let frames=[],i=0,last=0,drag=false;const app=document.getElementById('app');function imgs(c){return String(c.imagen??c.Imagen??'').split(/\n|,/).map(x=>x.trim()).filter(Boolean)}async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){app.textContent='Falta el ID del vehículo';return}const r=await fetch(`${U}/rest/v1/${T}?select=*&id=eq.${encodeURIComponent(id)}`,{headers:{apikey:K,Authorization:`Bearer ${K}`}});const rows=await r.json();if(!rows.length){app.textContent='Vehículo no encontrado';return}frames=imgs(rows[0]);if(!frames.length){app.textContent='Este vehículo no tiene fotos';return}app.innerHTML=`<div class="stage" id="stage"><img id="frame" src="${frames[0]}"><div class="hint">↔ Desliza el dedo para girar</div></div><div class="info"><b>${rows[0]['Marca-modelo']||rows[0]['marca-modelo']||'Vehículo'}</b><br><small>${frames.length} fotos disponibles · Prueba inicial</small></div>`;const s=document.getElementById('stage');s.onpointerdown=e=>{drag=true;last=e.clientX;s.setPointerCapture?.(e.pointerId)};s.onpointerup=()=>drag=false;s.onpointercancel=()=>drag=false;s.onpointermove=e=>{if(!drag)return;let dx=e.clientX-last;last=e.clientX;if(Math.abs(dx)>12){i=(i+(dx>0?1:-1)+frames.length)%frames.length;document.getElementById('frame').src=frames[i]}}}load();</script></body></html>

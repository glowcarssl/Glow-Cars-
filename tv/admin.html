<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOW CARS TV · Admin</title><style>body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif;padding:24px}main{max-width:700px;margin:auto}h1{letter-spacing:2px}section{background:#111;border:1px solid #292929;border-radius:18px;padding:18px;margin:16px 0}label{display:block;color:#aaa;font-size:13px;margin:14px 0 6px}input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#080808;color:#fff}button{margin-top:16px;padding:12px 16px;border:0;border-radius:10px;background:#fff;color:#000;font-weight:bold}.note{color:#888;line-height:1.5}</style></head><body><main><h1>GLOW CARS TV</h1><p class="note">Panel privado · primera fase. Aquí prepararemos las publicaciones y el generador de vídeos.</p><section><h2>🎬 Nueva publicación</h2><label>Coche</label><input id="car" placeholder="Ej. BMW X6 M 2021"><label>Título</label><input id="title" placeholder="Título del vídeo"><label>Guion</label><textarea id="script" rows="7" placeholder="Escribe lo que quieres que diga el personaje..."></textarea><label>Estilo</label><select id="style"><option>Premium / elegante</option><option>Deportivo</option><option>Divertido</option><option>Presentador profesional</option></select><button onclick="preview()">Preparar prueba</button></section><section id="result" style="display:none"><h2>Vista previa del guion</h2><p id="out"></p><p class="note">La generación con avatar/voz se conectará en la siguiente fase cuando HeyGen permita nuevas generaciones.</p></section></main><script>function preview(){document.querySelector('#result').style.display='block';document.querySelector('#out').textContent=document.querySelector('#script').value||'Escribe un guion para comenzar.'}</script></body></html>

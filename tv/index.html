<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GLOW CARS TV</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}header{position:sticky;top:0;z-index:5;padding:16px 18px;background:rgba(5,5,5,.94);border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between}header b{letter-spacing:2px}header span{font-size:12px;color:#aaa}.hero{padding:28px 18px 18px;background:linear-gradient(180deg,#111,#050505)}h1{margin:0 0 8px;font-size:30px;letter-spacing:1px}p{color:#aaa;margin:0;line-height:1.5}.tabs{display:flex;gap:8px;padding:14px 18px;overflow:auto}.tab{border:1px solid #333;border-radius:20px;padding:9px 14px;background:#101010;color:#ddd;white-space:nowrap}.tab.active{background:#fff;color:#000}.feed{display:grid;gap:18px;padding:0 12px 40px}.card{position:relative;min-height:520px;border-radius:20px;overflow:hidden;background:#111;border:1px solid #242424}.card .mock{height:520px;display:flex;align-items:end;padding:24px;background:radial-gradient(circle at 70% 30%,#343434,#090909 55%,#000)}.badge{position:absolute;top:18px;left:18px;background:#fff;color:#000;padding:7px 10px;border-radius:20px;font-size:11px;font-weight:bold}.copy{max-width:85%}.copy h2{margin:0 0 8px;font-size:25px}.copy p{color:#ddd}.actions{position:absolute;right:16px;bottom:20px;display:grid;gap:9px}.action{width:44px;height:44px;border-radius:50%;border:1px solid #555;background:#151515;color:#fff}.empty{text-align:center;padding:45px 20px;color:#777}
</style>
</head>
<body>
<header><b>GLOW CARS</b><span>TV · PRUEBAS</span></header>
<section class="hero"><h1>GLOW CARS TV</h1><p>Vídeos, proyectos y coches seleccionados. Próximamente con presentador IA y generación automática.</p></section>
<nav class="tabs"><button class="tab active">Todo</button><button class="tab">Coches</button><button class="tab">Proyectos</button><button class="tab">Importación UK</button></nav>
<main class="feed" id="feed"></main>
<script>
const posts=[{title:'Primera prueba GLOW CARS',text:'Estamos preparando una nueva forma de presentar nuestros coches con vídeo, voz y personajes IA.',tag:'PRUEBA'}];
const feed=document.querySelector('#feed');
posts.forEach(p=>{const el=document.createElement('article');el.className='card';el.innerHTML=`<span class="badge">${p.tag}</span><div class="mock"><div class="copy"><h2>${p.title}</h2><p>${p.text}</p></div><div class="actions"><button class="action">♡</button><button class="action">↗</button></div></div>`;feed.appendChild(el)});
</script>
</body></html>

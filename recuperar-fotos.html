<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>GLOW CARS · Recuperar fotos</title><style>body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;width:94%;margin:auto}.top{padding:18px 0;border-bottom:1px solid #292929;display:flex;align-items:center;gap:12px}.sp{flex:1}.btn{border:0;border-radius:9px;padding:12px 15px;font-weight:800;cursor:pointer;background:#171717;color:#fff;border:1px solid #444}.gold{background:#d8b36a;color:#090909;border-color:#d8b36a}.panel{background:#111;border:1px solid #292929;border-radius:16px;padding:18px;margin:22px 0}.muted{color:#999;line-height:1.5}select,input{width:100%;box-sizing:border-box;background:#090909;color:#fff;border:1px solid #333;border-radius:8px;padding:12px;font:inherit}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.photos{display:flex;gap:8px;overflow:auto;margin-top:10px}.photos img{width:100px;height:75px;object-fit:cover;border-radius:8px;background:#171717}.status{padding:10px;border-radius:8px;background:#171717;color:#aaa;margin-top:12px}.warn{border-color:#5b4820;background:#151209}.urls{font-size:11px;color:#777;line-height:1.45;word-break:break-all}.actions{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><div class="wrap"><header class="top"><b>GLOW CARS · RECUPERAR FOTOS</b><span class="sp"></span><a class="btn" href="./admin.html">Administrador</a></header><section class="panel warn"><h2>📸 Recuperación de fotografías</h2><p class="muted">Esta herramienta permite volver a subir fotografías de un coche desde el iPhone. No elimina fotografías ni ejecuta ninguna limpieza. En coches vendidos, al guardar se conservan como máximo 4 fotos.</p></section><section class="panel"><div class="field"><label>Vehículo</label><select id="car"><option>Cargando vehículos…</option></select></div><div id="current" class="urls"></div><div class="field" style="margin-top:18px"><label>Selecciona las fotos del coche</label><input id="files" type="file" accept="image/*" multiple><div id="photos" class="photos"></div></div><div class="actions"><button class="btn gold" id="save">⬆️ Subir y guardar fotos</button><button class="btn" id="reload">↻ Recargar</button></div><div id="status" class="status">Listo.</div></section></div><script>const U='https://hqsiglpdnylsfbideglc.supabase.co',K='sb_publishable_elNqKmc2_3zpeDxrlFKMFw_RdDz4nXz',T='GLOW-CARS',B='glow-cars';let rows=[];const $=id=>document.getElementById(id);const imgs=v=>String(v??'').split(/\n|,/).map(x=>x.trim()).filter(Boolean);const sold=r=>String(r.estado??'').toLowerCase()==='vendido';async function api(path='',opt={}){const r=await fetch(U+'/rest/v1/'+T+path,{...opt,headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})},cache:'no-store'});const t=await r.text();if(!r.ok)throw Error('HTTP '+r.status+' · '+t);return t?JSON.parse(t):[]}function render(){const s=$('car');s.innerHTML=rows.map(r=>'<option value="'+r.id+'">'+String(r['Marca-modelo']||'Vehículo')+' · '+String(r.estado||'Disponible')+'</option>').join('');showCurrent()}function showCurrent(){const r=rows.find(x=>String(x.id)===$('car').value);$('current').innerHTML=r?'<b>URLs guardadas actualmente:</b><br>'+imgs(r.Imagen).join('<br>'):''}$('car').onchange=showCurrent;$('files').onchange=()=>{$('photos').innerHTML=[...$('files').files].map(f=>'<img src="'+URL.createObjectURL(f)+'">').join('')};async function load(){try{$('status').textContent='Cargando vehículos…';rows=await api('?select=*&order=id.desc');render();$('status').textContent=rows.length+' vehículos cargados.'}catch(e){$('status').textContent='❌ '+e.message}}async function upload(files){const urls=[];for(let i=0;i<files.length;i++){const f=files[i],ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path='cars/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;$('status').textContent='Subiendo foto '+(i+1)+' de '+files.length+'…';const r=await fetch(U+'/storage/v1/object/'+B+'/'+path,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':f.type||'image/jpeg','x-upsert':'false'},body:f});if(!r.ok)throw Error(await r.text());urls.push(U+'/storage/v1/object/public/'+B+'/'+path)}return urls}async function save(){const r=rows.find(x=>String(x.id)===$('car').value),fs=[...$('files').files];if(!r){$('status').textContent='Selecciona un vehículo.';return}if(!fs.length){$('status').textContent='Selecciona al menos una foto.';return}if(sold(r)&&fs.length>4){$('status').textContent='Este coche está vendido: selecciona como máximo 4 fotos.';return}try{const urls=await upload(fs);const {id}=r;await api('?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({Imagen:urls.join('\n')})});r.Imagen=urls.join('\n');$('files').value='';$('photos').innerHTML='';showCurrent();$('status').textContent='✅ Fotos restauradas y guardadas. '+urls.length+' foto(s).'}catch(e){$('status').textContent='❌ '+e.message}}$('save').onclick=save;$('reload').onclick=load;load();</script></body></html>

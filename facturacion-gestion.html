otes').value.trim()};if(!p.client_name||!p.vehicle||p.sale_price<=0){$('msg').textContent='Completa cliente, vehículo e importe.';return}$('saveEdit').disabled=true;$('msg').textContent='Guardando...';const r=await sb.from('GLOW-CARS-INVOICES').update(p).eq('invoice_number',current.invoice_number);if(r.error)$('msg').textContent='Error: '+r.error.message;else{modal.style.display='none';setTimeout(()=>fr.contentWindow.location.reload(),200);setTimeout(load,700)}$('saveEdit').disabled=false}})();</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOW CARS · Facturas</title><style>body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:20px auto;padding:15px}.card{background:#151515;border:1px solid #333;border-radius:14px;padding:18px;margin:12px 0}.btn{border:0;border-radius:9px;padding:11px 14px;margin:4px;cursor:pointer;font-weight:bold}.gold{background:#d8b36a;color:#111}.dark{background:#222;color:#fff;border:1px solid #555}.danger{background:#7b2222;color:#fff}input,textarea{width:100%;box-sizing:border-box;background:#0b0b0b;color:#fff;border:1px solid #555;border-radius:8px;padding:10px;margin:5px 0 12px}.hidden{display:none!important}.invoice{background:#fff;color:#111;max-width:800px;margin:20px auto;padding:35px;border-radius:4px}.invoice table{width:100%;border-collapse:collapse;margin-top:25px}.invoice td,.invoice th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.right{text-align:right}@media print{body{background:#fff}.no-print{display:none!important}.invoice{margin:0;max-width:none}}</style></head><body><div class="wrap"><h1>GLOW <span style="color:#d8b36a">CARS</span></h1><p>Gestión de facturas</p><div id="list">Cargando facturas...</div><div id="detail" class="hidden"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SB='https://hqsiglpdnylsfbideglc.supabase.co',KEY='sb_publishable_elNqKmc2_3zpeDxrlFKMFw_RdDz4nXz';const sb=supabase.createClient(SB,KEY);let rows=[],current=null;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const eur=x=>Number(x||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';async function load(){const r=await sb.from('GLOW-CARS-INVOICES').select('*').order('invoice_year',{ascending:false}).order('invoice_number',{ascending:false});if(r.error){document.getElementById('list').innerHTML='<div class="card">Error: '+esc(r.error.message)+'</div>';return}rows=r.data||[];render()}function render(){document.getElementById('list').innerHTML=rows.length?rows.map((x,i)=>'<div class="card"><b>'+esc(x.invoice_number)+'</b><br>'+esc(x.invoice_date)+' · '+esc(x.client_name)+' · '+esc(x.vehicle)+' · '+eur(x.sale_price)+'<div><button class="btn gold" onclick="view('+i+')">👁️ Ver factura</button><button class="btn dark" onclick="edit('+i+')">✏️ Modificar</button><button class="btn dark" onclick="pdf('+i+')">📄 PDF</button><button class="btn dark" onclick="send('+i+')">📤 Enviar factura</button></div></div>').join(''):'<div class="card">No hay facturas.</div>'}function view(i){current=rows[i];document.getElementById('list').classList.add('hidden');const d=document.getElementById('detail');d.classList.remove('hidden');d.innerHTML=invoice(current)+'<div class="no-print"><button class="btn gold" onclick="pdfCurrent()">📄 PDF</button><button class="btn dark" onclick="sendCurrent()">📤 Enviar</button><button class="btn dark" onclick="editCurrent()">✏️ Modificar</button><button class="btn dark" onclick="back()">← Volver</button></div>'}function invoice(x){const base=Number(x.sale_price||0),isRebu=x.tax_type==='rebu',iva=isRebu?0:base*.21;return '<div class="invoice"><div style="display:flex;justify-content:space-between;border-bottom:2px solid #d8b36a;padding-bottom:15px"><div><h2>GLOW CARS</h2><div>GLOW CARS S.L.</div></div><div><h1>FACTURA</h1><b>'+esc(x.invoice_number)+'</b><br>'+esc(x.invoice_date)+'</div></div><h3>Cliente</h3><b>'+esc(x.client_name)+'</b><br>'+esc(x.client_tax_id||'')+'<br>'+esc(x.client_address||'')+'<br>'+esc(x.client_phone||'')+'<table><tr><th>Concepto</th><th>Vehículo</th><th>Matrícula</th><th>Importe</th></tr><tr><td>'+esc(x.concept||'Venta de vehículo')+'</td><td>'+esc(x.vehicle)+'</td><td>'+esc(x.registration||'')+'</td><td>'+eur(base)+'</td></tr></table><p>Régimen fiscal: '+(isRebu?'REBU':'IVA 21%')+'</p>'+ (isRebu?'<p style="font-size:12px;margin-top:12px"><b>Factura emitida bajo el REGIMEN ESPECIAL DE BIENES USADOS, Articulo 135 a 139 LIVA.</b></p>':'') +'<p>Forma de pago: '+esc(x.payment_method||'')+'</p><div class="right"><b>'+(!isRebu?'Base: '+eur(base):'')+'</b>'+(iva?'<br>IVA 21%: '+eur(iva):'')+'<br><strong>Total: '+eur(base+iva)+'</strong></div>'+(x.observations?'<p><b>Observaciones:</b><br>'+esc(x.observations)+'</p>':'')+'</div>'}function pdf(i){current=rows[i];view(i);setTimeout(()=>window.print(),150)}function pdfCurrent(){window.print()}function send(i){current=rows[i];shareCurrent()}function sendCurrent(){shareCurrent()}async function shareCurrent(){if(!current)return;const text='Factura '+current.invoice_number+' · GLOW CARS · '+current.client_name+' · '+current.vehicle+' · '+eur(current.sale_price);if(navigator.share){try{await navigator.share({title:'Factura '+current.invoice_number,text})}catch(e){}}else{location.href='mailto:'+encodeURIComponent(current.client_email||'')+'?subject='+encodeURIComponent('Factura '+current.invoice_number)+'&body='+encodeURIComponent(text)}}function edit(i){current=rows[i];editCurrent()}function editCurrent(){const x=current;if(!x)return;document.getElementById('list').classList.add('hidden');const d=document.getElementById('detail');d.classList.remove('hidden');d.innerHTML='<div class="card"><h2>Modificar '+esc(x.invoice_number)+'</h2><label>Cliente</label><input id="eclient" value="'+esc(x.client_name)+'"><label>NIF/CIF</label><input id="etaxid" value="'+esc(x.client_tax_id||'')+'"><label>Dirección</label><input id="eaddress" value="'+esc(x.client_address||'')+'"><label>Teléfono</label><input id="ephone" value="'+esc(x.client_phone||'')+'"><label>Vehículo</label><input id="evehicle" value="'+esc(x.vehicle)+'"><label>Matrícula</label><input id="eplate" value="'+esc(x.registration||'')+'"><label>Importe</label><input id="eamount" type="number" step="0.01" value="'+Number(x.sale_price||0)+'"><label>Observaciones</label><textarea id="enotes">'+esc(x.observations||'')+'</textarea><button class="btn gold" onclick="saveEdit()">💾 Guardar cambios</button><button class="btn dark" onclick="view(rows.indexOf(current))">Cancelar</button></div>'}async function saveEdit(){const p={client_name:document.getElementById('eclient').value.trim(),client_tax_id:document.getElementById('etaxid').value.trim(),client_address:document.getElementById('eaddress').value.trim(),client_phone:document.getElementById('ephone').value.trim(),vehicle:document.getElementById('evehicle').value.trim(),registration:document.getElementById('eplate').value.trim(),sale_price:Number(document.getElementById('eamount').value),observations:document.getElementById('enotes').value.trim()};const r=await sb.from('GLOW-CARS-INVOICES').update(p).eq('id',current.id);if(r.error){alert('No se pudo guardar: '+r.error.message);return}alert('Factura modificada correctamente.');await load();current=rows.find(x=>x.id===current.id);view(rows.indexOf(current))}function back(){document.getElementById('detail').classList.add('hidden');document.getElementById('detail').innerHTML='';document.getElementById('list').classList.remove('hidden')}load();</script></body></html>

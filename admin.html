<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GLOW CARS | Gestión</title><style>body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1000px;width:92%;margin:20px auto}.panel{background:#121212;border:1px solid #292929;border-radius:14px;padding:16px;margin-bottom:14px}.version{display:inline-block;margin:6px 0;padding:5px 8px;border:1px solid #4a3d25;border-radius:6px;color:#d8b36a;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,textarea{width:100%;box-sizing:border-box;background:#080808;color:#fff;border:1px solid #333;border-radius:7px;padding:10px}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:bold;cursor:pointer}.gold{background:#d8b36a;color:#111}.outline{background:none;color:#fff;border:1px solid #555}.row{padding:12px;border:1px solid #292929;border-radius:9px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.muted{color:#888;font-size:13px}.modal{display:none;position:fixed;inset:0;background:#000f;z-index:99;overflow:auto;padding:6px}.modal.open{display:block}.box{max-width:900px;margin:auto;background:#151515;border:1px solid #333;border-radius:14px;padding:12px}.photo{margin:10px 0}.stage{position:relative;width:100%;overflow:hidden;background:#000;touch-action:none;border-radius:8px}.stage img{display:block;width:100%;height:auto;max-height:72vh;object-fit:contain;pointer-events:none;user-select:none}.plate{position:absolute;left:37.5%;top:70%;width:25%;aspect-ratio:3.2;background:#f5f5f5;border:3px solid #111;color:#111;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(9px,2.2vw,24px);z-index:3;user-select:none;touch-action:none;transform-origin:center}.handle{position:absolute;width:24px;height:24px;border-radius:50%;background:#d8b36a;border:3px solid #111;z-index:4}.tl{left:-13px;top:-13px}.tr{right:-13px;top:-13px}.bl{left:-13px;bottom:-13px}.br{right:-13px;bottom:-13px}.rotateHandle{position:absolute;left:50%;top:-42px;transform:translateX(-50%);width:25px;height:25px;border-radius:50%;background:#fff;border:3px solid #111;z-index:4}.line{position:absolute;width:2px;height:22px;background:#fff;left:50%;top:-20px;transform:translateX(-50%);z-index:4}.stageLabel{display:flex;justify-content:space-between;align-items:center;margin:7px 0}.hint{font-size:12px;color:#aaa;line-height:1.4}.photoNav{display:flex;gap:8px;margin-top:9px}.photoNav .btn{flex:1}.save{width:100%;margin-top:10px;font-size:16px;padding:13px}.mini{font-size:12px;color:#aaa;text-align:center;margin-top:5px}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{display:block}.box{padding:8px}.stage img{max-height:62vh}.handle,.rotateHandle{width:28px;height:28px}.tl,.bl{left:-15px}.tr,.br{right:-15px}.tl,.tr{top:-15px}.bl,.br{bottom:-15px}}</style></head><body><main class="wrap"><div class="panel"><b style="letter-spacing:4px">GLOW <span style="color:#d8b36a">CARS</span></b><p class="muted">Gestión privada</p><span class="version">PROTECCIÓN VISUAL · V5</span><h2>Añadir vehículo</h2><div class="grid"><input id="marca" placeholder="Marca y modelo"><input id="precio" type="number" placeholder="Precio"><input id="ano" type="number" placeholder="Año"><input id="km" type="number" placeholder="Kilómetros"><input id="fuel" placeholder="Combustible"><input id="cambio" placeholder="Cambio"></div><p><input id="fotos" type="file" accept="image/*" multiple></p><textarea id="descripcion" placeholder="Descripción"></textarea><div class="actions"><button class="btn gold" onclick="addCar()">Publicar vehículo</button></div><div id="status" class="muted"></div></div><div class="panel"><h2>Vehículos</h2><div id="cars">Cargando...</div></div></main><div id="modal" class="modal"><div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><div><h2 id="title" style="margin:0">Proteger foto</h2><div class="muted">Ajusta la placa directamente sobre la foto.</div></div><button class="btn outline" onclick="closeProtect()">Cerrar</button></div><div id="photos"></div><button class="btn gold save" onclick="saveProtected()">✓ Guardar todas las fotos</button><div id="ms" class="muted"></div></div></div><script>const U='https://hqsiglpdnylsfbideglc.supabase.co',K='sb_publishable_elNqKmc2_3zpeDxrlFKMFw_RdDz4nXz',T='GLOW-CARS',H={'apikey':K,'Authorization':'Bearer '+K,'Content-Type':'application/json'};let car=null,ps=[],current=0;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(p){const e=$('plate'),s=$('stage');e.style.left=p.x*100+'%';e.style.top=p.y*100+'%';e.style.width=p.w*100+'%';e.style.height=p.h*100+'%';e.style.transform='rotate('+p.r+'deg)'}function bind(stage,p){const plate=$('plate');let mode=null,sx=0,sy=0,ox=0,oy=0,ow=0,oh=0,or=0;function pt(e){return e.touches?e.touches[0]:e}function start(e){e.preventDefault();const q=pt(e),target=e.target;mode=target.dataset.mode||'move';sx=q.clientX;sy=q.clientY;ox=p.x;oy=p.y;ow=p.w;oh=p.h;or=p.r}function move(e){if(!mode)return;e.preventDefault();const q=pt(e),dx=(q.clientX-sx)/stage.clientWidth,dy=(q.clientY-sy)/stage.clientHeight;if(mode==='move'){p.x=Math.max(0,Math.min(1-p.w,ox+dx));p.y=Math.max(0,Math.min(1-p.h,oy+dy))}else if(mode==='br'||mode==='tr'||mode==='bl'||mode==='tl'){let nw=ow+(mode.includes('r')?dx:-dx);let nh=oh+(mode.includes('b')?dy:-dy);nw=Math.max(.08,Math.min(.7,nw));nh=Math.max(.025,Math.min(.5,nh));if(mode.includes('l'))p.x=Math.max(0,Math.min(1-nw,ox+(ow-nw)));if(mode.includes('t'))p.y=Math.max(0,Math.min(1-nh,oy+(oh-nh)));p.w=nw;p.h=nh}else if(mode==='rot'){const rect=stage.getBoundingClientRect(),cx=rect.left+(p.x+p.w/2)*rect.width,cy=rect.top+(p.y+p.h/2)*rect.height;p.r=or+(Math.atan2(q.clientY-cy,q.clientX-cx)-Math.atan2(sy-cy,sx-cx))*180/Math.PI}draw(p)}function end(){mode=null}plate.addEventListener('touchstart',start,{passive:false});plate.addEventListener('touchmove',move,{passive:false});plate.addEventListener('touchend',end,{passive:false});plate.addEventListener('mousedown',start);window.addEventListener('mousemove',move);window.addEventListener('mouseup',end)}function render(i){current=i;const p=ps[i].p;$('photos').innerHTML='<div class="stageLabel"><span class="muted">Foto '+(i+1)+' de '+ps.length+'</span><span class="muted">Arrastra la placa o sus esquinas</span></div><div id="stage" class="stage"><img id="img" crossorigin="anonymous"><div id="plate" class="plate" data-mode="move"><i class="handle tl" data-mode="tl"></i><i class="handle tr" data-mode="tr"></i><i class="handle bl" data-mode="bl"></i><i class="handle br" data-mode="br"></i><i class="line"></i><i class="rotateHandle" data-mode="rot"></i><span style="pointer-events:none">GLOW CARS</span></div></div><div class="hint">👆 Mueve la placa con el centro · cambia el tamaño desde las esquinas doradas · gira desde el punto superior.</div><div class="photoNav"><button class="btn outline" onclick="prev()">← Anterior</button><button class="btn outline" onclick="next()">Siguiente →</button></div>';$('img').src=ps[i].url;$('img').onload=()=>{draw(p);bind($('stage'),p)}}function prev(){if(current>0)render(current-1)}function next(){if(current<ps.length-1)render(current+1)}async function openProtect(id){const r=await fetch(U+'/rest/v1/'+T+'?id=eq.'+id+'&select=*',{headers:H}),a=await r.json();if(!a[0])return;car=a[0];const urls=String(car.Imagen||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean);if(!urls.length)return alert('Este vehículo no tiene fotos.');ps=urls.map(url=>({url,p:{x:.375,y:.70,w:.25,h:.078,r:0}}));$('title').textContent='Proteger: '+(car['Marca-modelo']||'vehículo');$('modal').classList.add('open');render(0)}function closeProtect(){$('modal').classList.remove('open');car=null;ps=[]}function make(img,p){return new Promise((ok,no)=>{const s=Math.min(1,2200/img.naturalWidth),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s),c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d'),x=p.x*w,y=p.y*h,pw=p.w*w,ph=p.h*h;ctx.drawImage(img,0,0,w,h);ctx.save();ctx.translate(x+pw/2,y+ph/2);ctx.rotate(p.r*Math.PI/180);ctx.fillStyle='#f5f5f5';ctx.fillRect(-pw/2,-ph/2,pw,ph);ctx.strokeStyle='#111';ctx.lineWidth=Math.max(2,ph*.045);ctx.strokeRect(-pw/2,-ph/2,pw,ph);ctx.fillStyle='#111';ctx.font='900 '+Math.max(12,ph*.42)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('GLOW CARS',0,0);ctx.restore();c.toBlob(b=>b?ok(b):no('error'),'image/jpeg',.92)})}async function saveProtected(){if(!car)return;$('ms').textContent='Procesando...';try{const out=[];for(const q of ps){const img=new Image();img.crossOrigin='anonymous';img.src=q.url;await new Promise((ok,no)=>{img.onload=ok;img.onerror=no});const blob=await make(img,q.p),path='cars/'+crypto.randomUUID()+'.jpg',r=await fetch(U+'/storage/v1/object/glow-cars/'+path,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'image/jpeg'},body:blob});if(!r.ok)throw Error(await r.text());out.push(U+'/storage/v1/object/public/glow-cars/'+path)}const r=await fetch(U+'/rest/v1/'+T+'?id=eq.'+car.id,{method:'PATCH',headers:H,body:JSON.stringify({Imagen:out.join('\n')})});if(!r.ok)throw Error(await r.text());$('ms').textContent='Fotos protegidas correctamente';setTimeout(()=>{closeProtect();load()},700)}catch(e){$('ms').textContent='Error: '+e.message}}async function addCar(){const files=[...$('fotos').files];if(!$('marca').value||!files.length)return alert('Indica marca/modelo y selecciona fotos.');$('status').textContent='Subiendo...';try{const out=[];for(const f of files){const path='cars/'+crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),r=await fetch(U+'/storage/v1/object/glow-cars/'+path,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':f.type||'image/jpeg'},body:f});if(!r.ok)throw Error(await r.text());out.push(U+'/storage/v1/object/public/glow-cars/'+path)}const body={'Marca-modelo':$('marca').value,'Precio':+$('precio').value||0,'Año':+$('ano').value||null,'Kilómetros':+$('km').value||0,'Combustible':$('fuel').value,'Cambio':$('cambio').value,'Descripción':$('descripcion').value,Imagen:out.join('\n'),estado:'Disponible'};const r=await fetch(U+'/rest/v1/'+T,{method:'POST',headers:H,body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());$('status').textContent='Publicado. Puedes proteger las fotos manualmente.';load()}catch(e){$('status').textContent='Error: '+e.message}}async function load(){const r=await fetch(U+'/rest/v1/'+T+'?select=*&order=created_at.desc',{headers:H}),a=await r.json();$('cars').innerHTML=a.map(c=>{const sold=(c.estado||'').toLowerCase()==='vendido';return '<div class="row"><div><b>'+esc(c['Marca-modelo'])+'</b><div class="muted">'+esc(c.Año)+' · '+Number(c['Kilómetros']||0).toLocaleString('es-ES')+' km · '+(sold?'VENDIDO':'DISPONIBLE')+'</div></div><div class="actions"><button class="btn outline" onclick="openProtect('+c.id+')">🔒 Proteger fotos</button><button class="btn outline" onclick="toggleSold('+c.id+','+sold+')">'+(sold?'Volver a stock':'Marcar vendido')+'</button><button class="btn outline" onclick="delCar('+c.id+')">Eliminar</button></div></div>'}).join('')||'<p class="muted">No hay vehículos.</p>'}async function toggleSold(id,sold){await fetch(U+'/rest/v1/'+T+'?id=eq.'+id,{method:'PATCH',headers:H,body:JSON.stringify({estado:sold?'Disponible':'Vendido'})});load()}async function delCar(id){if(!confirm('¿Eliminar este vehículo?'))return;await fetch(U+'/rest/v1/'+T+'?id=eq.'+id,{method:'DELETE',headers:H});load()}load();</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>GLOW CARS · Administrador</title><style>body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1100px;width:94%;margin:auto}.top{padding:18px 0;border-bottom:1px solid #292929;display:flex;gap:12px;align-items:center}.logo{height:48px}.sp{flex:1}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer;background:#171717;color:#fff;border:1px solid #444}.gold{background:#d8b36a;color:#090909;border-color:#d8b36a}.panel{background:#111;border:1px solid #292929;border-radius:16px;padding:18px;margin:22px 0}.cars{display:grid;gap:12px}.car{display:grid;grid-template-columns:120px 1fr auto;gap:14px;align-items:center;border:1px solid #292929;background:#0b0b0b;border-radius:12px;padding:10px}.car img{width:120px;height:90px;object-fit:cover;border-radius:8px;background:#171717}.muted{color:#888}.meta{display:flex;gap:6px;flex-wrap:wrap}.tag{background:#1b1b1b;padding:6px 8px;border-radius:6px;font-size:12px;color:#bbb}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter.active{background:#d8b36a;color:#000}.error{background:#241313;border:1px solid #713b3b;color:#ffb0b0;padding:12px;border-radius:9px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}input,select,textarea{background:#090909;color:#fff;border:1px solid #333;border-radius:8px;padding:11px;font:inherit}textarea{min-height:80px}.form-actions{display:flex;gap:8px;margin-top:12px}@media(max-width:700px){.car{grid-template-columns:80px 1fr}.car img{width:80px;height:65px}.actions{grid-column:1/-1;justify-content:flex-start}.form{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><header class="top"><img class="logo" src="8C982453-6D48-46D9-93F0-8BE12D44B720.png"><b>GLOW CARS · ADMINISTRADOR</b><span class="sp"></span><button class="btn gold" onclick="load()">↻ Recargar</button><a class="btn" href="./">Web</a></header><section class="panel"><h2>Vehículos</h2><div id="status" class="muted">Conectando con la base de datos…</div><div class="filters" style="margin:15px 0"><button class="btn filter active" data-f="todos">Todos</button><button class="btn filter" data-f="disponible">Disponibles</button><button class="btn filter" data-f="reservado">Reservados</button><button class="btn filter" data-f="vendido">Vendidos</button></div><div id="cars" class="cars"></div></section><section class="panel" id="editor" hidden><h2>Modificar vehículo</h2><div class="form"><input type="hidden" id="id"><div class="field"><label>Marca y modelo</label><input id="modelo"></div><div class="field"><label>Precio</label><input id="precio" type="number"></div><div class="field"><label>Año</label><input id="ano" type="number"></div><div class="field"><label>Kilómetros</label><input id="km" type="number"></div><div class="field"><label>Combustible</label><input id="combustible"></div><div class="field"><label>Cambio</label><input id="cambio"></div><div class="field"><label>Estado</label><select id="estado"><option>Disponible</option><option>Reservado</option><option>Vendido</option></select></div><div class="field full"><label>Descripción</label><textarea id="descripcion"></textarea></div><div class="field full"><label>URLs de fotos</label><textarea id="imagen"></textarea></div></div><div class="form-actions"><button class="btn gold" onclick="save()">Guardar cambios</button><button class="btn" onclick="closeEditor()">Cancelar</button></div></section></div><script>const U='https://hqsiglpdnylsfbideglc.supabase.co',K='sb_publishable_elNqKmc2_3zpeDxrlFKMFw_RdDz4nXz',T='GLOW-CARS';let rows=[],filter='todos';const $=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const imgs=v=>String(v??'').split(/\n|,/).map(x=>x.trim()).filter(Boolean);const status=v=>{let s=String(v??'').toLowerCase();return s==='reservado'?'Reservado':s==='vendido'?'Vendido':'Disponible'};const money=v=>v==null||v===''?'':Number(v).toLocaleString('es-ES')+' €';async function api(path='',opt={}){const r=await fetch(U+'/rest/v1/'+T+path,{...opt,headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})},cache:'no-store'});const text=await r.text();if(!r.ok)throw new Error('HTTP '+r.status+' · '+text);return text?JSON.parse(text):[]}async function load(){ $('status').textContent='Cargando vehículos…';$('cars').innerHTML='';try{rows=await api('?select=*&order=id.desc');$('status').textContent=rows.length+' vehículos cargados correctamente.';render()}catch(e){$('status').innerHTML='<div class="error">ERROR REAL: '+esc(e.message)+'<br><br><button class="btn gold" onclick="load()">Reintentar</button></div>'}}function render(){let list=filter==='todos'?rows:rows.filter(r=>status(r.estado).toLowerCase()===filter);if(!list.length){$('cars').innerHTML='<div class="muted">No hay vehículos en este filtro.</div>';return}$('cars').innerHTML=list.map(r=>{let im=imgs(r.Imagen)[0]||'';return '<article class="car"><img src="'+esc(im)+'"><div><h3>'+esc(r['Marca-modelo']||'Vehículo')+'</h3><div class="meta"><span class="tag">'+money(r.Precio)+'</span><span class="tag">'+esc(r['Año']||'')+'</span><span class="tag">'+esc(r['Kilómetros']||'')+' km</span><span class="tag">'+status(r.estado)+'</span></div></div><div class="actions"><button class="btn gold" onclick="edit('+r.id+')">Modificar</button><button class="btn" onclick="setState('+r.id+',\'Reservado\')">Reservar</button><button class="btn" onclick="setState('+r.id+',\'Disponible\')">Disponible</button><button class="btn" onclick="setState('+r.id+',\'Vendido\')">Vendido</button></div></article>'}).join('')}function edit(id){let r=rows.find(x=>String(x.id)===String(id));if(!r)return;$('id').value=r.id;$('modelo').value=r['Marca-modelo']||'';$('precio').value=r.Precio??'';$('ano').value=r['Año']??'';$('km').value=r['Kilómetros']??'';$('combustible').value=r.Combustible||'';$('cambio').value=r.Cambio||'';$('estado').value=status(r.estado);$('descripcion').value=r['Descripción']||'';$('imagen').value=r.Imagen||'';$('editor').hidden=false;scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}function closeEditor(){$('editor').hidden=true}async function setState(id,s){try{await api('?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({estado:s})});let r=rows.find(x=>String(x.id)===String(id));if(r)r.estado=s;render();$('status').textContent='Estado actualizado: '+s}catch(e){$('status').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}async function save(){try{let id=$('id').value,p={'Marca-modelo':$('modelo').value,'Precio':$('precio').value===''?null:Number($('precio').value),'Año':$('ano').value===''?null:Number($('ano').value),'Kilómetros':$('km').value===''?null:Number($('km').value),'Combustible':$('combustible').value,'Cambio':$('cambio').value,'estado':$('estado').value,'Descripción':$('descripcion').value,'Imagen':$('imagen').value};await api('?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(p)});closeEditor();await load()}catch(e){$('status').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});load();</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GLOW CARS | Gestión</title><style>body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1000px;width:92%;margin:20px auto}.panel{background:#121212;border:1px solid #292929;border-radius:14px;padding:16px;margin-bottom:14px}.version{display:inline-block;margin:6px 0;padding:5px 8px;border:1px solid #4a3d25;border-radius:6px;color:#d8b36a;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,textarea{width:100%;box-sizing:border-box;background:#080808;color:#fff;border:1px solid #333;border-radius:7px;padding:10px}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:bold;cursor:pointer}.gold{background:#d8b36a;color:#111}.outline{background:none;color:#fff;border:1px solid #555}.row{padding:12px;border:1px solid #292929;border-radius:9px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.muted{color:#888;font-size:13px}.modal{display:none;position:fixed;inset:0;background:#000f;z-index:99;overflow:auto;padding:8px}.modal.open{display:block}.box{max-width:900px;margin:auto;background:#151515;border:1px solid #333;border-radius:14px;padding:14px}.photo{margin:14px 0;padding:10px;background:#090909;border-radius:10px}.stage{position:relative;width:100%;overflow:hidden;background:#000;touch-action:none}.stage img{display:block;width:100%;height:auto;max-height:68vh;object-fit:contain;pointer-events:none;user-select:none}.plate{position:absolute;left:37.5%;top:70%;width:25%;aspect-ratio:3.2;background:#f5f5f5;border:2px solid #111;color:#111;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(9px,2.2vw,24px);transform-origin:center;z-index:2;user-select:none;touch-action:none;cursor:grab}.plate.active{cursor:grabbing}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.tool{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#0b0b0b;border:1px solid #333;border-radius:9px;padding:8px}.tool button{min-width:48px;font-size:20px}.tool span{min-width:55px;text-align:center}.hint{font-size:12px;color:#aaa;margin-top:8px;line-height:1.45}.photoNav{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}.bigSave{width:100%;margin-top:12px;font-size:16px;padding:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{display:block}.toolbar{grid-template-columns:1fr 1fr}.stage{min-height:180px}.stage img{max-height:58vh}}</style></head><body><main class="wrap"><div class="panel"><b style="letter-spacing:4px">GLOW <span style="color:#d8b36a">CARS</span></b><p class="muted">Gestión privada</p><span class="version">PROTECCIÓN MANUAL · V4</span><h2>Añadir vehículo</h2><div class="grid"><input id="marca" placeholder="Marca y modelo"><input id="precio" type="number" placeholder="Precio"><input id="ano" type="number" placeholder="Año"><input id="km" type="number" placeholder="Kilómetros"><input id="fuel" placeholder="Combustible"><input id="cambio" placeholder="Cambio"></div><p><input id="fotos" type="file" accept="image/*" multiple></p><textarea id="descripcion" placeholder="Descripción"></textarea><div class="actions"><button class="btn gold" onclick="addCar()">Publicar vehículo</button></div><div id="status" class="muted"></div></div><div class="panel"><h2>Vehículos</h2><div id="cars">Cargando...</div></div></main><div id="modal" class="modal"><div class="box"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h2 id="title" style="margin:0">Proteger fotos</h2><p class="muted">Coloca la placa y ajústala con botones. Sin gestos de dos dedos.</p></div><button class="btn outline" onclick="closeProtect()">Cerrar</button></div><div id="photos"></div><button class="btn gold bigSave" onclick="saveProtected()">✓ Guardar fotos protegidas</button><div id="ms" class="muted"></div></div></div><script>const U='https://hqsiglpdnylsfbideglc.supabase.co',K='sb_publishable_elNqKmc2_3zpeDxrlFKMFw_RdDz4nXz',T='GLOW-CARS',H={'apikey':K,'Authorization':'Bearer '+K,'Content-Type':'application/json'};let car=null,ps=[],current=0;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(el,p){el.style.left=p.x*100+'%';el.style.top=p.y*100+'%';el.style.width=p.w*100+'%';el.style.transform='rotate('+p.r+'deg)'}function setupDrag(plate,stage,p){let dragging=false,sx=0,sy=0,ox=0,oy=0;const point=e=>e.touches?e.touches[0]:e;const down=e=>{e.preventDefault();const q=point(e);dragging=true;plate.classList.add('active');sx=q.clientX;sy=q.clientY;ox=p.x;oy=p.y};const move=e=>{if(!dragging)return;e.preventDefault();const q=point(e);p.x=Math.max(0,Math.min(1-p.w,ox+(q.clientX-sx)/stage.clientWidth));p.y=Math.max(0,Math.min(1-p.h,oy+(q.clientY-sy)/stage.clientHeight));draw(plate,p)};const up=()=>{dragging=false;plate.classList.remove('active')};plate.addEventListener('touchstart',down,{passive:false});plate.addEventListener('touchmove',move,{passive:false});plate.addEventListener('touchend',up,{passive:false});plate.addEventListener('mousedown',down);window.addEventListener('mousemove',move);window.addEventListener('mouseup',up)}function nudge(p,dx,dy){p.x=Math.max(0,Math.min(1-p.w,p.x+dx));p.y=Math.max(0,Math.min(1-p.h,p.y+dy))}function renderPhoto(i){const item=ps[i],d=$('photos');d.innerHTML='<div class="photo"><div class="muted">Foto '+(i+1)+' de '+ps.length+'</div><div class="stage"><img id="pimg" crossorigin="anonymous"><div id="plate" class="plate">GLOW CARS</div></div><div class="toolbar"><div class="tool"><button class="btn outline" onclick="size(-.02)">−</button><span id="sizeVal"></span><button class="btn outline" onclick="size(.02)">+</button></div><div class="tool"><button class="btn outline" onclick="rotate(-1)">↶</button><span id="rotVal"></span><button class="btn outline" onclick="rotate(1)">↷</button></div><div class="tool"><button class="btn outline" onclick="nudgePlate(-.01,0)">←</button><span>Mover</span><button class="btn outline" onclick="nudgePlate(.01,0)">→</button></div><div class="tool"><button class="btn outline" onclick="nudgePlate(0,-.01)">↑</button><span></span><button class="btn outline" onclick="nudgePlate(0,.01)">↓</button></div></div><div class="hint">👆 Toca cualquier punto de la foto para colocar la placa. Después puedes arrastrarla con un dedo. Usa −/+ para tamaño y ↶/↷ para girarla con precisión.</div><div class="photoNav"><button class="btn outline" onclick="prevPhoto()">← Anterior</button><button class="btn outline" onclick="nextPhoto()">Siguiente →</button></div></div>';$('pimg').src=item.url;$('pimg').onload=()=>{draw($('plate'),item.p);setupDrag($('plate'),document.querySelector('.stage'),item.p);updateLabels()};document.querySelector('.stage').addEventListener('click',e=>{if(e.target.id==='plate')return;const r=e.currentTarget.getBoundingClientRect();item.p.x=Math.max(0,Math.min(1-item.p.w,(e.clientX-r.left)/r.width-item.p.w/2));item.p.y=Math.max(0,Math.min(1-item.p.h,(e.clientY-r.top)/r.height-item.p.h/2));draw($('plate'),item.p)})}function updateLabels(){$('sizeVal').textContent=Math.round(ps[current].p.w*100)+'%';$('rotVal').textContent=Math.round(ps[current].p.r)+'°'}function size(delta){const p=ps[current].p;p.w=Math.max(.08,Math.min(.55,p.w+delta));p.h=p.w/3.2;p.x=Math.min(p.x,1-p.w);p.y=Math.min(p.y,1-p.h);draw($('plate'),p);updateLabels()}function rotate(delta){ps[current].p.r=Math.max(-180,Math.min(180,ps[current].p.r+delta));draw($('plate'),ps[current].p);updateLabels()}function nudgePlate(dx,dy){nudge(ps[current].p,dx,dy);draw($('plate'),ps[current].p)}function prevPhoto(){current=Math.max(0,current-1);renderPhoto(current)}function nextPhoto(){current=Math.min(ps.length-1,current+1);renderPhoto(current)}async function openProtect(id){const r=await fetch(U+'/rest/v1/'+T+'?id=eq.'+id+'&select=*',{headers:H}),a=await r.json();if(!a[0])return;car=a[0];const urls=String(car.Imagen||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean);if(!urls.length)return alert('Este vehículo no tiene fotos.');ps=urls.map(url=>({url,p:{x:.375,y:.70,w:.25,h:.078,r:0}}));current=0;$('title').textContent='Proteger: '+(car['Marca-modelo']||'vehículo');$('modal').classList.add('open');renderPhoto(0)}function closeProtect(){$('modal').classList.remove('open');car=null;ps=[]}function make(img,p){return new Promise((ok,no)=>{const s=Math.min(1,2200/img.naturalWidth),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s),c=document.createElement('canvas');c.width=w;c.height=h;const x=p.x*w,y=p.y*h,pw=p.w*w,ph=p.h*h,ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);ctx.save();ctx.translate(x+pw/2,y+ph/2);ctx.rotate(p.r*Math.PI/180);ctx.fillStyle='#f5f5f5';ctx.fillRect(-pw/2,-ph/2,pw,ph);ctx.strokeStyle='#111';ctx.lineWidth=Math.max(2,ph*.045);ctx.strokeRect(-pw/2,-ph/2,pw,ph);ctx.fillStyle='#111';ctx.font='900 '+Math.max(12,ph*.42)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('GLOW CARS',0,0);ctx.restore();c.toBlob(b=>b?ok(b):no('error'),'image/jpeg',.92)})}async function saveProtected(){if(!car)return;$('ms').textContent='Procesando todas las fotos...';try{const out=[];for(let i=0;i<ps.length;i++){const img=new Image();img.crossOrigin='anonymous';img.src=ps[i].url;await new Promise((ok,no)=>{img.onload=ok;img.onerror=no});const blob=await make(img,ps[i].p),path='cars/'+crypto.randomUUID()+'.jpg',r=await fetch(U+'/storage/v1/object/glow-cars/'+path,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'image/jpeg'},body:blob});if(!r.ok)throw Error(await r.text());out.push(U+'/storage/v1/object/public/glow-cars/'+path)}const r=await fetch(U+'/rest/v1/'+T+'?id=eq.'+car.id,{method:'PATCH',headers:H,body:JSON.stringify({Imagen:out.join('\n')})});if(!r.ok)throw Error(await r.text());$('ms').textContent='Guardado correctamente';setTimeout(()=>{closeProtect();load()},700)}catch(e){$('ms').textContent='Error: '+e.message}}async function addCar(){const files=[...$('fotos').files];if(!$('marca').value||!files.length)return alert('Indica marca/modelo y selecciona fotos.');$('status').textContent='Subiendo...';try{const out=[];for(const f of files){const path='cars/'+crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),r=await fetch(U+'/storage/v1/object/glow-cars/'+path,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':f.type||'image/jpeg'},body:f});if(!r.ok)throw Error(await r.text());out.push(U+'/storage/v1/object/public/glow-cars/'+path)}const body={'Marca-modelo':$('marca').value,'Precio':+$('precio').value||0,'Año':+$('ano').value||null,'Kilómetros':+$('km').value||0,'Combustible':$('fuel').value,'Cambio':$('cambio').value,'Descripción':$('descripcion').value,Imagen:out.join('\n'),estado:'Disponible'};const r=await fetch(U+'/rest/v1/'+T,{method:'POST',headers:H,body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());$('status').textContent='Publicado. Puedes proteger las fotos manualmente.';load()}catch(e){$('status').textContent='Error: '+e.message}}async function load(){const r=await fetch(U+'/rest/v1/'+T+'?select=*&order=created_at.desc',{headers:H}),a=await r.json();$('cars').innerHTML=a.map(c=>{const sold=(c.estado||'').toLowerCase()==='vendido';return '<div class="row"><div><b>'+esc(c['Marca-modelo'])+'</b><div class="muted">'+esc(c.Año)+' · '+Number(c['Kilómetros']||0).toLocaleString('es-ES')+' km · '+(sold?'VENDIDO':'DISPONIBLE')+'</div></div><div class="actions"><button class="btn outline" onclick="openProtect('+c.id+')">🔒 Proteger fotos</button><button class="btn outline" onclick="toggleSold('+c.id+','+sold+')">'+(sold?'Volver a stock':'Marcar vendido')+'</button><button class="btn outline" onclick="delCar('+c.id+')">Eliminar</button></div></div>'}).join('')||'<p class="muted">No hay vehículos.</p>'}async function toggleSold(id,sold){await fetch(U+'/rest/v1/'+T+'?id=eq.'+id,{method:'PATCH',headers:H,body:JSON.stringify({estado:sold?'Disponible':'Vendido'})});load()}async function delCar(id){if(!confirm('¿Eliminar este vehículo?'))return;await fetch(U+'/rest/v1/'+T+'?id=eq.'+id,{method:'DELETE',headers:H});load()}load();</script></body></html>

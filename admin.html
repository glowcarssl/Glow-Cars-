<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOW CARS · Administrador</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#070707;--card:#111;--gold:#d8b36a;--line:#292929;--green:#25d366;--red:#e05b5b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif}.wrap{width:94%;max-width:1200px;margin:auto}.top{position:sticky;top:0;z-index:5;background:rgba(5,5,5,.97);border-bottom:1px solid var(--line);padding:14px 0}.topbar{display:flex;align-items:center;gap:15px}.logo{height:55px;width:auto}.topbar h1{font-size:20px;margin:0}.topbar small{color:#888}.spacer{flex:1}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.gold{background:var(--gold);color:#090909}.dark{background:#171717;color:#fff;border:1px solid #444}.red{background:var(--red);color:#fff}.main{padding:30px 0 60px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:25px}.panel h2{margin:0 0 18px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--gold);font-weight:800;text-transform:uppercase;letter-spacing:.8px}.field input,.field select,.field textarea{width:100%;background:#090909;color:#fff;border:1px solid #333;border-radius:8px;padding:12px;font:inherit}.field textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.status{margin:12px 0;color:#aaa;min-height:20px}.preview-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.preview-list img{width:95px;height:70px;object-fit:cover;border-radius:8px;border:1px solid #333}.file-help{color:#888;font-size:12px;line-height:1.5}.cars{display:grid;gap:12px}.car{display:grid;grid-template-columns:150px 1fr auto;gap:18px;align-items:center;background:#0b0b0b;border:1px solid #262626;border-radius:12px;padding:12px}.car img{width:150px;height:105px;object-fit:cover;border-radius:8px;background:#151515}.car h3{margin:0 0 8px}.meta{display:flex;gap:7px;flex-wrap:wrap;color:#999;font-size:12px}.tag{background:#1b1b1b;padding:6px 8px;border-radius:6px}.car-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.empty{padding:30px;text-align:center;color:#777;border:1px dashed #333;border-radius:10px}@media(max-width:700px){.form{grid-template-columns:1fr}.field.full{grid-column:auto}.car{grid-template-columns:90px 1fr}.car img{width:90px;height:75px}.car-actions{grid-column:1/-1;justify-content:flex-start}.topbar h1{font-size:16px}.logo{height:45px}}</style></head><body><header class="top"><div class="wrap topbar"><img class="logo" src="8C982453-6D48-46D9-93F0-8BE12D44B720.png" alt="GLOW CARS"><div><h1>Panel de administración</h1><small>Subir · modificar · eliminar vehículos</small></div><div class="spacer"></div><a class="btn dark" href="./">Ver web cliente</a></div></header><main class="wrap main"><section class="panel"><h2 id="formTitle">Añadir vehículo</h2><form id="carForm"><input type="hidden" id="id"><div class="form"><div class="field"><label>Marca y modelo</label><input id="modelo" required placeholder="BMW M4 Competition"></div><div class="field"><label>Precio (€)</label><input id="precio" type="number" min="0" step="1"></div><div class="field"><label>Año</label><input id="ano" type="number" min="1900" max="2100"></div><div class="field"><label>Kilómetros</label><input id="km" type="number" min="0" step="1"></div><div class="field"><label>Combustible</label><input id="combustible" placeholder="Gasolina"></div><div class="field"><label>Cambio</label><input id="cambio" placeholder="Automático"></div><div class="field"><label>Estado</label><select id="estado"><option value="stock">En stock</option><option value="reservado">Reservado</option><option value="vendido">Vendido</option></select></div><div class="field"><label>Fotos del vehículo</label><input id="imagenFile" type="file" accept="image/*" multiple><div class="file-help">Puedes seleccionar varias fotos a la vez. En iPhone, mantén pulsado una foto y selecciona las demás.</div><div id="previewList" class="preview-list"></div></div><div class="field full"><label>URL de imagen (opcional)</label><input id="imagen" placeholder="https://... (también puedes dejarlo vacío si subes fotos)"></div><div class="field full"><label>Descripción</label><textarea id="descripcion"></textarea></div></div><div class="actions"><button class="btn gold" type="submit" id="saveBtn">Guardar vehículo</button><button class="btn dark" type="button" id="cancelBtn" hidden>Cancelar edición</button></div><div class="status" id="status"></div></form></section><section class="panel"><h2>Vehículos actuales</h2><div id="cars" class="cars"><div class="empty">Cargando...</div></div></section></main><script>const SUPABASE_URL='https://hqsiglpdnylsfbideglc.supabase.co';const SUPABASE_KEY='sb_publishable_elNqKmc2_3zpeDxrlFKMFw_RdDz4nXz';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);let rows=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}function money(v){return v===''||v==null?'':Number(v).toLocaleString('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0});}function imageList(v){return String(v??'').split(/\n|,/).map(x=>x.trim()).filter(Boolean)}async function load(){ $('cars').innerHTML='<div class="empty">Cargando vehículos...</div>';const {data,error}=await db.from('GLOW-CARS').select('*').order('id',{ascending:false});if(error){$('cars').innerHTML='<div class="empty">Error al cargar: '+esc(error.message)+'</div>';return}rows=data||[];if(!rows.length){$('cars').innerHTML='<div class="empty">No hay vehículos todavía.</div>';return}$('cars').innerHTML=rows.map(r=>'<article class="car"><img src="'+esc(imageList(r.Imagen)[0]||'')+'" onerror="this.style.display=\'none\'" alt=""><div><h3>'+esc(r['Marca-modelo']||'Vehículo')+'</h3><div class="meta"><span class="tag">'+esc(money(r.Precio))+'</span><span class="tag">'+esc(r['Año']||'')+'</span><span class="tag">'+esc(r['Kilómetros']||'')+' km</span><span class="tag">'+esc(r.Combustible||'')+'</span><span class="tag">'+esc(r.Cambio||'')+'</span><span class="tag">'+esc(r.estado||'stock')+'</span><span class="tag">'+imageList(r.Imagen).length+' foto(s)</span></div></div><div class="car-actions"><button class="btn gold" onclick="editCar('+r.id+')">Modificar</button><button class="btn red" onclick="deleteCar('+r.id+')">Eliminar</button></div></article>').join('')}async function uploadImage(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path='cars/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const {error}=await db.storage.from('glow-cars').upload(path,file,{upsert:false,contentType:file.type||'image/jpeg'});if(error)throw error;return db.storage.from('glow-cars').getPublicUrl(path).data.publicUrl}$('imagenFile').addEventListener('change',()=>{const files=[...$('imagenFile').files];$('previewList').innerHTML=files.map(f=>'<img src="'+URL.createObjectURL(f)+'" alt="">').join('')});$('carForm').addEventListener('submit',async e=>{e.preventDefault();$('saveBtn').disabled=true;$('status').textContent='Subiendo fotos...';try{let image=$('imagen').value.trim();const files=[...$('imagenFile').files];if(files.length){const urls=[];for(let i=0;i<files.length;i++){ $('status').textContent='Subiendo foto '+(i+1)+' de '+files.length+'...';urls.push(await uploadImage(files[i])) }image=urls.join('\n')}const payload={'Marca-modelo':$('modelo').value.trim(),'Precio':$('precio').value===''?null:Number($('precio').value),'Año':$('ano').value===''?null:Number($('ano').value),'Kilómetros':$('km').value===''?null:Number($('km').value),'Combustible':$('combustible').value.trim(),'Cambio':$('cambio').value.trim(),'Descripción':$('descripcion').value.trim(),'Imagen':image,'estado':$('estado').value};const id=$('id').value;const result=id?await db.from('GLOW-CARS').update(payload).eq('id',id):await db.from('GLOW-CARS').insert(payload);if(result.error)throw result.error;$('status').textContent=id?'Vehículo modificado correctamente.':'Vehículo añadido correctamente.';resetForm();await load()}catch(err){$('status').textContent='No se ha podido guardar: '+err.message}finally{$('saveBtn').disabled=false}});function editCar(id){const r=rows.find(x=>String(x.id)===String(id));if(!r)return;$('id').value=r.id;$('modelo').value=r['Marca-modelo']||'';$('precio').value=r.Precio??'';$('ano').value=r['Año']??'';$('km').value=r['Kilómetros']??'';$('combustible').value=r.Combustible||'';$('cambio').value=r.Cambio||'';$('estado').value=r.estado||'stock';$('imagen').value=r.Imagen||'';$('descripcion').value=r['Descripción']||'';$('imagenFile').value='';$('previewList').innerHTML=imageList(r.Imagen).map(u=>'<img src="'+esc(u)+'" alt="">').join('');$('formTitle').textContent='Modificar vehículo';$('saveBtn').textContent='Guardar cambios';$('cancelBtn').hidden=false;window.scrollTo({top:0,behavior:'smooth'})}async function deleteCar(id){const r=rows.find(x=>String(x.id)===String(id));if(!r)return;if(!confirm('¿Eliminar '+(r['Marca-modelo']||'este vehículo')+'?'))return;$('status').textContent='Eliminando...';const {error}=await db.from('GLOW-CARS').delete().eq('id',id);if(error){$('status').textContent='No se ha podido eliminar: '+error.message;return}$('status').textContent='Vehículo eliminado.';await load()}function resetForm(){$('id').value='';$('carForm').reset();$('estado').value='stock';$('formTitle').textContent='Añadir vehículo';$('saveBtn').textContent='Guardar vehículo';$('cancelBtn').hidden=true;$('previewList').innerHTML=''}$('cancelBtn').onclick=resetForm;load();</script></body></html>

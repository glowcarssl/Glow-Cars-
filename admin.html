<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOW CARS · Administrador</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}.wrap{width:94%;max-width:1200px;margin:auto}.top{padding:14px 0;border-bottom:1px solid #292929}.topbar{display:flex;align-items:center;gap:15px}.logo{height:55px}.spacer{flex:1}.btn{border:0;border-radius:9px;padding:12px 15px;font-weight:800;cursor:pointer}.gold{background:#d8b36a;color:#080808}.dark{background:#171717;color:#fff;border:1px solid #444}.red{background:#e05b5b;color:#fff}.main{padding:25px 0}.panel{background:#111;border:1px solid #292929;border-radius:16px;padding:20px;margin-bottom:22px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}label{font-size:12px;color:#d8b36a;font-weight:800;text-transform:uppercase}input,select,textarea{background:#090909;color:#fff;border:1px solid #333;border-radius:8px;padding:12px;font:inherit}textarea{min-height:90px}.photo-box{border:1px dashed #555;border-radius:12px;padding:14px;background:#0b0b0b}.photo-buttons{display:flex;gap:10px;flex-wrap:wrap}.photo-input{display:none}.hint{color:#888;font-size:12px;margin-top:10px}.preview-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.preview{position:relative}.preview img{width:95px;height:75px;object-fit:cover;border-radius:8px;border:1px solid #444}.preview button{position:absolute;right:3px;top:3px;width:23px;height:23px;border:0;border-radius:50%;background:#000d;color:#fff}.actions{display:flex;gap:10px;margin-top:15px}.status{min-height:20px;color:#aaa;margin-top:10px}.cars{display:grid;gap:12px}.car{display:grid;grid-template-columns:130px 1fr auto;gap:15px;align-items:center;background:#0b0b0b;border:1px solid #292929;border-radius:12px;padding:12px}.car img{width:130px;height:95px;object-fit:cover;border-radius:8px}.meta{color:#999;font-size:12px;display:flex;gap:6px;flex-wrap:wrap}.tag{background:#1b1b1b;padding:6px;border-radius:6px}.car-actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:700px){.form{grid-template-columns:1fr}.full{grid-column:auto}.car{grid-template-columns:85px 1fr}.car img{width:85px;height:70px}.car-actions{grid-column:1/-1}.logo{height:45px}}</style></head><body><header class="top"><div class="wrap topbar"><img class="logo" src="8C982453-6D48-46D9-93F0-8BE12D44B720.png"><div><strong>GLOW CARS</strong><div style="color:#888;font-size:12px">Panel de administración</div></div><div class="spacer"></div><a class="btn dark" href="./">Web cliente</a></div></header><main class="wrap main"><section class="panel"><h2 id="formTitle">Añadir vehículo</h2><form id="carForm"><input type="hidden" id="id"><div class="form"><div class="field"><label>Marca y modelo</label><input id="modelo" required></div><div class="field"><label>Precio (€)</label><input id="precio" type="number"></div><div class="field"><label>Año</label><input id="ano" type="number"></div><div class="field"><label>Kilómetros</label><input id="km" type="number"></div><div class="field"><label>Combustible</label><input id="combustible"></div><div class="field"><label>Cambio</label><input id="cambio"></div><div class="field"><label>Estado</label><select id="estado"><option value="stock">En stock</option><option value="reservado">Reservado</option><option value="vendido">Vendido</option></select></div><div class="field"><label>Fotos</label><div class="photo-box"><div class="photo-buttons"><button type="button" class="btn gold" id="choosePhotos">📷 Seleccionar fotos</button><button type="button" class="btn dark" id="takePhoto">📸 Hacer foto</button></div><input id="imagenFile" class="photo-input" type="file" accept="image/*" multiple><input id="cameraFile" class="photo-input" type="file" accept="image/*" capture="environment"><div class="hint">Selecciona varias fotos de una vez. Las fotos elegidas se mantienen aunque vuelvas a abrir la galería.</div><div id="previewList" class="preview-list"></div></div></div><div class="field full"><label>URL de imagen (opcional)</label><input id="imagen" placeholder="https://..."></div><div class="field full"><label>Descripción</label><textarea id="descripcion"></textarea></div></div><div class="actions"><button class="btn gold" type="submit" id="saveBtn">Guardar vehículo</button><button class="btn dark" type="button" id="cancelBtn" hidden>Cancelar edición</button></div><div class="status" id="status"></div></form></section><section class="panel"><h2>Vehículos actuales</h2><div id="cars" class="cars">Cargando...</div></section></main><script>const SUPABASE_URL='https://hqsiglpdnylsfbideglc.supabase.co',SUPABASE_KEY='sb_publishable_elNqKmc2_3zpeDxrlFKMFw_RdDz4nXz',db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);let rows=[],selectedFiles=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function imgs(v){return String(v??'').split(/\n|,/).map(x=>x.trim()).filter(Boolean)}function money(v){return v==null||v===''?'':Number(v).toLocaleString('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0})}function renderPreviews(){const old=imgs($('imagen').value);$('previewList').innerHTML=selectedFiles.map((f,i)=>'<div class="preview"><img src="'+URL.createObjectURL(f)+'"><button type="button" onclick="removeFile('+i+')">×</button></div>').join('')+old.map(u=>'<div class="preview"><img src="'+esc(u)+'"></div>').join('')}function addFiles(list){const incoming=[...list];selectedFiles=[...selectedFiles,...incoming];renderPreviews()}function removeFile(i){selectedFiles.splice(i,1);renderPreviews()}$('choosePhotos').onclick=()=>$('imagenFile').click();$('takePhoto').onclick=()=>$('cameraFile').click();$('imagenFile').onchange=e=>{addFiles(e.target.files);e.target.value=''};$('cameraFile').onchange=e=>{addFiles(e.target.files);e.target.value=''};$('imagen').oninput=renderPreviews;async function load(){const {data,error}=await db.from('GLOW-CARS').select('*').order('id',{ascending:false});if(error){$('cars').textContent='Error: '+error.message;return}rows=data||[];$('cars').innerHTML=rows.length?rows.map(r=>'<article class="car"><img src="'+esc(imgs(r.Imagen)[0]||'')+'"><div><h3>'+esc(r['Marca-modelo']||'Vehículo')+'</h3><div class="meta"><span class="tag">'+esc(money(r.Precio))+'</span><span class="tag">'+esc(r['Año']||'')+'</span><span class="tag">'+esc(r['Kilómetros']||'')+' km</span><span class="tag">'+imgs(r.Imagen).length+' fotos</span></div></div><div class="car-actions"><button class="btn gold" onclick="editCar('+r.id+')">Modificar</button><button class="btn red" onclick="deleteCar('+r.id+')">Eliminar</button></div></article>').join(''):'<div style="color:#777">No hay vehículos.</div>'}async function upload(f){const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path='cars/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext,{error}=await db.storage.from('glow-cars').upload(path,f,{upsert:false,contentType:f.type||'image/jpeg'});if(error)throw error;return db.storage.from('glow-cars').getPublicUrl(path).data.publicUrl}$('carForm').onsubmit=async e=>{e.preventDefault();$('saveBtn').disabled=true;try{$('status').textContent='Preparando fotos...';let urls=imgs($('imagen').value);for(let i=0;i<selectedFiles.length;i++){$('status').textContent='Subiendo foto '+(i+1)+' de '+selectedFiles.length+'...';urls.push(await upload(selectedFiles[i]))}const p={'Marca-modelo':$('modelo').value.trim(),'Precio':$('precio').value===''?null:Number($('precio').value),'Año':$('ano').value===''?null:Number($('ano').value),'Kilómetros':$('km').value===''?null:Number($('km').value),'Combustible':$('combustible').value.trim(),'Cambio':$('cambio').value.trim(),'Descripción':$('descripcion').value.trim(),'Imagen':urls.join('\n'),'estado':$('estado').value},id=$('id').value,res=id?await db.from('GLOW-CARS').update(p).eq('id',id):await db.from('GLOW-CARS').insert(p);if(res.error)throw res.error;$('status').textContent='Vehículo guardado correctamente.';resetForm();load()}catch(err){$('status').textContent='Error: '+err.message}finally{$('saveBtn').disabled=false}};function editCar(id){const r=rows.find(x=>String(x.id)===String(id));if(!r)return;$('id').value=r.id;$('modelo').value=r['Marca-modelo']||'';$('precio').value=r.Precio??'';$('ano').value=r['Año']??'';$('km').value=r['Kilómetros']??'';$('combustible').value=r.Combustible||'';$('cambio').value=r.Cambio||'';$('estado').value=r.estado||'stock';$('imagen').value=r.Imagen||'';$('descripcion').value=r['Descripción']||'';selectedFiles=[];renderPreviews();$('formTitle').textContent='Modificar vehículo';$('saveBtn').textContent='Guardar cambios';$('cancelBtn').hidden=false;scrollTo({top:0,behavior:'smooth'})}async function deleteCar(id){if(!confirm('¿Eliminar este vehículo?'))return;const {error}=await db.from('GLOW-CARS').delete().eq('id',id);if(error){$('status').textContent='Error: '+error.message;return}load()}function resetForm(){$('carForm').reset();$('id').value='';$('estado').value='stock';selectedFiles=[];$('previewList').innerHTML='';$('formTitle').textContent='Añadir vehículo';$('saveBtn').textContent='Guardar vehículo';$('cancelBtn').hidden=true}$('cancelBtn').onclick=resetForm;load();</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOW CARS | Gestión</title><style>body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1000px;width:92%;margin:20px auto}.panel{background:#121212;border:1px solid #292929;border-radius:14px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,textarea,select{width:100%;box-sizing:border-box;background:#080808;color:#fff;border:1px solid #333;border-radius:7px;padding:10px}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:bold;cursor:pointer}.gold{background:#d8b36a;color:#111}.outline{background:none;color:#fff;border:1px solid #555}.row{padding:10px;border:1px solid #292929;border-radius:9px;margin:8px 0;display:flex;gap:12px;align-items:center}.thumb{width:100px;height:70px;object-fit:cover;border-radius:7px;background:#000;flex:none}.info{flex:1;min-width:0}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.muted{color:#888;font-size:13px}.edit{display:none;margin-top:10px;padding-top:10px;border-top:1px solid #333}.edit.open{display:block}.modal{display:none;position:fixed;inset:0;background:#000f;z-index:99;overflow:auto;padding:6px}.modal.open{display:block}.box{max-width:900px;margin:auto;background:#151515;border:1px solid #333;border-radius:14px;padding:12px}.stage{position:relative;width:100%;overflow:hidden;background:#000;border-radius:8px;touch-action:none}.stage img{display:block;width:100%;height:auto;max-height:68vh;object-fit:contain}.plate{position:absolute;background:#f5f5f5;border:3px solid #111;color:#111;display:flex;align-items:center;justify-content:center;font-weight:900;z-index:3;touch-action:none;transform-origin:center}.handle{position:absolute;width:25px;height:25px;border-radius:50%;background:#d8b36a;border:3px solid #111;z-index:4}.tl{left:-14px;top:-14px}.tr{right:-14px;top:-14px}.bl{left:-14px ará de forma segura al servicio de IA.</p><div class="ai-grid"><select id="aiCar"><option value="">Selecciona un vehículo...</option></select><select id="aiFormat"><option value="9:16">Vertical 9:16 · Reels/TikTok</option><option value="16:9">Horizontal 16:9</option></select><textarea id="aiIdea" placeholder="¿Qué quieres destacar? Ej.: recién llegado de Reino Unido, 510 CV, historial, equipamiento..."></textarea><textarea id="aiStyle" placeholder="Estilo: profesional, deportivo, elegante, dinámico...">Profesional, elegante y deportivo, con ritmo para redes sociales.</textarea></div><p><input id="aiMedia" type="file" accept="image/*,video/*" multiple></p><button class="btn gold" onclick="createAIVideo()">✨ Crear vídeo con IA</button><p id="aiStatus" class="ai-status"></p><div id="aiResult"></div></section><div class="panel"><h2>Vehículos</h2><div id="cars">Cargando...</div></div></main><div id="modal" class="modal"><div class="box"><button class="btn outline" onclick="closeProtect()">Cerrar</button><h2 id="title">Proteger foto</h2><div id="photos"></div><button class="btn gold" style="width:100%;margin-top:10px" onclick="saveProtected()">✓ Guardar todas las fotos</button><p id="ms" class="muted"></p></div></div><script>const U='https://hqsiglpdnylsfbideglc.supabase.co',K='sb_publishable_elNqKmc2_3zpeDxrlFKMFw_RdDz4nXz',T='GLOW-CARS',H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};let car=null,ps=[],cur=0,vehicles=[];const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const getUrls=c=>String(c.Imagen||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean);async function addCar(){let fs=[...$('fotos').files];if(!$('marca').value||!fs.length)return alert('Indica marca/modelo y selecciona fotos.');$('status').textContent='Subiendo...';try{let out=[];for(let f of fs){let p='cars/'+crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),r=await fetch(U+'/storage/v1/object/glow-cars/'+p,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':f.type||'image/jpeg'},body:f});if(!r.ok)throw Error(await r.text());out.push(U+'/storage/v1/object/public/glow-cars/'+p)}let body={'Marca-modelo':$('marca').value,Precio:+$('precio').value||0,Año:+$('ano').value||null,'Kilómetros':+$('km').value||0,Combustible:$('fuel').value,Cambio:$('cambio').value,Descripción:$('descripcion').value,Imagen:out.join('\n'),estado:'Disponible'},r=await fetch(U+'/rest/v1/'+T,{method:'POST',headers:H,body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());$('status').textContent='Publicado correctamente';load()}catch(e){$('status').textContent='Error: '+e.message}}async function load(){let r=await fetch(U+'/rest/v1/'+T+'?select=*&order=created_at.desc',{headers:H}),a=await r.json();vehicles=a;$('aiCar').innerHTML='<option value="">Selecciona un vehículo...</option>'+a.map(c=>`<option value="${c.id}">${esc(c['Marca-modelo'])}</option>`).join('');$('cars').innerHTML=a.map(c=>{let u=getUrls(c),st=(c.estado||'Disponible');return '<div class="row"><img class="thumb" src="'+esc(u[0]||'')+'"><div class="info"><b>'+esc(c['Marca-modelo'])+'</b><div class="muted">'+esc(c.Año)+' · '+Number(c['Kilómetros']||0).toLocaleString('es-ES')+' km</div><div id="edit'+c.id+'" class="edit"><div class="grid"><input id="m'+c.id+'" value="'+esc(c['Marca-modelo'])+'"><input id="p'+c.id+'" type="number" value="'+(c.Precio||0)+'"><input id="a'+c.id+'" type="number" value="'+(c.Año||'')+'"><input id="k'+c.id+'" type="number" value="'+(c['Kilómetros']||0)+'"><input id="f'+c.id+'" value="'+esc(c.Combustible||'')+'"><input id="c'+c.id+'" value="'+esc(c.Cambio||'')+'"></div><textarea id="d'+c.id+'">'+esc(c.Descripción||'')+'</textarea><button class="btn gold" onclick="saveEdit('+c.id+')">Guardar cambios</button></div></div><div class="actions"><select onchange="setState('+c.id+',this.value)"><option '+(st==='Disponible'?'selected':'')+'>Disponible</option><option '+(st==='Reservado'?'selected':'')+'>Reservado</option><option '+(st==='Vendido'?'selected':'')+'>Vendido</option></select><button class="btn outline" onclick="toggleEdit('+c.id+')">✏️ Editar</button><button class="btn outline" onclick="openProtect('+c.id+')">🔒 Proteger fotos</button><button class="btn outline" onclick="delCar('+c.id+')">Eliminar</button></div></div>'}).join('')||'<p class="muted">No hay vehículos.</p>'}function toggleEdit(id){$('edit'+id).classList.toggle('open')}async function saveEdit(id){let b={'Marca-modelo':$('m'+id).value,Precio:+$('p'+id).value||0,Año:+$('a'+id).value||null,'Kilómetros':+$('k'+id).value||0,Combustible:$('f'+id).value,Cambio:$('c'+id).value,Descripción:$('d'+id).value},r=await fetch(U+'/rest/v1/'+T+'?id=eq.'+id,{method:'PATCH',headers:H,body:JSON.stringify(b)});if(!r.ok)return alert(await r.text());load()}async function setState(id,s){await fetch(U+'/rest/v1/'+T+'?id=eq.'+id,{method:'PATCH',headers:H,body:JSON.stringify({estado:s})});load()}async function delCar(id){if(!confirm('¿Eliminar este vehículo?'))return;await fetch(U+'/rest/v1/'+T+'?id=eq.'+id,{method:'DELETE',headers:H});load()}async function createAIVideo(){let id=$('aiCar').value,idea=$('aiIdea').value.trim(),style=$('aiStyle').value.trim(),format=$('aiFormat').value;if(!id)return alert('Selecciona primero un vehículo.');let c=vehicles.find(x=>String(x.id)===String(id));if(!c)return;let prompt=`Crea un vídeo publicitario de GLOW CARS para redes sociales sobre este vehículo: ${c['Marca-modelo']}, año ${c.Año||'no indicado'}, ${c['Kilómetros']||0} km, ${c.Combustible||''}, cambio ${c.Cambio||''}, precio ${c.Precio||0} €. Descripción disponible: ${c.Descripción||'sin descripción'}. Objetivo: presentar el coche de forma comercial y atractiva, sin inventar datos. ${idea?`Puntos que el propietario quiere destacar: ${idea}.`:''} Estilo: ${style||'profesional, elegante y deportivo'}. Formato ${format}. Incluye narración en español de España y subtítulos claros. La marca debe aparecer como GLOW CARS. Duración aproximada 25-35 segundos.`;$('aiStatus').textContent='Preparando la solicitud a la IA...';$('aiResult').innerHTML='';try{let media=[...$('aiMedia').files];let mediaNames=media.map(f=>f.name).join(', ');if(mediaNames)prompt+=` Material seleccionado por el usuario: ${mediaNames}.`;let r=await fetch(U+'/functions/v1/create-glow-video',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify({car_id:c.id,prompt,format,media_names:mediaNames})});let text=await r.text();if(!r.ok)throw Error(text);let data=JSON.parse(text);$('aiStatus').textContent=data.message||'Vídeo enviado a generación.';$('aiResult').innerHTML=data.url?`<p><a class="btn gold" target="_blank" href="${esc(data.url)}">▶ Ver vídeo generado</a></p>`:'<p class="muted">La generación está en proceso. Cuando termine podrás publicarlo en GLOW CARS TV.</p>'}catch(e){$('aiStatus').textContent='Todavía falta activar la conexión segura con HeyGen: '+e.message}}function closeProtect(){$('modal').classList.remove('open');car=null;ps=[]}async function openProtect(id){let r=await fetch(U+'/rest/v1/'+T+'?id=eq.'+id+'&select=*',{headers:H}),a=await r.json();if(!a[0])return;car=a[0];let u=getUrls(car);if(!u.length)return alert('No hay fotos');ps=u.map(url=>({url,protect:true,p:{x:.375,y:.70,w:.25,h:.078,r:0}}));$('title').textContent='Proteger: '+car['Marca-modelo'];$('modal').classList.add('open');render(0)}function render(i){cur=i;let q=ps[i],p=q.p;$('photos').innerHTML='<div class="muted">Foto '+(i+1)+' de '+ps.length+'</div><div class="switch"><input id="pt" type="checkbox" '+(q.protect?'checked':'')+' onchange="ps[cur].protect=this.checked;render(cur)"><label><b>Proteger matrícula en esta foto</b><br><span class="muted">Desactívalo para fotos laterales o sin matrícula.</span></label></div><div id="stage" class="stage"><img id="photo"><div id="plate" class="plate" style="display:'+(q.protect?'flex':'none')+';left:'+(p.x*100)+'%;top:'+(p.y*100)+'%;width:'+(p.w*100)+'%;height:'+(p.h*100)+'%;transform:rotate('+p.r+'deg)"><i class="handle tl" data-m="tl"></i><i class="handle tr" data-m="tr"></i><i class="handle bl" data-m="bl"></i><i class="handle br" data-m="br"></i><i class="line"></i><i class="rot" data-m="rot"></i><span>GLOW CARS</span></div></div><div class="muted">Mueve con el centro · ajusta con las esquinas · gira desde el punto superior.</div><div class="nav"><button class="btn outline" onclick="prev()">← Anterior</button><button class="btn outline" onclick="next()">Siguiente →</button></div>';$('photo').src=q.url;$('photo').onload=()=>q.protect&&bind($('stage'),p)}function bind(stage,p){let el=$('plate'),mode,sx,sy,ox,oy,ow,oh,or;const point=e=>e.touches?e.touches[0]:e;function down(e){e.preventDefault();let q=point(e);mode=e.target.dataset.m||'move';sx=q.clientX;sy=q.clientY;ox=p.x;oy=p.y;ow=p.w;oh=p.h;or=p.r}function move(e){if(!mode)return;e.preventDefault();let q=point(e),dx=(q.clientX-sx)/stage.clientWidth,dy=(q.clientY-sy)/stage.clientHeight;if(mode==='move'){p.x=Math.max(0,Math.min(1-p.w,ox+dx));p.y=Math.max(0,Math.min(1-p.h,oy+dy))}else if(mode==='rot'){let r=stage.getBoundingClientRect(),cx=r.left+(p.x+p.w/2)*r.width,cy=r.top+(p.y+p.h/2)*r.height;p.r=or+(Math.atan2(q.clientY-cy,q.clientX-cx)-Math.atan2(sy-cy,sx-cx))*180/Math.PI}else{let nw=ow+(mode.includes('r')?dx:-dx),nh=oh+(mode.includes('b')?dy:-dy);nw=Math.max(.08,Math.min(.7,nw));nh=Math.max(.025,Math.min(.5,nh));if(mode.includes('l'))p.x=Math.max(0,Math.min(1-nw,ox+ow-nw));if(mode.includes('t'))p.y=Math.max(0,Math.min(1-nh,oy+oh-nh));p.w=nw;p.h=nh}el.style.left=p.x*100+'%';el.style.top=p.y*100+'%';el.style.width=p.w*100+'%';el.style.height=p.h*100+'%';el.style.transform='rotate('+p.r+'deg)'}function up(){mode=null}el.addEventListener('touchstart',down,{passive:false});el.addEventListener('touchmove',move,{passive:false});el.addEventListener('touchend',up);el.addEventListener('mousedown',down);window.addEventListener('mousemove',move);window.addEventListener('mouseup',up)}function prev(){if(cur>0)render(cur-1)}function next(){if(cur<ps.length-1)render(cur+1)}async function saveProtected(){if(!car)return;$('ms').textContent='Procesando...';try{let out=[];for(let q of ps){if(!q.protect){out.push(q.url);continue}let img=new Image();img.crossOrigin='anonymous';img.src=q.url;await new Promise((a,b)=>{img.onload=a;img.onerror=b});let s=Math.min(1,2200/img.naturalWidth),w=img.naturalWidth*s,h=img.naturalHeight*s,c=document.createElement('canvas');c.width=w;c.height=h;let x=q.p.x*w,y=q.p.y*h,pw=q.p.w*w,ph=q.p.h*h,ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);ctx.save();ctx.translate(x+pw/2,y+ph/2);ctx.rotate(q.p.r*Math.PI/180);ctx.fillStyle='#f5f5f5';ctx.fillRect(-pw/2,-ph/2,pw,ph);ctx.strokeStyle='#111';ctx.strokeRect(-pw/2,-ph/2,pw,ph);ctx.fillStyle='#111';ctx.font='900 '+Math.max(12,ph*.42)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('GLOW CARS',0,0);ctx.restore();let blob=await new Promise(a=>c.toBlob(a,'image/jpeg',.92)),path='cars/'+crypto.randomUUID()+'.jpg',rr=await fetch(U+'/storage/v1/object/glow-cars/'+path,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'image/jpeg'},body:blob});if(!rr.ok)throw Error(await rr.text());out.push(U+'/storage/v1/object/public/glow-cars/'+path)}let rr=await fetch(U+'/rest/v1/'+T+'?id=eq.'+car.id,{method:'PATCH',headers:H,body:JSON.stringify({Imagen:out.join('\n')})});if(!rr.ok)throw Error(await rr.text());$('ms').textContent='Fotos guardadas';setTimeout(()=>{closeProtect();load()},700)}catch(e){$('ms').textContent='Error: '+e.message}}load();</script></body></html>

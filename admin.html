<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOW CARS | Panel propietario</title><style>:root{--bg:#080808;--card:#121212;--gold:#d8b36a;--line:#292929}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.wrap{width:92%;max-width:1050px;margin:35px auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logo{font-weight:900;letter-spacing:4px}.logo span{color:var(--gold)}.muted{color:#888;font-size:13px}.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#aaa;font-size:13px;margin-bottom:5px}input,textarea{width:100%;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:7px;padding:11px;font:inherit}textarea{min-height:90px}.file{padding:9px}.btn{border:0;border-radius:8px;padding:12px 16px;font-weight:800;cursor:pointer}.gold{background:var(--gold);color:#111}.outline{background:transparent;color:#fff;border:1px solid #555}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.status{margin-top:12px;color:#aaa}.row{display:flex;justify-content:space-between;align-items:center;gap:15px;background:#0b0b0b;border:1px solid #292929;border-radius:10px;padding:14px;margin:8px 0}.row strong{display:block}.edit{display:none;background:#171717;border:1px solid #333;border-radius:10px;padding:15px;margin-top:8px}.edit.open{display:block}.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.thumb{width:70px;height:50px;object-fit:cover;border-radius:6px;margin-right:10px;vertical-align:middle}.previews{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.previews img{width:90px;height:65px;object-fit:cover;border-radius:7px;border:1px solid #333}@media(max-width:650px){.grid,.editgrid{grid-template-columns:1fr}.row{display:block}.row .actions{margin-top:10px}.top{align-items:flex-start;gap:10px}}</style></head><body><main class="wrap"><div class="top"><div class="logo">GLOW <span>CARS</span><div class="muted">Panel propietario · Gestión de stock</div></div><a class="btn outline" href="index.html">Ver web</a></div><section class="panel"><h2>Añadir vehículo</h2><p class="muted">Puedes seleccionar directamente las fotos desde el iPhone. No necesitas subirlas a GitHub.</p><div class="grid"><div><label>Marca y modelo</label><input id="marca"></div><div><label>Precio (€)</label><input id="precio" type="number"></div><div><label>Año</label><input id="ano" type="number"></div><div><label>Kilómetros</label><input id="km" type="number"></div><div><label>Combustible</label><input id="fuel"></div><div><label>Cambio</label><input id="cambio"></div></div><div style="margin-top:12px"><label>Fotos del vehículo</label><input id="fotos" class="file" type="file" accept="image/*" multiple onchange="previewFiles()"><div id="previews" class="previews"></div><p class="muted">Puedes seleccionar varias fotos a la vez desde Fotos o Archivos del iPhone.</p></div><div style="margin-top:12px"><label>Descripción</label><textarea id="descripcion"></textarea></div><div class="actions"><button id="publish" class="btn gold" onclick="addCar()">Publicar vehículo</button><button class="btn outline" onclick="clearForm()">Limpiar</button></div><div id="status" class="status"></div></section><section class="panel"><h2>Stock publicado</h2><div id="cars">Cargando...</div></section></main><script>const U='https://hqsiglpdnylsfbideglc.supabase.co',K='sb_publishable_elNqKmc2_3zpeDxrlFKMFw_RdDz4nXz',T='GLOW-CARS',B='glow-cars';const headers={'apikey':K,'Authorization':`Bearer ${K}`,'Content-Type':'application/json'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function previewFiles(){const box=document.querySelector('#previews');box.innerHTML='';[...document.querySelector('#fotos').files].forEach(f=>{const img=document.createElement('img');img.src=URL.createObjectURL(f);box.appendChild(img)})}async function uploadPhotos(files){const urls=[];for(const file of files){const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`cars/${crypto.randomUUID()}.${ext}`;const r=await fetch(`${U}/storage/v1/object/${B}/${path}`,{method:'POST',headers:{apikey:K,Authorization:`Bearer ${K}`,'Content-Type':file.type||'image/jpeg','x-upsert':'false'},body:file});if(!r.ok)throw new Error('Error al subir fotos ('+r.status+'): '+await r.text());urls.push(`${U}/storage/v1/object/public/${B}/${path}`)}return urls}async function load(){try{const r=await fetch(`${U}/rest/v1/${encodeURIComponent(T)}?select=*&order=created_at.desc`,{headers});if(!r.ok)throw new Error(await r.text());const data=await r.json();const b=document.querySelector('#cars');if(!data.length){b.innerHTML='<p class="muted">No hay vehículos publicados.</p>';return}b.innerHTML=data.map(c=>{const image=String(c.Imagen||'').split(/\n|,/)[0].trim();return `<div class="row"><div>${image?`<img class="thumb" src="${esc(image)}">`:''}<strong>${esc(c['Marca-modelo'])}</strong><span class="muted">${Number(c.Precio||0).toLocaleString('es-ES')} € · ${esc(c.Año)} · ${Number(c['Kilómetros']||0).toLocaleString('es-ES')} km</span></div><div class="actions"><button class="btn outline" onclick="toggleEdit(${c.id})">Editar</button><button class="btn outline" onclick="delCar(${c.id})">Eliminar</button></div></div><div id="edit-${c.id}" class="edit"><div class="editgrid"><div><label>Marca y modelo</label><input id="e-marca-${c.id}" value="${esc(c['Marca-modelo'])}"></div><div><label>Precio</label><input id="e-precio-${c.id}" type="number" value="${c.Precio??''}"></div><div><label>Año</label><input id="e-ano-${c.id}" type="number" value="${c.Año??''}"></div><div><label>Kilómetros</label><input id="e-km-${c.id}" type="number" value="${c['Kilómetros']??''}"></div><div><label>Combustible</label><input id="e-fuel-${c.id}" value="${esc(c.Combustible)}"></div><div><label>Cambio</label><input id="e-cambio-${c.id}" value="${esc(c.Cambio)}"></div></div><div style="margin-top:10px"><label>Fotos actuales</label><textarea id="e-imagen-${c.id}">${esc(c.Imagen)}</textarea></div><div style="margin-top:10px"><label>Añadir más fotos desde el iPhone</label><input id="e-fotos-${c.id}" class="file" type="file" accept="image/*" multiple></div><div style="margin-top:10px"><label>Descripción</label><textarea id="e-desc-${c.id}">${esc(c.Descripción)}</textarea></div><div class="actions"><button class="btn gold" onclick="saveCar(${c.id})">Guardar cambios</button><button class="btn outline" onclick="toggleEdit(${c.id})">Cancelar</button></div></div>`}).join('')}catch(e){document.querySelector('#cars').innerHTML='<p class="muted">Error cargando stock: '+esc(e.message)+'</p>'}}function toggleEdit(id){document.querySelector(`#edit-${id}`).classList.toggle('open')}async function addCar(){const s=document.querySelector('#status'),button=document.querySelector('#publish');const files=[...document.querySelector('#fotos').files];const body={'Marca-modelo':marca.value.trim(),'Precio':Number(precio.value)||0,'Año':Number(ano.value)||null,'Kilómetros':Number(km.value)||0,'Combustible':fuel.value.trim(),'Cambio':cambio.value.trim(),'Descripción':descripcion.value.trim(),'Imagen':''};if(!body['Marca-modelo']){s.textContent='Escribe marca y modelo.';return}if(!files.length){s.textContent='Selecciona al menos una foto del vehículo.';return}button.disabled=true;s.textContent='Subiendo fotos y publicando...';try{body.Imagen=(await uploadPhotos(files)).join('\n');const r=await fetch(`${U}/rest/v1/${encodeURIComponent(T)}`,{method:'POST',headers,body:JSON.stringify(body)});if(!r.ok)throw new Error('Error al guardar vehículo ('+r.status+'): '+await r.text());s.textContent='Vehículo publicado correctamente.';clearForm();await load()}catch(e){s.textContent='No se pudo publicar: '+e.message}finally{button.disabled=false}}async function saveCar(id){try{let urls=document.querySelector(`#e-imagen-${id}`).value.trim().split(/\n|,/).map(x=>x.trim()).filter(Boolean);const files=[...document.querySelector(`#e-fotos-${id}`).files];if(files.length)urls=urls.concat(await uploadPhotos(files));const body={'Marca-modelo':document.querySelector(`#e-marca-${id}`).value.trim(),'Precio':Number(document.querySelector(`#e-precio-${id}`).value)||0,'Año':Number(document.querySelector(`#e-ano-${id}`).value)||null,'Kilómetros':Number(document.querySelector(`#e-km-${id}`).value)||0,'Combustible':document.querySelector(`#e-fuel-${id}`).value.trim(),'Cambio':document.querySelector(`#e-cambio-${id}`).value.trim(),'Imagen':urls.join('\n'),'Descripción':document.querySelector(`#e-desc-${id}`).value.trim()};const r=await fetch(`${U}/rest/v1/${encodeURIComponent(T)}?id=eq.${id}`,{method:'PATCH',headers,body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());load()}catch(e){alert('No se pudieron guardar los cambios: '+e.message)}}async function delCar(id){if(!confirm('¿Eliminar este vehículo del catálogo?'))return;const r=await fetch(`${U}/rest/v1/${encodeURIComponent(T)}?id=eq.${id}`,{method:'DELETE',headers});if(!r.ok){alert('No se pudo eliminar el vehículo: '+await r.text());return}load()}function clearForm(){['marca','precio','ano','km','fuel','cambio','descripcion'].forEach(id=>document.getElementById(id).value='');document.querySelector('#fotos').value='';document.querySelector('#previews').innerHTML='';document.querySelector('#status').textContent=''}load();</script></body></html>

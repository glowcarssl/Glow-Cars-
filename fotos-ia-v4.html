<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>GLOW CARS · Fotos IA v4</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}.wrap{width:96%;max-width:1200px;margin:auto}.top{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid #222}.brand{font-size:27px;font-weight:900;letter-spacing:3px;color:#e4b25b}.sp{flex:1}.btn{border:1px solid #444;background:#151515;color:#fff;border-radius:10px;padding:12px 15px;font-weight:800;text-decoration:none}.gold{background:linear-gradient(#f1c56c,#c98e30);color:#080808}.panel{background:#0b0b0b;border:1px solid #292929;border-radius:16px;padding:18px;margin:18px 0}.field{margin:14px 0}.field label{display:block;font-weight:800;margin-bottom:7px}select,input[type=file],input[type=range]{width:100%}select,input[type=file]{background:#080808;color:#fff;border:1px solid #333;border-radius:9px;padding:12px;font:inherit}.status{margin:12px 0;color:#aaa}.ok{color:#7bd989}.err{color:#ff7777}.preview{border:1px solid #222;border-radius:14px;overflow:hidden;background:#000;margin-top:18px;min-height:260px;display:flex;align-items:center;justify-content:center}.preview img{display:block;width:100%;height:auto}.row{display:grid;grid-template-columns:1fr 72px;gap:10px;align-items:center}.pill{background:#161616;border:1px solid #333;border-radius:8px;padding:8px;text-align:center}.thumb img{width:120px;height:85px;object-fit:cover;border-radius:9px;margin-top:10px}.actions{display:grid;gap:10px;margin-top:14px}@media(min-width:900px){.grid{display:grid;grid-template-columns:360px 1fr;gap:16px}}</style></head><body><div class="wrap"><div class="top"><div class="brand">GLOW CARS · FOTOS IA</div><div class="sp"></div><a class="btn" href="admin.html">← Volver</a></div><div class="grid"><section class="panel"><h1>Foto de exposición</h1><p>Sube la foto y la colocamos sobre el showroom aprobado.</p><div class="field"><label>Vehículo</label><select id="vehicle"><option value="">Cargando vehículos…</option></select></div><div class="field"><label>Foto</label><input id="files" type="file" accept="image/*"><div class="thumb" id="thumb"></div></div><div class="field"><label>Tamaño del coche</label><div class="row"><input id="scale" type="range" min="95" max="135" value="116"><div class="pill" id="scaleVal">116%</div></div></div><div id="status" class="status">Preparando…</div><div class="actions"><button id="saveBtn" class="btn gold" disabled>💾 Guardar foto en vehículo</button></div></section><section class="panel"><h2>Resultado</h2><div class="preview" id="preview"><span>Cargando showroom…</span></div></section></div></div><script>(function(){const U='https://hqsiglpdnylsfbideglc.supabase.co',K='sb_publishable_elNqKmc2_3zpeDxrlFKMFw_RdDz4nXz',T='GLOW-CARS',BUCKET='glow-cars';const GH='https://api.github.com/repos/glowcarssl/Glow-Cars-/contents/assets/showroom-aprobado-real-v1.jpg?ref=main';const $=id=>document.getElementById(id);let rows=[],bgImg=null,lastFile=null,lastResult=null,remover=null;function st(t,c=''){const e=$('status');e.textContent=t;e.className='status '+c}async function api(path,opt={}){const r=await fetch(U+'/rest/v1/'+T+path,{...opt,headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',Prefer:'return=representation'},cache:'no-store'});const tx=await r.text();if(!r.ok)throw Error(tx||('HTTP '+r.status));return tx?JSON.parse(tx):[]}async function loadVehicles(){try{rows=await api('?select=*&order=id.desc');$('vehicle').innerHTML='<option value="">Selecciona un vehículo</option>'+rows.map(r=>'<option value="'+r.id+'">'+String(r['Marca-modelo']||'Vehículo')+' · '+String(r['Año']||'')+'</option>').join('')}catch(e){$('vehicle').innerHTML='<option value="">Error cargando vehículos</option>';st('❌ Error cargando vehículos: '+e.message,'err')}}function imgFromBlob(b){return new Promise((ok,no)=>{const u=URL.createObjectURL(b),i=new Image();i.onload=()=>ok({img:i,url:u});i.onerror=()=>{URL.revokeObjectURL(u);no(Error('Safari no pudo decodificar los bytes del showroom'))};i.src=u})}async function loadShowroom(){try{st('Descargando showroom desde GitHub…');const r=await fetch(GH,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});if(!r.ok)throw Error('GitHub respondió HTTP '+r.status);const j=await r.json();if(!j.content)throw Error('GitHub no devolvió el contenido del archivo');const b64=String(j.content).replace(/\s/g,'');let bin;try{bin=atob(b64)}catch(_){throw Error('El Base64 del showroom no se pudo decodificar')};const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(bytes.length<4||bytes[0]!==0xff||bytes[1]!==0xd8)throw Error('El archivo recibido no empieza como JPEG');const blob=new Blob([bytes],{type:'image/jpeg'});const out=await imgFromBlob(blob);bgImg=out.img;$('preview').innerHTML='';$('preview').appendChild(bgImg);st('✅ Showroom cargado. Sube una foto.','ok');if(lastFile)make()}catch(e){st('❌ Fallo cargando showroom: '+e.message,'err');$('preview').innerHTML='<span style="color:#ff7777">'+e.message+'</span>'}}function imgFromFile(f){return new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>ok(i);i.onerror=()=>no(Error('No se pudo leer la foto'));i.src=u})}function imgFromCut(b){return new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(b);i.onload=()=>ok(i);i.onerror=()=>no(Error('No se pudo leer el recorte'));i.src=u})}function hasAlpha(img){const c=document.createElement('canvas'),s=Math.min(1,450/Math.max(img.naturalWidth,img.naturalHeight));c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height).data;let n=0;for(let i=3;i<d.length;i+=4)if(d[i]<245)n++;return n>(d.length/4)*.02}async function cutout(file){const img=await imgFromFile(file);if(hasAlpha(img))return img;if(!remover){st('Cargando recorte automático…');const m=await import('https://esm.sh/@imgly/background-removal@1.7.0?bundle');remover=m.removeBackground||(m.default&&m.default.removeBackground)||m.default}const b=await remover(file,{publicPath:'https://staticimgly.com/@imgly/background-removal-data/1.7.0/dist/',proxyToWorker:false,model:'isnet_quint8',output:{format:'image/png'}});return imgFromCut(b)}function bounds(img){const c=document.createElement('canvas'),s=Math.min(1,800/Math.max(img.naturalWidth,img.naturalHeight));c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));const q=c.getContext('2d',{willReadFrequently:true});q.drawImage(img,0,0,c.width,c.height);const d=q.getImageData(0,0,c.width,c.height).data;let minX=c.width,minY=c.height,maxX=-1,maxY=-1;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(d[(y*c.width+x)*4+3]>30){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}if(maxX<0)return{sx:0,sy:0,sw:img.naturalWidth,sh:img.naturalHeight};return{sx:minX/s,sy:minY/s,sw:(maxX-minX+1)/s,sh:(maxY-minY+1)/s}}async function make(){if(!lastFile||!bgImg)return;st('Integrando coche…');$('saveBtn').disabled=true;try{const car=await cutout(lastFile),b=bounds(car),c=document.createElement('canvas');c.width=1600;c.height=1000;const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(bgImg,0,0,1600,1000);const sc=Number($('scale').value)/100,fit=Math.min((1500*sc)/b.sw,(790*sc)/b.sh),dw=b.sw*fit,dh=b.sh*fit,dx=(1600-dw)/2,ground=968,dy=ground-dh;x.save();x.globalAlpha=.32;x.filter='blur(24px)';x.fillStyle='#000';x.beginPath();x.ellipse(dx+dw/2,ground+2,Math.max(210,dw*.34),Math.max(18,dh*.04),0,0,Math.PI*2);x.fill();x.restore();x.drawImage(car,b.sx,b.sy,b.sw,b.sh,dx,dy,dw,dh);const blob=await new Promise((ok,no)=>c.toBlob(v=>v?ok(v):no(Error('No se pudo generar la imagen')),'image/jpeg',.96));lastResult=new File([blob],'glow-'+Date.now()+'.jpg',{type:'image/jpeg'});$('preview').innerHTML='<img src="'+URL.createObjectURL(lastResult)+'">';st('✅ Resultado listo.','ok');$('saveBtn').disabled=false}catch(e){st('❌ '+e.message,'err')}}async function upload(file,path){const r=await fetch(U+'/storage/v1/object/'+BUCKET+'/'+path,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':file.type,'x-upsert':'false'},body:file});if(!r.ok)throw Error(await r.text());return U+'/storage/v1/object/public/'+BUCKET+'/'+path}$('files').onchange=function(){lastFile=this.files&&this.files[0]||null;lastResult=null;if(!lastFile)return;$('thumb').innerHTML='<img src="'+URL.createObjectURL(lastFile)+'">';if(bgImg)make()};$('scale').oninput=function(){$('scaleVal').textContent=this.value+'%';if(lastFile&&bgImg)make()};$('saveBtn').onclick=async function(){const id=$('vehicle').value;if(!id)return st('Selecciona el vehículo.','err');if(!lastResult)return;const row=rows.find(r=>String(r.id)===String(id));try{$('saveBtn').disabled=true;st('Guardando…');const url=await upload(lastResult,'cars/'+Date.now()+'-showroom.jpg');const old=String(row.Imagen||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean);await api('?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({Imagen:old.concat([url]).join('\n')})});st('✅ Foto guardada.','ok');$('saveBtn').disabled=false}catch(e){st('❌ '+e.message,'err');$('saveBtn').disabled=false}};loadVehicles();loadShowroom()})();</script></body></html>

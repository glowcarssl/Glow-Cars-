<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOW CARS · Facturas</title><style>*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;width:92%;margin:25px auto}.panel,.card{background:#121212;border:1px solid #292929;border-radius:14px;padding:18px;margin-bottom:14px}.logo{font-size:24px;font-weight:900;letter-spacing:4px}.logo span{color:#d8b36a}.muted{color:#999}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;color:#aaa;font-size:12px;margin:9px 0 5px}input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #444;background:#080808;color:#fff}.full{grid-column:1/-1}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:bold;margin:5px 5px 0 0;background:#d8b36a;color:#111}.outline{background:transparent;color:#fff;border:1px solid #555}.invoice{background:#fff;color:#111;padding:30px;max-width:800px;margin:auto}.invoice table{width:100%;border-collapse:collapse;margin-top:20px}.invoice th,.invoice td{padding:9px;border-bottom:1px solid #ddd;text-align:left}.right{text-align:right}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}@media print{body{background:#fff}.no-print{display:none!important}.invoice{max-width:none;margin:0}}</style></head><body><div id="login" class="wrap"><div class="panel"><div class="logo">GLOW <span>CARS</span></div><h2>Facturas</h2><label>Email</label><input id="email" type="email"><label>Contraseña</label><input id="password" type="password"><button id="loginBtn" class="btn">Acceder</button><p id="msg" class="muted"></p></div></div><div id="app" class="wrap hidden"><div class="panel"><div class="logo">GLOW <span>CARS</span></div><p class="muted">Ver, modificar, imprimir y compartir facturas.</p><div id="list"></div></div><div id="editor" class="panel hidden"><h2>Modificar factura <span id="editNumber"></span></h2><div class="grid"><div><label>Fecha</label><input id="date" type="date"></div><div><label>Cliente</label><input id="client"></div><div><label>NIF/CIF</label><input id="taxid"></div><div><label>Teléfono</label><input id="phone"></div><div class="full"><label>Dirección</label><input id="address"></div><div><label>Vehículo</label><input id="vehicle"></div><div><label>Matrícula</label><input id="plate"></div><div><label>Importe</label><input id="amount" type="number" step="0.01"></div><div><label>Régimen</label><select id="tax"><option value="rebu">REBU</option><option value="iva">IVA 21%</option></select></div><div><label>Forma de pago</label><select id="payment"><option>Transferencia bancaria</option><option>Financiación</option><option>Efectivo</option><option>Tarjeta</option><option>Otro</option></select></div><div class="full"><label>Concepto</label><input id="concept"></div><div class="full"><label>Observaciones</label><textarea id="notes"></textarea></div></div><button id="save" class="btn">Guardar cambios</button><button id="cancel" class="btn outline">Cancelar</button><p id="editMsg" class="muted"></p></div><div id="viewer" class="panel hidden"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://hqsiglpdnylsfbideglc.supabase.co',K='sb_publishable_elNqKmc2_3zpeDxrlFKMFw_RdDz4nXz';let s,rows=[],current=null;const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),eur=x=>Number(x||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});function show(){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}async function login(){$('msg').textContent='Comprobando acceso...';try{let r=await s.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;show()}catch(e){$('msg').textContent='No se pudo acceder: '+e.message}}async function load(){let r=await s.from('GLOW-CARS-INVOICES').select('*').order('invoice_year',{ascending:false}).order('invoice_number',{ascending:false});if(r.error){$('list').textContent='Error: '+r.error.message;return}rows=r.data||[];$('list').innerHTML=rows.length?rows.map((x,i)=>`<div class="card"><b>${esc(x.invoice_number)}</b><div class="muted">${esc(x.invoice_date)} · ${esc(x.client_name)} · ${esc(x.vehicle)} · ${eur(x.sale_price)} €</div><button class="btn" onclick="view(${i})">👁️ Ver factura</button><button class="btn outline" onclick="edit(${i})">✏️ Modificar</button></div>`).join(''):'<p class="muted">No hay facturas.</p>'}function edit(i){current=rows[i];$('editor').classList.remove('hidden');$('viewer').classList.add('hidden');$('editNumber').textContent=current.invoice_number;['date','client','taxid','phone','address','vehicle','plate','amount','tax','payment','concept','notes'].forEach(k=>{const map={date:'invoice_date',client:'client_name',taxid:'client_tax_id',phone:'client_phone',address:'client_address',vehicle:'vehicle',plate:'registration',amount:'sale_price',tax:'tax_type',payment:'payment_method',concept:'concept',notes:'observations'};$(k).value=current[map[k]]??''})}async function save(){if(!current)return;const p={invoice_date:$('date').value,client_name:$('client').value.trim(),client_tax_id:$('taxid').value.trim(),client_phone:$('phone').value.trim(),client_address:$('address').value.trim(),vehicle:$('vehicle').value.trim(),registration:$('plate').value.trim(),sale_price:Number($('amount').value),tax_type:$('tax').value,payment_method:$('payment').value,concept:$('concept').value.trim(),observations:$('notes').value.trim()};let r=await s.from('GLOW-CARS-INVOICES').update(p).eq('id',current.id);if(r.error){$('editMsg').textContent='Error: '+r.error.message;return}$('editMsg').textContent='Factura modificada correctamente.';$('editor').classList.add('hidden');load()}function invoice(x){const b=Number(x.sale_price||0),isRebu=x.tax_type==='rebu',iva=isRebu?0:b*.21;return `<div class="invoice"><div style="display:flex;justify-content:space-between;border-bottom:2px solid #d8b36a;padding-bottom:15px"><div><b style="font-size:25px">GLOW <span style="color:#b58b3c">CARS</span></b><br>GLOW CARS S.L.</div><div class="right"><h1 style="margin:0">FACTURA</h1><b>${esc(x.invoice_number)}</b><br>${esc(x.invoice_date)}</div></div><h3>Cliente</h3><b>${esc(x.client_name)}</b><br>NIF/CIF: ${esc(x.client_tax_id)}<br>${esc(x.client_address)}<br>${esc(x.client_phone)}<table><tr><th>Concepto</th><th>Vehículo</th><th>Matrícula</th><th>Importe</th></tr><tr><td>${esc(x.concept||'Venta de vehículo')}</td><td>${esc(x.vehicle)}</td><td>${esc(x.registration)}</td><td>${eur(b)} €</td></tr></table><p>Régimen fiscal: ${isRebu?'REBU':'IVA 21%'}<br>Forma de pago: ${esc(x.payment_method)}</p>${isRebu?'<p style="font-size:12px;margin-top:12px"><b>Factura emitida bajo el REGIMEN ESPECIAL DE BIENES USADOS, Articulo 135 a 139 LIVA.</b></p>':''}<div class="right"><b>${!isRebu?'Base: '+eur(b)+' €<br>IVA: '+eur(iva)+' €<br>':''}TOTAL: ${eur(b+iva)} €</b></div>${x.observations?'<p><b>Observaciones</b><br>'+esc(x.observations)+'</p>':''}<div class="no-print"><button class="btn" onclick="print()">📄 PDF</button><button class="btn outline" onclick="share()">📤 Compartir</button><button class="btn outline" onclick="closeView()">← Volver</button></div></div>`}function view(i){current=rows[i];$('editor').classList.add('hidden');$('viewer').classList.remove('hidden');$('viewer').innerHTML=invoice(current);window.scrollTo(0,0)}function closeView(){$('viewer').classList.add('hidden');load()}async function share(){if(!current)return;let text='Factura '+current.invoice_number+' · GLOW CARS · '+current.client_name+' · '+current.vehicle+' · '+eur(current.sale_price)+' €';if(navigator.share)try{await navigator.share({title:'Factura '+current.invoice_number,text})}catch(e){}}$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('save').onclick=save;$('cancel').onclick=()=>{$('editor').classList.add('hidden')};s=window.supabase.createClient(U,K);s.auth.getSession().then(r=>{if(r.data.session)show()});</script></body></html>

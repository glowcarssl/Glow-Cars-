<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOW CARS | Facturación</title><style>:root{--bg:#080808;--card:#121212;--gold:#d8b36a;--line:#292929;--muted:#999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif}.wrap{width:94%;max-width:1100px;margin:24px auto 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.logo{font-weight:950;letter-spacing:4px;font-size:22px}.logo span{color:var(--gold)}.muted{color:var(--muted);font-size:13px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;color:#aaa;font-size:13px;margin:0 0 6px}input,textarea,select{width:100%;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:8px;padding:11px;font:inherit}textarea{min-height:82px;resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:9px;padding:12px 16px;font-weight:800;cursor:pointer}.gold{background:var(--gold);color:#111}.outline{background:transparent;color:#fff;border:1px solid #555}.danger{border-color:#733;color:#f5b0b0}.status{margin-top:12px;color:#aaa}.invoice-list{display:grid;gap:8px}.invoice-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0b0b0b;border:1px solid #292929;border-radius:10px;padding:13px}.invoice-row strong{display:block}.invoice-actions{display:flex;gap:7px;flex-wrap:wrap}.small{padding:8px 10px;font-size:12px}.hidden{display:none}.hint{color:#777;font-size:12px;margin-top:7px}.print-only{display:none}.invoice-paper{background:#fff;color:#111;max-width:850px;margin:0 auto;padding:45px}.invoice-paper h1{margin:0;font-size:30px;letter-spacing:3px}.invoice-paper .goldtxt{color:#9a742c}.invoice-head{display:flex;justify-content:space-between;gap:30px;border-bottom:2px solid #222;padding-bottom:20px;margin-bottom:25px}.invoice-meta{text-align:right}.invoice-meta strong{font-size:20px}.invoice-cols{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-bottom:25px}.invoice-paper h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#666;margin:0 0 8px}.invoice-paper p{margin:4px 0;line-height:1.45}.invoice-table{width:100%;border-collapse:collapse;margin:25px 0}.invoice-table th,.invoice-table td{padding:11px 8px;border-bottom:1px solid #ddd;text-align:left}.invoice-table th:last-child,.invoice-table td:last-child{text-align:right}.totals{margin-left:auto;width:310px}.totals div{display:flex;justify-content:space-between;padding:6px 0}.totals .total{border-top:2px solid #222;font-size:20px;font-weight:900;margin-top:6px;padding-top:10px}.invoice-foot{margin-top:45px;padding-top:15px;border-top:1px solid #ddd;color:#666;font-size:11px}@media(max-width:650px){.grid,.invoice-cols{grid-template-columns:1fr}.top{align-items:flex-start}.invoice-row{display:block}.invoice-actions{margin-top:10px}.invoice-paper{padding:25px}.invoice-head{display:block}.invoice-meta{text-align:left;margin-top:15px}.totals{width:100%}}@media print{body{background:#fff}.screen{display:none!important}.print-only{display:block!important}.invoice-paper{max-width:none;margin:0;padding:0}.invoice-paper *{color:#111!important}.invoice-paper .goldtxt{color:#7d5a1e!important}@page{size:A4;margin:18mm}}</style></head><body><main class="wrap screen"><div class="top"><div><div class="logo">GLOW <span>CARS</span></div><div class="muted">Facturación · uso privado</div></div><a class="btn outline" href="admin.html">Volver al panel</a></div><section class="panel"><h2>Nueva factura</h2><p class="muted">La numeración empieza en N40-2026. En 2027 comenzará automáticamente en N1-2027.</p><div class="grid"><div><label>Número</label><input id="number" readonly></div><div><label>Fecha</label><input id="date" type="date"></div><div><label>Cliente / razón social</label><input id="clientName"></div><div><label>DNI / NIF / CIF</label><input id="clientId"></div><div><label>Dirección</label><input id="clientAddress"></div><div><label>Teléfono</label><input id="clientPhone"></div><div><label>Marca y modelo</label><input id="car"></div><div><label>Matrícula</label><input id="plate"></div><div><label>Precio base / importe</label><input id="base" type="number" min="0" step="0.01"></div><div><label>Régimen fiscal</label><select id="taxType"><option value="rebu">REBU</option><option value="iva">IVA 21%</option><option value="exento">Exento / 0%</option></select></div><div><label>Forma de pago</label><select id="payment"><option>Transferencia bancaria</option><option>Financiación</option><option>Efectivo</option><option>Tarjeta</option><option>Otro</option></select></div><div><label>Concepto</label><input id="concept" value="Venta de vehículo"></div><div class="full"><label>Observaciones</label><textarea id="notes"></textarea></div></div><div class="actions"><button class="btn gold" onclick="saveInvoice()">Guardar factura</button><button class="btn outline" onclick="previewInvoice()">Vista previa / PDF</button><button class="btn outline" onclick="newInvoice()">Nueva</button></div><div id="status" class="status"></div></section><section class="panel"><h2>Facturas guardadas</h2><div id="list" class="invoice-list"></div></section></main><section id="printArea" class="print-only"></section><script>const KEY='glowcars_facturas_v1';let editingId=null;const $=id=>document.getElementById(id);const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};const year=()=>new Date(($('date').value||today())+'T12:00:00').getFullYear();function invoices(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function nextNumber(y){const list=invoices().filter(x=>Number(x.year)===Number(y));if(Number(y)===2026&&!list.length)return 40;return list.reduce((m,x)=>Math.max(m,Number(x.seq)||0),0)+1}function setNumber(){const y=year();$('number').value=`N${nextNumber(y)}-${y}`}function newInvoice(){editingId=null;document.querySelectorAll('input,textarea').forEach(e=>{if(!['number','date'].includes(e.id))e.value=''});$('date').value=today();$('taxType').value='rebu';$('payment').value='Transferencia bancaria';$('concept').value='Venta de vehículo';$('notes').value='';setNumber();$('status').textContent=''}function formData(){const date=$('date').value||today();const y=new Date(date+'T12:00:00').getFullYear();const existing=editingId?invoices().find(x=>x.id===editingId):null;const seq=existing?existing.seq:nextNumber(y);return{id:existing?.id||crypto.randomUUID(),seq,year:y,number:`N${seq}-${y}`,date,clientName:$('clientName').value.trim(),clientId:$('clientId').value.trim(),clientAddress:$('clientAddress').value.trim(),clientPhone:$('clientPhone').value.trim(),car:$('car').value.trim(),plate:$('plate').value.trim(),base:Number($('base').value)||0,taxType:$('taxType').value,payment:$('payment').value,concept:$('concept').value.trim(),notes:$('notes').value.trim()}}function saveInvoice(){const inv=formData();if(!inv.clientName){$('status').textContent='Indica el nombre o razón social del cliente.';return}if(!inv.car){$('status').textContent='Indica el vehículo.';return}if(inv.base<=0){$('status').textContent='Indica el importe de la factura.';return}const list=invoices();const idx=list.findIndex(x=>x.id===inv.id);if(idx>=0)list[idx]=inv;else list.unshift(inv);localStorage.setItem(KEY,JSON.stringify(list));editingId=inv.id;$('number').value=inv.number;$('status').textContent=`Factura ${inv.number} guardada correctamente.`;renderList()}function tax(inv){if(inv.taxType==='iva')return inv.base*.21;return 0}function total(inv){return inv.base+tax(inv)}function labelTax(inv){return inv.taxType==='iva'?'IVA 21%':inv.taxType==='rebu'?'REBU':'Exento / 0%'}function previewInvoice(){const inv=formData();renderPrint(inv);window.print()}function renderPrint(inv){const fmt=n=>Number(n||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}) ;$('printArea').innerHTML=`<div class="invoice-paper"><div class="invoice-head"><div><h1>GLOW <span class="goldtxt">CARS</span></h1><p>GLOW CARS S.L.</p><p>Lugar Alzabaras Bajo, 1088A<br>03293 Elche, Alicante, España</p><p>Tel. 644 469 249</p></div><div class="invoice-meta"><h3>Factura</h3><strong>${esc(inv.number)}</strong><p>Fecha: ${esc(inv.date)}</p></div></div><div class="invoice-cols"><div><h3>Cliente</h3><p><strong>${esc(inv.clientName)}</strong></p><p>${esc(inv.clientId)}</p><p>${esc(inv.clientAddress)}</p><p>${esc(inv.clientPhone)}</p></div><div><h3>Vehículo</h3><p><strong>${esc(inv.car)}</strong></p><p>Matrícula: ${esc(inv.plate||'—')}</p><p>Forma de pago: ${esc(inv.payment)}</p></div></div><table class="invoice-table"><thead><tr><th>Concepto</th><th>Importe</th></tr></thead><tbody><tr><td>${esc(inv.concept||'Venta de vehículo')}<br><small>Régimen: ${esc(labelTax(inv))}</small></td><td>${fmt(inv.base)} €</td></tr></tbody></table><div class="totals"><div><span>Base / importe</span><span>${fmt(inv.base)} €</span></div>${inv.taxType==='iva'?`<div><span>IVA 21%</span><span>${fmt(tax(inv))} €</span></div>`:''}<div class="total"><span>TOTAL</span><span>${fmt(total(inv))} €</span></div></div>${inv.notes?`<div style="margin-top:30px"><h3>Observaciones</h3><p>${esc(inv.notes).replace(/\n/g,'<br>')}</p></div>`:''}<div class="invoice-foot">Documento emitido por GLOW CARS S.L. · Factura ${esc(inv.number)}</div></div>`}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function loadInvoice(id){const inv=invoices().find(x=>x.id===id);if(!inv)return;editingId=id;$('number').value=inv.number;$('date').value=inv.date;$('clientName').value=inv.clientName;$('clientId').value=inv.clientId;$('clientAddress').value=inv.clientAddress;$('clientPhone').value=inv.clientPhone;$('car').value=inv.car;$('plate').value=inv.plate;$('base').value=inv.base;$('taxType').value=inv.taxType;$('payment').value=inv.payment;$('concept').value=inv.concept;$('notes').value=inv.notes;window.scrollTo({top:0,behavior:'smooth'})}function deleteInvoice(id){if(!confirm('¿Eliminar esta factura guardada?'))return;localStorage.setItem(KEY,JSON.stringify(invoices().filter(x=>x.id!==id)));if(editingId===id)newInvoice();renderList()}function printSaved(id){const inv=invoices().find(x=>x.id===id);if(!inv)return;renderPrint(inv);window.print()}function renderList(){const list=invoices();$('list').innerHTML=list.length?list.map(x=>`<div class="invoice-row"><div><strong>${esc(x.number)}</strong><span class="muted">${esc(x.date)} · ${esc(x.clientName)} · ${esc(x.car)} · ${Number(total(x)).toLocaleString('es-ES',{minimumFractionDigits:2})} €</span></div><div class="invoice-actions"><button class="btn outline small" onclick="loadInvoice('${x.id}')">Editar</button><button class="btn gold small" onclick="printSaved('${x.id}')">PDF / imprimir</button><button class="btn outline danger small" onclick="deleteInvoice('${x.id}')">Eliminar</button></div></div>`).join(''):'<p class="muted">Todavía no hay facturas guardadas en este dispositivo.</p>'}$('date').addEventListener('change',()=>{if(!editingId)setNumber()});newInvoice();renderList();</script></body></html>

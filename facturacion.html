<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOW CARS | Facturación privada</title><style>body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1050px;width:92%;margin:35px auto}.panel{background:#121212;border:1px solid #292929;border-radius:16px;padding:22px;margin-bottom:18px}.logo{font-size:24px;font-weight:900;letter-spacing:4px}.logo span{color:#d8b36a}.muted{color:#999;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#aaa;font-size:13px;margin-bottom:6px}input,select,textarea{width:100%;box-sizing:border-box;background:#090909;color:#fff;border:1px solid #444;border-radius:8px;padding:11px;font-size:15px}textarea{min-height:80px}.full{grid-column:1/-1}.btn{border:0;border-radius:9px;padding:12px 16px;font-weight:bold;cursor:pointer}.gold{background:#d8b36a;color:#111}.outline{background:transparent;color:#fff;border:1px solid #555}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.status{margin-top:12px;color:#d8b36a}.hidden{display:none!important}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px;background:#090909;border:1px solid #292929;border-radius:9px;margin:8px 0}.small{padding:8px 10px;font-size:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{display:block}}@media print{.screen{display:none!important}.print{display:block!important}}.print{display:none;background:#fff;color:#111;padding:35px;max-width:800px;margin:auto}.print table{width:100%;border-collapse:collapse}.print td,.print th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.print td:last-child,.print th:last-child{text-align:right}</style></head><body><div id="login" class="wrap"><div class="panel"><div class="logo">GLOW <span>CARS</span></div><p class="muted">Facturación privada · acceso protegido</p><h2>Iniciar sesión</h2><label>Email</label><input id="email" type="email" autocomplete="username"><label style="margin-top:12px">Contraseña</label><input id="password" type="password" autocomplete="current-password"><div class="actions"><button id="loginBtn" class="btn gold" type="button">Entrar</button></div><div id="loginStatus" class="status"></div></div></div><div id="app" class="wrap hidden screen"><div class="panel"><div class="logo">GLOW <span>CARS</span></div><p class="muted">Facturación privada</p><button id="logoutBtn" class="btn outline">Cerrar sesión</button></div><div class="panel"><h2>Nueva factura</h2><p class="muted">2026 empieza en N40-2026. Al cambiar a 2027 empieza en N1-2027.</p><div class="grid"><div><label>Número</label><input id="number" readonly></div><div><label>Fecha</label><input id="date" type="date"></div><div><label>Cliente / razón social</label><input id="client"></div><div><label>DNI / NIF / CIF</label><input id="taxid"></div><div class="full"><label>Dirección</label><input id="address"></div><div><label>Teléfono</label><input id="phone"></div><div><label>Marca y modelo</label><input id="vehicle"></div><div><label>Matrícula</label><input id="plate"></div><div><label>Importe</label><input id="amount" type="number" min="0" step="0.01"></div><div><label>Régimen fiscal</label><select id="tax"><option value="rebu">REBU</option><option value="iva">IVA 21%</option><option value="exento">Exento / 0%</option></select></div><div><label>Forma de pago</label><select id="payment"><option>Transferencia bancaria</option><option>Financiación</option><option>Efectivo</option><option>Tarjeta</option><option>Otro</option></select></div><div><label>Concepto</label><input id="concept" value="Venta de vehículo"></div><div class="full"><label>Observaciones</label><textarea id="notes"></textarea></div></div><div class="actions"><button id="saveBtn" class="btn gold">Guardar factura</button><button id="newBtn" class="btn outline">Nueva</button></div><div id="status" class="status"></div></div><div class="panel"><h2>Facturas guardadas</h2><div id="list">Cargando...</div></div></div><div id="print" class="print"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://hqsiglpdnylsfbideglc.supabase.co',KEY='sb_publishable_elNqKmc2_3zpeDxrlFKMFw_RdDz4nXz';let sb,editing=null;const $=id=>document.getElementById(id);function loginMsg(x){$('loginStatus').textContent=x}function appMsg(x){$('status').textContent=x}function today(){let d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function total(x){return Number(x.sale_price||0)+(x.tax_type==='iva'?Number(x.sale_price||0)*.21:0)}function fmt(x){return Number(x||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})}async function init(){if(!window.supabase){loginMsg('No se ha cargado el sistema de acceso. Cierra y vuelve a abrir la página.');return}sb=window.supabase.createClient(URL,KEY);$('loginBtn').onclick=login;$('logoutBtn').onclick=logout;$('saveBtn').onclick=save;$('newBtn').onclick=newInvoice;try{let r=await sb.auth.getSession();if(r.data.session)show();else newInvoice()}catch(e){loginMsg('Error de conexión: '+e.message)}}async function login(){let email=$('email').value.trim(),password=$('password').value;if(!email||!password)return loginMsg('Introduce el email y la contraseña.');loginMsg('Comprobando acceso...');$('loginBtn').disabled=true;try{let r=await sb.auth.signInWithPassword({email,password});if(r.error)loginMsg('No se pudo iniciar sesión: '+r.error.message);else{loginMsg('');show()}}catch(e){loginMsg('Error de conexión: '+e.message)}$('loginBtn').disabled=false}async function logout(){await sb.auth.signOut();location.reload()}function show(){$('login').classList.add('hidden');$('app').classList.remove('hidden');newInvoice();load()}function newInvoice(){editing=null;$('date').value=today();$('number').value='Se asigna al guardar';['client','taxid','address','phone','vehicle','plate','amount','notes'].forEach(id=>$(id).value='');$('tax').value='rebu';$('payment').value='Transferencia bancaria';$('concept').value='Venta de vehículo';appMsg('')}async function save(){if(!$('client').value.trim())return appMsg('Indica el cliente.');if(!$('vehicle').value.trim())return appMsg('Indica el vehículo.');if(Number($('amount').value)<=0)return appMsg('Indica el importe.');try{let date=$('date').value||today(),year=Number(date.slice(0,4)),number;if(editing)number=editing.invoice_number;else{let r=await sb.rpc('next_glow_cars_invoice_number',{p_year:year});if(r.error)throw r.error;number=r.data}let p={invoice_number:number,invoice_year:year,invoice_date:date,client_name:$('client').value.trim(),client_tax_id:$('taxid').value.trim(),client_address:$('address').value.trim(),client_phone:$('phone').value.trim(),vehicle:$('vehicle').value.trim(),registration:$('plate').value.trim(),sale_price:Number($('amount').value),tax_type:$('tax').value,payment_method:$('payment').value,observations:$('notes').value.trim()};let r=editing?await sb.from('GLOW-CARS-INVOICES').update(p).eq('id',editing.id):await sb.from('GLOW-CARS-INVOICES').insert(p);if(r.error)throw r.error;appMsg('Factura '+number+' guardada correctamente.');newInvoice();load()}catch(e){appMsg('No se pudo guardar: '+e.message)}}async function load(){let r=await sb.from('GLOW-CARS-INVOICES').select('*').order('invoice_year',{ascending:false}).order('invoice_number',{ascending:false});if(r.error){$('list').textContent='Error al cargar: '+r.error.message;return}$('list').innerHTML=r.data.length?r.data.map(x=>`<div class="row"><div><b>${esc(x.invoice_number)}</b><br><span class="muted">${esc(x.invoice_date)} · ${esc(x.client_name)} · ${esc(x.vehicle)} · ${fmt(total(x))} €</span></div></div>`).join(''):'<span class="muted">No hay facturas guardadas.</span>'}init();</script></body></html>

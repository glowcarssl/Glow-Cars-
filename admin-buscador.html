<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>GLOW CARS · Administrador</title><style>html,body{margin:0;width:100%;height:100%;background:#080808}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="admin" src="./admin.html" title="GLOW CARS Administrador"></iframe><script>(function(){const frame=document.getElementById('admin');let installed=false;function install(){const w=frame.contentWindow,d=frame.contentDocument;if(!d)return;const filters=d.querySelector('.filters');const cars=d.getElementById('cars');if(!filters||!cars){setTimeout(install,100);return}if(!d.getElementById('glowSearchWrap')){const box=d.createElement('div');box.id='glowSearchWrap';box.style.cssText='position:sticky;top:0;z-index:9999;display:flex;gap:8px;margin:0 0 14px;padding:10px 0;background:#111;flex-wrap:wrap';box.innerHTML='<input id="glowVehicleSearch" type="search" placeholder="🔎 Buscar coche: BMW, X6M, Mercedes..." autocomplete="off" style="flex:1;min-width:220px;background:#090909;color:#fff;border:1px solid #555;border-radius:8px;padding:11px;font:inherit"><button id="glowClearSearch" type="button" style="background:#171717;color:#fff;border:1px solid #444;border-radius:8px;padding:11px 14px;font-weight:800;cursor:pointer">✕ Limpiar</button>';filters.parentNode.insertBefore(box,filters);const input=d.getElementById('glowVehicleSearch');const clear=d.getElementById('glowClearSearch');const apply=()=>{const q=input.value.trim().toLocaleLowerCase('es');let n=0;d.querySelectorAll('#cars .car').forEach(card=>{const ok=!q||(card.textContent||'').toLocaleLowerCase('es').includes(q);card.style.display=ok?'':'none';if(ok)n++});try{localStorage.setItem('glowVehicleSearch',input.value)}catch(e){}const s=d.getElementById('status');if(s&&q)s.textContent=n+' vehículo(s) coinciden con «'+input.value+'».'};input.value=localStorage.getItem('glowVehicleSearch')||'';input.addEventListener('input',apply);clear.addEventListener('click',()=>{input.value='';apply();input.focus()});d.addEventListener('click',function(ev){const btn=ev.target.closest('#cars .car .actions button');if(!btn||!btn.textContent.toLowerCase().includes('modificar'))return;setTimeout(()=>{const ed=d.getElementById('editor');if(ed){ed.hidden=false;ed.scrollIntoView({behavior:'smooth',block:'start'})}},80)},true);const oldRender=w.render;if(typeof oldRender==='function'&&!w.__glowSearchRenderWrapped){w.__glowSearchRenderWrapped=true;w.render=function(){const r=oldRender.apply(this,arguments);setTimeout(apply,0);return r}}const oldLoad=w.load;if(typeof oldLoad==='function'&&!w.__glowSearchLoadWrapped){w.__glowSearchLoadWrapped=true;w.load=function(){const r=oldLoad.apply(this,arguments);Promise.resolve(r).then(()=>setTimeout(install,100));return r}}apply();installed=true}if(!installed||!d.getElementById('glowVehicleSearch'))setTimeout(install,100)}frame.addEventListener('load',()=>setTimeout(install,150));setInterval(()=>{try{const d=frame.contentDocument;if(d&&!d.getElementById('glowVehicleSearch'))install()}catch(e){}},500);})();</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>GLOW CARS · Administrador</title><style>html,body{margin:0;width:100%;height:100%;background:#080808}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="admin" src="./admin.html" title="GLOW CARS Administrador"></iframe><script>(function(){const frame=document.getElementById('admin');let installed=false;function install(){const w=frame.contentWindow,d=frame.contentDocument;if(!d||installed)return;const filters=d.querySelector('.filters');if(!filters)return;installed=true;const box=d.createElement('div');box.style.cssText='display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap';box.innerHTML='<input id="glowVehicleSearch" type="search" placeholder="🔎 Buscar coche: BMW, X6M, Mercedes..." autocomplete="off" style="flex:1;min-width:220px;background:#090909;color:#fff;border:1px solid #333;border-radius:8px;padding:11px;font:inherit"><button id="glowVehicleSearchClear" type="button" style="background:#171717;color:#fff;border:1px solid #444;border-radius:8px;padding:11px 14px;font-weight:800">Limpiar</button>';filters.parentNode.insertBefore(box,filters);const input=d.getElementById('glowVehicleSearch');const clear=d.getElementById('glowVehicleSearchClear');function apply(){const q=input.value.trim().toLocaleLowerCase('es');d.querySelectorAll('#cars .car').forEach(card=>{card.style.display=(!q||(card.textContent||'').toLocaleLowerCase('es').includes(q))?'':'none'});const visible=[...d.querySelectorAll('#cars .car')].filter(x=>x.style.display!=='none').length;const s=d.getElementById('status');if(s&&q)s.textContent=visible+' vehículo(s) coinciden con «'+input.value+'».'}input.addEventListener('input',apply);clear.addEventListener('click',()=>{input.value='';apply();input.focus()});const oldRender=w.render;if(typeof oldRender==='function')w.render=function(){const result=oldRender.apply(this,arguments);setTimeout(apply,0);return result};const oldLoad=w.load;if(typeof oldLoad==='function')w.load=function(){const result=oldLoad.apply(this,arguments);Promise.resolve(result).then(()=>setTimeout(apply,50));return result};apply()}frame.addEventListener('load',()=>setTimeout(install,100));})();</script></body></html>

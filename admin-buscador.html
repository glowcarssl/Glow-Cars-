<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>GLOW CARS · Administrador</title><style>html,body{margin:0;width:100%;height:100%;background:#080808}iframe{width:100%;height:100%;min-height:100vh;border:0;display:block}</style></head><body><iframe id="admin" src="./admin.html" title="GLOW CARS Administrador"></iframe><script>(function(){const frame=document.getElementById('admin');let timer;function install(){const d=frame.contentDocument;if(!d||d.__glowSearchInstalled)return;const filters=d.querySelector('.filters');if(!filters)return;d.__glowSearchInstalled=true;const box=d.createElement('div');box.style.cssText='display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap';box.innerHTML='<input id="glowVehicleSearch" type="search" placeholder="🔎 Buscar coche: BMW, X6M, Mercedes..." autocomplete="off" style="flex:1;min-width:220px;background:#090909;color:#fff;border:1px solid #333;border-radius:8px;padding:11px;font:inherit"><button id="glowVehicleSearchClear" type="button" style="background:#171717;color:#fff;border:1px solid #444;border-radius:8px;padding:11px 14px;font-weight:800">Limpiar</button>';filters.parentNode.insertBefore(box,filters);const input=d.getElementById('glowVehicleSearch'),clear=d.getElementById('glowVehicleSearchClear');function apply(){const q=(input.value||'').trim().toLocaleLowerCase('es');d.querySelectorAll('#cars .car').forEach(card=>{card.style.display=(!q||(card.textContent||'').toLocaleLowerCase('es').includes(q))?'':'none'});}input.addEventListener('input',apply);clear.addEventListener('click',function(){input.value='';apply();input.focus()});new MutationObserver(function(){clearTimeout(timer);timer=setTimeout(apply,30)}).observe(d.getElementById('cars'),{childList:true,subtree:true});apply()}frame.addEventListener('load',function(){setTimeout(install,150)});})();</script></body></html>

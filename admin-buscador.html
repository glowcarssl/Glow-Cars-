<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>GLOW CARS · Administrador</title><style>html,body{margin:0;width:100%;height:100%;background:#080808}iframe{width:100%;height:100%;min-height:100vh;border:0;display:block}</style></head><body><iframe id="admin" src="./admin.html" title="GLOW CARS Administrador"></iframe><script>(function(){const frame=document.getElementById('admin');function install(){const w=frame.contentWindow,d=frame.contentDocument;if(!d||d.__glowSearchInstalled)return;const filters=d.querySelector('.filters');if(!filters)return;d.__glowSearchInstalled=true;const box=d.createElement('div');box.style.cssText='display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap';box.innerHTML='<input id="glowVehicleSearch" type="search" placeholder="🔎 Buscar coche: BMW, X6M, Mercedes..." autocomplete="off" style="flex:1;min-width:220px;background:#090909;color:#fff;border:1px solid #333;border-radius:8px;padding:11px;font:inherit"><button id="glowVehicleSearchClear" type="button" style="background:#171717;color:#fff;border:1px solid #444;border-radius:8px;padding:11px 14px;font-weight:800">Limpiar</button>';filters.parentNode.insertBefore(box,filters);const input=d.getElementById('glowVehicleSearch'),clear=d.getElementById('glowVehicleSearchClear');function apply(){const q=input.value.trim().toLocaleLowerCase('es');d.querySelectorAll('#cars .car').forEach(card=>{card.style.display=(!q||(card.textContent||'').toLocaleLowerCase('es').includes(q))?'':'none'});const s=d.getElementById('status');if(s&&q){const n=[...d.querySelectorAll('#cars .car')].filter(x=>x.style.display!=='none').length;s.textContent=n+' vehículo(s) coinciden con «'+input.value+'».'}}input.addEventListener('input',apply);clear.addEventListener('click',function(){input.value='';apply();input.focus()});function openEditor(btn){const code=btn.getAttribute('onclick')||'';const m=code.match(/edit\((\d+)\)/);if(!m)return false;const id=m[1];const r=(w.rows||[]).find(x=>String(x.id)===String(id));if(!r)return false;const set=(id,val)=>{const el=d.getElementById(id);if(el)el.value=val==null?'':val};set('id',r.id);set('modelo',r['Marca-modelo']);set('precio',r.Precio);set('ano',r['Año']);set('km',r['Kilómetros']);set('combustible',r.Combustible);set('cambio',r.Cambio);set('estado',typeof w.status==='function'?w.status(r.estado):r.estado);set('descripcion',r['Descripción']);set('imagen',r.Imagen);const editor=d.getElementById('editor');if(!editor)return false;editor.hidden=false;editor.style.display='block';editor.scrollIntoView=function(){};return true}d.addEventListener('click',function(ev){const btn=ev.target.closest('#cars .car .actions button');if(!btn)return;if(!/modificar/i.test(btn.textContent||''))return;ev.preventDefault();ev.stopPropagation();openEditor(btn)},true);const oldRender=w.render;if(typeof oldRender==='function'){w.render=function(){const result=oldRender.apply(this,arguments);setTimeout(apply,0);return result}}const oldLoad=w.load;if(typeof oldLoad==='function'){w.load=function(){const result=oldLoad.apply(this,arguments);Promise.resolve(result).then(function(){setTimeout(apply,50)});return result}}apply()}frame.addEventListener('load',function(){setTimeout(install,100)});})();</script></body></html>

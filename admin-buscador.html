<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>GLOW CARS · Administrador</title><style>html,body{margin:0;width:100%;height:100%;background:#080808}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="admin" src="./admin.html" title="GLOW CARS Administrador"></iframe><script>(function(){const frame=document.getElementById('admin');function install(){const w=frame.contentWindow,d=frame.contentDocument;if(!d||d.__glowFixed)return;const filters=d.querySelector('.filters');if(!filters)return;d.__glowFixed=true;const box=d.createElement('div');box.style.cssText='display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap';box.innerHTML='<input id="glowVehicleSearch" type="search" placeholder="🔎 Buscar coche: BMW, X6M, Mercedes..." autocomplete="off" style="flex:1;min-width:220px;background:#090909;color:#fff;border:1px solid #333;border-radius:8px;padding:11px;font:inherit">';filters.parentNode.insertBefore(box,filters);const input=d.getElementById('glowVehicleSearch');const apply=()=>{const q=input.value.trim().toLocaleLowerCase('es');d.querySelectorAll('#cars .car').forEach(card=>{card.style.display=(!q||(card.textContent||'').toLocaleLowerCase('es').includes(q))?'':'none'});const n=[...d.querySelectorAll('#cars .car')].filter(x=>x.style.display!=='none').length;const s=d.getElementById('status');if(s&&q)s.textContent=n+' vehículo(s) coinciden con «'+input.value+'».'};input.addEventListener('input',apply);d.addEventListener('click',function(ev){const btn=ev.target.closest('#cars .car .actions button');if(!btn)return;if(!btn.textContent.toLowerCase().includes('modificar'))return;ev.preventDefault();ev.stopPropagation();const card=btn.closest('.car');const title=card&&card.querySelector('h3')?card.querySelector('h3').textContent.trim():'';const row=(w.rows||[]).find(r=>String(r['Marca-modelo']||'').trim()===title);if(row&&typeof w.edit==='function'){try{w.edit(row.id);setTimeout(()=>{const ed=d.getElementById('editor');if(ed){ed.hidden=false;ed.scrollIntoView({behavior:'smooth',block:'start'})}},50)}catch(e){const ed=d.getElementById('editor');if(ed){ed.hidden=false;ed.scrollIntoView({behavior:'smooth',block:'start')}}}}},true);const oldRender=w.render;if(typeof oldRender==='function')w.render=function(){const r=oldRender.apply(this,arguments);setTimeout(apply,0);return r};const oldLoad=w.load;if(typeof oldLoad==='function')w.load=function(){const r=oldLoad.apply(this,arguments);Promise.resolve(r).then(()=>setTimeout(install,50));return r};apply()}frame.addEventListener('load',()=>setTimeout(install,100));})();</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOW CARS · Tasación V61</title><style>body{margin:0;background:#070707;color:#fff;font-family:Arial}.w{max-width:950px;width:92%;margin:auto}.p{background:#111;border:1px solid #292929;border-radius:16px;padding:20px;margin:18px 0}.hint{color:#999;font-size:13px}.score{font-size:38px;font-weight:900;color:#d8b36a}.q{width:100%;box-sizing:border-box;background:#090909;color:#fff;border:1px solid #444;border-radius:10px;padding:16px;font-size:17px}.btn{width:100%;margin-top:14px;padding:15px;border:0;border-radius:10px;background:#d8b36a;color:#000;font-weight:bold;font-size:16px}.btn:disabled{opacity:.55}.t{width:100%;border-collapse:collapse;font-size:12px}.t th,.t td{padding:8px;border-bottom:1px solid #292929;text-align:left;vertical-align:top}.t th{color:#d8b36a}.warn{border-color:#66501d}</style></head><body><main class="w"><div class="p"><h1>GLOW CARS</h1><div class="hint">Tasación profesional · Colector backend · Motor V61</div><p>Escribe el coche en una sola frase:</p><input id="q" class="q" placeholder="BMW Serie 3 320i gasolina automático 2019 135.000 km"><button id="go" class="btn">🔎 ANALIZAR MERCADO</button><p class="hint">Año ±1 · combustible y carrocería filtrados · KM normalizados progresivamente.</p></div><div id="o"></div></main><script>const API='https://hqsiglpdnylsfbideglc.supabase.co/functions/v1/tasacion-market-search-v2';const $=x=>document.getElementById(x),E=x=>Number(x||0).toLocaleString('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0});function parse(q){const y=+(q.match(/\b20\d{2}\b/)||[])[0]||0,k=+(String((q.match(/\b(\d{1,3}(?:[.\s]\d{3})+|\d{4,7})\s*(?:km|kms|kilometros|kilómetros)\b/i)||[])[1]||'').replace(/[.\s]/g,''))||0;const f=/\b(diesel|di[eé]sel)\b/i.test(q)?'Diésel':/gasolina|petrol/i.test(q)?'Gasolina':/hibrid|hybrid/i.test(q)?'Híbrido':/electric/i.test(q)?'Eléctrico':'';const g=/automatic|autom[aá]tic|dsg|cvt|steptronic|tiptronic/i.test(q)?'Automático':/manual/i.test(q)?'Manual':'';const m=q.match(/^\s*([A-Za-zÀ-ÿ-]+(?:\s+[A-Za-zÀ-ÿ-]+)*)\s+(.*)$/);return{marca:m?m[1]:'',modelo:m?m[2]:'',motor:q,ano:y,km:k,comb:f,cambio:g,carro:'',margin:3000,transport:500,preparation:600,warranty:500}}async function run(){const q=$('q').value.trim();if(!q){$('o').innerHTML='<div class="p warn">Escribe el coche primero.</div>';return}const v=parse(q);if(!v.ano||!v.km){$('o').innerHTML='<div class="p warn">Necesito año y kilómetros. Ejemplo: BMW Serie 3 320i gasolina automático 2019 135.000 km</div>';return}$('go').disabled=true;$('go').textContent='🔎 BUSCANDO MERCADO…';$('o').innerHTML='<div class="p">🔎 <b>Buscando comparables…</b><p class="hint">El móvil ya no consulta las fuentes directamente. El colector backend se encarga de la búsqueda.</p></div>';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});const d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.error||('HTTP '+r.status));if(!d.valuation){$('o').innerHTML='<div class="p warn"><div class="score">SIN DATOS</div><p>No se han encontrado comparables compatibles.</p><p class="hint">No se inventa una tasación. Datos brutos encontrados: '+(d.rawComparableCount||0)+'.</p></div><div class="p"><b>Diagnóstico</b>'+((d.diagnostics||[]).map(x=>'<p class="hint">'+x.source+' · '+(x.ok?'OK':'ERROR')+' · '+(x.found||0)+' encontrados'+(x.error?' · '+x.error:'')+'</p>').join(''))+'</div>';return}const c=d.comparables||[];$('o').innerHTML='<div class="p"><div class="hint">VALOR DE MERCADO · COLECTOR BACKEND · V61</div><div class="score">'+E(d.valuation.marketValue)+'</div><p>Rango observado: '+E(d.valuation.range.low)+' – '+E(d.valuation.range.high)+'</p><span class="hint">'+d.valuation.comparableCount+' comparables · confianza '+d.valuation.confidence+' · año ±1 · KM normalizados</span></div><div class="p"><div class="hint">PUJA MÁXIMA GLOW CARS</div><div class="score">'+E(d.auction.maximumBid)+'</div><p class="hint">Venta rápida: '+E(d.valuation.quickSale)+' · Venta optimizada: '+E(d.valuation.optimizedSale)+'</p></div><div class="p"><b>🚗 Comparables utilizados</b><table class="t"><tr><th>Vehículo</th><th>Año</th><th>KM</th><th>Precio</th><th>Ajustado KM</th><th>Sim.</th><th>Fuente</th></tr>'+c.map(x=>'<tr><td>'+String(x.title||'').slice(0,220)+'</td><td>'+x.year+'</td><td>'+(x.km?(x.km.toLocaleString('es-ES')+' km'):'—')+'</td><td>'+E(x.price)+'</td><td>'+E(x.normalizedPrice)+'</td><td>'+(x.similarity||0)+'%</td><td>'+x.source+'</td></tr>').join('')+'</table></div><div class="p"><b>🔎 Diagnóstico de fuentes</b>'+((d.diagnostics||[]).map(x=>'<p class="hint">'+x.source+' · '+(x.ok?'OK':'ERROR')+' · '+(x.found||0)+' encontrados'+(x.error?' · '+x.error:'')+'</p>').join(''))+'</div>'}catch(e){$('o').innerHTML='<div class="p warn"><div class="score">ERROR</div><p>No se pudo completar la búsqueda.</p><p class="hint">'+String(e.message||e)+'</p></div>'}finally{$('go').disabled=false;$('go').textContent='🔎 ANALIZAR MERCADO'}}$('go').onclick=run;$('q').onkeydown=e=>{if(e.key==='Enter')run()};</script></body></html>

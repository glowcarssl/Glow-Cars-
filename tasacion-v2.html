<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOW CARS · Tasación V59</title><style>body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;width:92%;margin:auto}.panel{background:#111;border:1px solid #292929;border-radius:16px;padding:20px;margin:20px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#d8b36a;font-size:12px;font-weight:bold;margin:10px 0 6px}input,select{width:100%;box-sizing:border-box;background:#090909;color:#fff;border:1px solid #333;border-radius:8px;padding:12px}.btn{display:block;width:100%;margin-top:16px;padding:14px 18px;border:0;border-radius:9px;background:#d8b36a;color:#000;font-weight:bold;font-size:16px;cursor:pointer}.score{font-size:40px;font-weight:900;color:#d8b36a}.hint{color:#999;font-size:13px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:9px;border-bottom:1px solid #292929;text-align:left}.table th{color:#d8b36a}@media(max-width:650px){.grid{grid-template-columns:1fr}.table{font-size:11px}}</style></head><body><main class="wrap"><div class="panel"><h1>GLOW CARS</h1><p class="hint">Tasación profesional · Motor V59 · colector tolerante con diagnóstico</p><div class="grid"><div><label>MARCA</label><input id="marca" value="BMW"></div><div><label>MODELO</label><input id="modelo"></div><div><label>MOTOR / VERSIÓN</label><input id="motor"></div><div><label>AÑO</label><input id="ano" type="number"></div><div><label>KILÓMETROS</label><input id="km" type="number"></div><div><label>COMBUSTIBLE</label><select id="comb"><option>Diésel</option><option>Gasolina</option><option>Híbrido</option><option>Eléctrico</option></select></div><div><label>CAMBIO</label><select id="cambio"><option>Manual</option><option>Automático</option></select></div><div><label>CARROCERÍA</label><select id="carro"><option>Berlina</option><option>Compacto</option><option>Familiar</option><option>SUV</option><option>Coupé</option><option>Cabrio</option><option>GT</option><option>Otro</option></select></div></div><button type="button" id="analizar" class="btn">🔎 ANALIZAR MERCADO</button></div><section id="out"></section></main><script>const $=id=>document.getElementById(id),E=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}),N=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();function getKM(s){let a=[...String(s).matchAll(/\b(\d{1,3}(?:[.\s]\d{3})+|\d{4,7})\s*(?:km|kms|kilometros|kilómetros)\b/gi)].map(x=>+(x[1]||'').replace(/[.\s]/g,''));return a.find(x=>x>=10000&&x<=500000)}function getPrice(s){let a=[...String(s).matchAll(/(?:€|EUR)\s*(\d{1,3}(?:[.\s]\d{3})+|\d{4,6})\b|\b(\d{1,3}(?:[.\s]\d{3})+|\d{4,6})\s*(?:€|EUR)\b/gi)].map(x=>+(x[1]||x[2]||'').replace(/[.\s]/g,''));return a.find(x=>x>=2500&&x<=100000)}function fuel(s){let x=N(s);if(/hibrid|hybrid|hev|phev|e-hybrid|mhev/.test(x))return'Híbrido';if(/electric|electrico|bev/.test(x))return'Eléctrico';if(/diesel|cdi|tdi|dci|hdi|bluehdi|d-4d|320d|220d|116d/.test(x))return'Diésel';if(/gasolina|petrol|tsi|tce|tfsi|fsi|320i|330i|520i/.test(x))return'Gasolina';return''}function body(s){let x=N(s);if(/gran turismo|\bgt\b/.test(x))return'GT';if(/touring|avant|estate|wagon|familiar|tourer/.test(x))return'Familiar';if(/suv|todoterreno|4x4/.test(x))return'SUV';if(/coupe/.test(x))return'Coupé';if(/cabrio|convertible/.test(x))return'Cabrio';if(/compact|hatchback/.test(x))return'Compacto';if(/berlina|sedan|saloon/.test(x))return'Berlina';return''}function normModel(v){return N(`${v.modelo} ${v.motor}`).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(x=>x.length>=2&&!['serie','motor','gasolina','diesel','automatico','automatica','manual'].includes(x))}function compatible(v,s){let x=N(s),f=fuel(s),b=body(s),mt=normModel(v);if(v.marca&&!x.includes(N(v.marca)))return false;if(mt.length&&!mt.some(t=>x.includes(t)))return false;if(f&&f!==v.comb)return false;if(v.carro!=='Otro'&&b&&b!==v.carro)return false;if(v.cambio==='Automático'&&/\bmanual\b/.test(x))return false;if(v.cambio==='Manual'&&/\b(automatic|automatico|automatica|dsg|cvt|steptronic|tiptronic)\b/.test(x))return false;return true}async function fetcher(u){let ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),7000);try{let r=await fetch('https://r.jina.ai/'+u,{signal:ctl.signal});return r.ok?await r.text():''}catch{return''}finally{clearTimeout(timer)}}function chunks(t){return t.split(/(?=BMW|Mercedes|Audi|Volkswagen|Seat|Peugeot|Ford|Toyota|Opel|Renault|Citroen|Nissan|Kia|Hyundai|Skoda|Volvo|Mazda|Honda|Fiat|Dacia|Jeep|Mini|Lexus|Tesla|Cupra|Land Rover)/i)}async function go(){let v={marca:$('marca').value,modelo:$('modelo').value,motor:$('motor').value,ano:+$('ano').value,km:+$('km').value,comb:$('comb').value,cambio:$('cambio').value,carro:$('carro').value};$('out').innerHTML='<div class="panel">Analizando mercado…<br><span class="hint">Consultando fuentes en paralelo.</span></div>';let base=`${v.marca} ${v.modelo} ${v.motor} ${v.ano} ${v.comb} ${v.cambio} coche segunda mano`,qs=[base,`${base} precio km`,`${v.marca} ${v.modelo} ${v.motor} ${v.comb} ${v.ano}`],urls=[];for(let q of qs){for(let site of ['','site:coches.net','site:flexicar.es','site:milanuncios.com','site:wallapop.com','site:autocasion.com','site:autoscout24.es'])urls.push(['https://www.bing.com/search?q='+encodeURIComponent(q+' '+site),'Bing']);urls.push(['https://html.duckduckgo.com/html/?q='+encodeURIComponent(q),'DuckDuckGo'])}let results=await Promise.all(urls.map(async x=>[await fetcher(x[0]),x[1]])),found=[],cs=[];for(let [t,src] of results){for(let p of chunks(t)){if(!p.trim())continue;found.push({src,text:p.replace(/\s+/g,' ').slice(0,320)});if(!compatible(v,p))continue;let ys=[...p.matchAll(/\b20\d{2}\b/g)].map(x=>+x[0]).filter(y=>Math.abs(y-v.ano)<=1),y=ys[0],k=getKM(p),pr=getPrice(p);if(!y||!pr)continue;let sim=90;if(k){let ratio=Math.abs(k-v.km)/Math.max(v.km,1);sim-=Math.min(25,Math.round(ratio*30))}cs.push({text:p.replace(/\s+/g,' ').slice(0,280),year:y,km:k,price:pr,sim,source:src})}}let seen=new Set();cs=cs.filter(c=>{let z=N(c.text)+'|'+c.price+'|'+c.year+'|'+(c.km||'');if(seen.has(z))return false;seen.add(z);return true}).sort((a,b)=>b.sim-a.sim);if(!cs.length){let diag=found.slice(0,8).map(x=>`<tr><td>${x.src}</td><td>${x.text}</td></tr>`).join('');$('out').innerHTML=`<div class="panel"><div class="score">SIN DATOS</div><p class="hint">No se han encontrado anuncios compatibles. Ahora el diagnóstico muestra qué texto está devolviendo el colector.</p></div><div class="panel"><b>🔎 DIAGNÓSTICO DEL COLECTOR</b><table class="table"><tr><th>Fuente</th><th>Texto recibido</th></tr>${diag||'<tr><td colspan="2">Las fuentes no devolvieron contenido.</td></tr>'}</table></div>`;return}cs=cs.slice(0,12);let adj=cs.map(c=>{if(!c.km)return c.price;let delta=(c.km-v.km)/1000,factor=delta<0?Math.min(1.25,Math.pow(1.003,Math.abs(delta))):Math.max(.78,Math.pow(.997,delta));return Math.round(c.price*factor/100)*100});adj.sort((a,b)=>a-b);let med=adj.length%2?adj[(adj.length-1)/2]:(adj[adj.length/2-1]+adj[adj.length/2])/2,market=Math.round(med/100)*100,fast=Math.round(market*.98/100)*100,opt=Math.round(market*1.02/100)*100,bid=Math.max(0,Math.round((fast-4800)*.72/100)*100);$('out').innerHTML=`<div class="panel"><div class="hint">VALOR DE MERCADO · V1 / MOTOR V59</div><div class="score">${E(market)}</div><p class="hint">Rango observado: ${E(Math.min(...cs.map(c=>c.price)))} – ${E(Math.max(...cs.map(c=>c.price)))}</p><b>${cs.length} comparables</b><p class="hint">Mediana normalizada por kilometraje · curva progresiva de KM aplicada.</p></div><div class="panel"><b>PUJA MÁXIMA GLOW CARS</b><div class="score">${E(bid)}</div></div><div class="panel"><p>Venta rápida: <b>${E(fast)}</b> · Venta optimizada: <b>${E(opt)}</b></p><table class="table"><tr><th>Vehículo</th><th>Año</th><th>KM</th><th>Precio</th><th>Similitud</th><th>Fuente</th></tr>${cs.map(c=>`<tr><td>${c.text}</td><td>${c.year}</td><td>${c.km?c.km.toLocaleString('es-ES')+' km':'—'}</td><td>${E(c.price)}</td><td>${c.sim}%</td><td>${c.source}</td></tr>`).join('')}</table></div>`}document.getElementById('analizar').addEventListener('click',go);</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOW CARS · Tasación V60</title><style>body{margin:0;background:#070707;color:#fff;font-family:Arial}.w{max-width:950px;width:92%;margin:auto}.p{background:#111;border:1px solid #292929;border-radius:16px;padding:20px;margin:18px 0}.hint{color:#999;font-size:13px}.score{font-size:38px;font-weight:900;color:#d8b36a}.q{width:100%;box-sizing:border-box;background:#090909;color:#fff;border:1px solid #444;border-radius:10px;padding:16px;font-size:17px}.btn{width:100%;margin-top:14px;padding:15px;border:0;border-radius:10px;background:#d8b36a;color:#000;font-weight:bold;font-size:16px}.t{width:100%;border-collapse:collapse;font-size:12px}.t th,.t td{padding:8px;border-bottom:1px solid #292929;text-align:left;vertical-align:top}.t th{color:#d8b36a}.warn{border-color:#66501d}</style></head><body><main class="w"><div class="p"><h1>GLOW CARS</h1><div class="hint">Tasación profesional · Motor V60 · búsqueda multicapa</div><p>Escribe el coche en una sola frase:</p><input id="q" class="q" placeholder="BMW Serie 3 320i gasolina automático 2019 135.000 km"><button id="go" class="btn">🔎 ANALIZAR MERCADO</button><p class="hint">Año: únicamente ±1. KM: no excluyen; se normalizan después. Combustible y carrocería incompatibles se descartan.</p></div><div id="o"></div></main><script>const $=x=>document.getElementById(x),N=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),E=x=>Number(x||0).toLocaleString('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0});function Y(s){return +(String(s).match(/\b20\d{2}\b/)||[])[0]}function K(s){let m=String(s).match(/\b(\d{1,3}(?:[.\s]\d{3})+|\d{4,7})\s*(?:km|kms|kilometros|kilómetros)\b/i);return m?+(m[1]||'').replace(/[.\s]/g,''):0}function P(s){let m=String(s).match(/(?:€|EUR)\s*(\d{1,3}(?:[.\s]\d{3})+|\d{4,6})\b|\b(\d{1,3}(?:[.\s]\d{3})+|\d{4,6})\s*(?:€|EUR)\b/i);let p=m?+(m[1]||m[2]||'').replace(/[.\s]/g,''):0;return p>=2500&&p<=100000?p:0}function F(s){let x=N(s);if(/hibrid|hybrid|hev|phev|mhev/.test(x))return'h';if(/electric|electrico|bev/.test(x))return'e';if(/diesel|cdi|tdi|dci|hdi|bluehdi|320d|220d|116d/.test(x))return'd';if(/gasolina|petrol|tsi|tce|tfsi|fsi|320i|330i|520i/.test(x))return'g';return''}function B(s){let x=N(s);if(/gran turismo|\bgt\b/.test(x))return'gt';if(/touring|avant|estate|wagon|familiar|tourer/.test(x))return'fam';if(/suv|todoterreno|4x4/.test(x))return'suv';if(/coupe/.test(x))return'coupe';if(/cabrio|convertible/.test(x))return'cab';if(/compact|hatchback/.test(x))return'compact';if(/berlina|sedan|saloon/.test(x))return'berlina';return''}function parse(q){let x=N(q),brand=(q.match(/^(bmw|mercedes(?:-benz)?|audi|seat|volkswagen|peugeot|ford|toyota|opel|renault|citroen|nissan|kia|hyundai|skoda|volvo|mazda|honda|fiat|dacia|jeep|mini|lexus|tesla|cupra|land rover)\b/i)||[])[0]||'';return{q,x,brand,y:Y(q),km:K(q),f:F(q),b:B(q),auto:/automatic|dsg|cvt|steptronic|tiptronic/.test(x),manual:/\bmanual\b/.test(x)}}function ok(v,s){let x=N(s),y=Y(s),f=F(s),b=B(s);if(!y||Math.abs(y-v.y)>1)return false;if(v.brand&&!x.includes(N(v.brand)))return false;if(v.f&&f!==v.f)return false;if(v.b&&b!==v.b)return false;if(v.auto&&/\bmanual\b/.test(x))return false;if(v.manual&&/automatic|dsg|cvt|steptronic|tiptronic/.test(x))return false;let terms=v.x.split(/\s+/).filter(z=>z.length>=3&&!/^20\d{2}$/.test(z)&&!/^[0-9.]+$/.test(z)&&!['gasolina','diesel','automatico','automatica','manual','kilometros'].includes(z));return !terms.length||terms.some(z=>x.includes(z))}async function get(u){let c=new AbortController(),t=setTimeout(()=>c.abort(),5000);try{let r=await fetch('https://r.jina.ai/'+u,{signal:c.signal});return r.ok?await r.text():''}catch{return''}finally{clearTimeout(t)}}function adj(p,k,target){if(!k||!target)return p;let d=(k-target)/1000,f=d<0?Math.pow(1.003,Math.min(60,-d)):Math.pow(.997,Math.min(60,d));return Math.round(p*f/100)*100}async function run(){let q=$('q').value.trim();if(!q){$('o').innerHTML='<div class="p warn">Escribe el coche primero.</div>';return}let v=parse(q);if(!v.y||!v.km){$('o').innerHTML='<div class="p warn">Necesito año y kilómetros. Ejemplo: BMW Serie 3 320i gasolina automático 2019 135.000 km</div>';return}$('o').innerHTML='<div class="p">🔎 <b>Buscando mercado…</b><p class="hint">Años permitidos: '+(v.y-1)+'–'+(v.y+1)+' · consultando fuentes públicas…</p></div>';let qs=[q+' coche segunda mano precio',q+' venta coche precio',q+' site:coches.net OR site:milanuncios.com OR site:wallapop.com'];let urls=[];for(let z of qs){urls.push(['https://www.bing.com/search?q='+encodeURIComponent(z),'Bing']);urls.push(['https://html.duckduckgo.com/html/?q='+encodeURIComponent(z),'DuckDuckGo'])}let rr=await Promise.race([Promise.all(urls.map(async a=>[await get(a[0]),a[1]])),new Promise(r=>setTimeout(()=>r([]),12000))]);let cs=[],raw=[];for(let [txt,src] of rr){for(let z of String(txt).split(/(?=BMW|Mercedes|Audi|Volkswagen|Seat|Peugeot|Ford|Toyota|Opel|Renault|Citroen|Nissan|Kia|Hyundai|Skoda|Volvo|Mazda|Honda|Fiat|Dacia|Jeep|Mini|Lexus|Tesla|Cupra)\b/i)){z=z.replace(/\s+/g,' ').trim();if(z.length<40)continue;raw.push([src,z]);if(!ok(v,z))continue;let p=P(z),k=K(z),y=Y(z);if(p&&y)cs.push({z,p,k,y,src,sim:k?Math.max(50,92-Math.min(30,Math.round(Math.abs(k-v.km)/v.km*35))):70})}}let seen=new Set();cs=cs.filter(c=>{let a=N(c.z).slice(0,180)+'|'+c.p+'|'+c.y;if(seen.has(a))return false;seen.add(a);return true}).sort((a,b)=>b.sim-a.sim).slice(0,20);if(!cs.length){$('o').innerHTML='<div class="p warn"><div class="score">SIN DATOS</div><p>No se han encontrado anuncios compatibles en esta búsqueda.</p><p class="hint">No invento una tasación. Año permitido: '+(v.y-1)+'–'+(v.y+1)+'. Las fuentes que no responden no bloquean el resultado.</p></div><div class="p"><b>Diagnóstico</b><p class="hint">Se han consultado Bing y DuckDuckGo con búsquedas generales y específicas. Si quieres ampliar fuentes, vuelve a pulsar ANALIZAR.</p></div>';return}let a=cs.map(c=>adj(c.p,c.k,v.km)).sort((x,y)=>x-y),m=a.length%2?a[(a.length-1)/2]:(a[a.length/2-1]+a[a.length/2])/2;m=Math.round(m/100)*100;let fast=Math.round(m*.96/100)*100,opt=Math.round(m*1.04/100)*100,bid=Math.max(0,Math.round((fast-4500)*.72/100)*100);$('o').innerHTML='<div class="p"><div class="hint">VALOR DE MERCADO · V1 / MOTOR V60</div><div class="score">'+E(m)+'</div><p>Rango observado: '+E(Math.min(...cs.map(c=>c.p)))+' – '+E(Math.max(...cs.map(c=>c.p)))+'</p><span class="hint">'+cs.length+' comparables · Año ±1 · KM normalizados</span></div><div class="p"><div class="hint">PUJA MÁXIMA GLOW CARS</div><div class="score">'+E(bid)+'</div><p class="hint">Venta rápida: '+E(fast)+' · Venta optimizada: '+E(opt)+'</p></div><div class="p"><b>🚗 Comparables utilizados</b><table class="t"><tr><th>Vehículo</th><th>Año</th><th>KM</th><th>Precio</th><th>Ajustado KM</th><th>Sim.</th><th>Fuente</th></tr>'+cs.map(c=>'<tr><td>'+c.z.slice(0,220)+'</td><td>'+c.y+'</td><td>'+(c.k?c.k.toLocaleString('es-ES')+' km':'—')+'</td><td>'+E(c.p)+'</td><td>'+E(adj(c.p,c.k,v.km))+'</td><td>'+c.sim+'%</td><td>'+c.src+'</td></tr>').join('')+'</table></div>}$('go').onclick=run;$('q').onkeydown=e=>{if(e.key==='Enter')run()};</script></body></html>

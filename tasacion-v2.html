<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOW CARS · Tasación V56</title><style>body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;width:92%;margin:auto}.panel{background:#111;border:1px solid #292929;border-radius:16px;padding:20px;margin:20px 0}label{display:block;color:#d8b36a;font-size:12px;font-weight:bold;margin:10px 0 6px}input,select{width:100%;box-sizing:border-box;background:#090909;color:#fff;border:1px solid #333;border-radius:8px;padding:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{margin-top:16px;padding:13px 18px;border:0;border-radius:9px;background:#d8b36a;font-weight:bold}.score{font-size:40px;font-weight:900;color:#d8b36a}.hint{color:#999;font-size:13px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:9px;border-bottom:1px solid #292929;text-align:left}.table th{color:#d8b36a}@media(max-width:650px){.grid{grid-template-columns:1fr}} </style></head><body><main class="wrap"><div class="panel"><h1>TASACIÓN GLOW CARS</h1><p class="hint">Motor V56 · colector tolerante · ajuste progresivo por kilómetros</p><div class="grid"><div><label>MARCA</label><input id="marca" value="BMW"></div><div><label>MODELO</label><input id="modelo"></div><div><label>MOTOR / VERSIÓN</label><input id="motor"></div><div><label>AÑO</label><input id="ano" type="number"></div><div><label>KILÓMETROS</label><input id="km" type="number"></div><div><label>COMBUSTIBLE</label><select id="comb"><option>Diésel</option><option>Gasolina</option><option>Híbrido</option><option>Eléctrico</option></select></div><div><label>CAMBIO</label><select id="cambio"><option>Manual</option><option>Automático</option></select></div><div><label>CARROCERÍA</label><select id="carro"><option>Berlina</option><option>Compacto</option><option>Familiar</option><option>SUV</option><option>Coupé</option><option>Cabrio</option><option>Otro</option></select></div></div><button class="btn" onclick="go()">🔎 ANALIZAR MERCADO</button></div><section id="out"></section></main><script>const $=id=>document.getElementById(id);const e=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0});const n=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();function km(s){let a=[...String(s).matchAll(/\b(\d{1,3}(?:[.\s]\d{3})+|\d{4,7})\s*(?:km|kms|kilometros|kilómetros)\b/gi)].map(x=>+x[1].replace(/[.\s]/g,''));return a.find(x=>x>=1000&&x<=500000)}function price(s){let a=[...String(s).matchAll(/(?:€|EUR)\s*(\d{1,3}(?:[.\s]\d{3})+|\d{4,6})\b|\b(\d{1,3}(?:[.\s]\d{3})+|\d{4,6})\s*(?:€|EUR)\b/gi)].map(x=>+(x[1]||x[2]).replace(/[.\s]/g,''));return a.find(x=>x>=4000&&x<=100000)}function fuel(s){let x=n(s);if(/hibrid|hybrid|hev|phev/.test(x))return'Híbrido';if(/electric|electrico|bev/.test(x))return'Eléctrico';if(/diesel|cdi|tdi|dci|hdi|320d|220d|116d/.test(x))return'Diésel';if(/gasolina|petrol|tsi|tce|tfsi|fsi|320i|330i|520i/.test(x))return'Gasolina';return''}function body(s){let x=n(s);if(/gran turismo|gt/.test(x))return'GT';if(/touring|avant|estate|wagon|familiar/.test(x))return'Familiar';if(/suv|todoterreno/.test(x))return'SUV';if(/coupe/.test(x))return'Coupé';if(/cabrio|convertible/.test(x))return'Cabrio';if(/compact|hatchback/.test(x))return'Compacto';if(/berlina|sedan|saloon/.test(x))return'Berlina';return''}function ok(v,s){let x=n(s),b=n(v.marca),m=n(v.modelo),f=fuel(s),bo=body(s);if(b&&!x.includes(b))return false;if(m&&!x.includes(m.replace('serie','').trim())&&!x.includes(n(v.motor)))return false;if(f&&f!==v.comb)return false;if(v.carro==='Berlina'&&bo&&bo!=='Berlina')return false;if(v.carro==='Familiar'&&bo&&bo!=='Familiar')return false;if(v.carro==='SUV'&&bo&&bo!=='SUV')return false;if(v.carro==='Coupé'&&bo&&bo!=='Coupé')return false;if(v.carro==='Cabrio'&&bo&&bo!=='Cabrio')return false;if(v.cambio==='Automático'&&/\bmanual\b/.test(x))return false;if(v.cambio==='Manual'&&/automatic|automatico|dsg|cvt|steptronic|tiptronic/.test(x))return false;return true}async function fetcher(u){try{let r=await fetch('https://r.jina.ai/'+u);return r.ok?await r.text():''}catch{return''}}async function go(){let v={marca:$('marca').value,modelo:$('modelo').value,motor:$('motor').value,ano:+$('ano').value,km:+$('km').value,comb:$('comb').value,cambio:$('cambio').value,carro:$('carro').value};$('out').innerHTML='<div class="panel">Analizando mercado…</div>';let q=encodeURIComponent(`${v.marca} ${v.modelo} ${v.motor} ${v.ano} ${v.comb} ${v.cambio} coche segunda mano precio km`),urls=[['https://www.bing.com/search?q='+q,'Bing'],['https://html.duckduckgo.com/html/?q='+q,'DuckDuckGo'],['https://www.google.com/search?q='+q,'Google'],['https://www.google.com/search?q='+encodeURIComponent('site:coches.net '+v.marca+' '+v.modelo+' '+v.motor+' '+v.ano),'Coches.net'],['https://www.google.com/search?q='+encodeURIComponent('site:flexicar.es '+v.marca+' '+v.modelo+' '+v.motor+' '+v.ano),'Flexicar'],['https://www.google.com/search?q='+encodeURIComponent('site:milanuncios.com '+v.marca+' '+v.modelo+' '+v.motor+' '+v.ano),'Milanuncios'],['https://www.google.com/search?q='+encodeURIComponent('site:wallapop.com '+v.marca+' '+v.modelo+' '+v.motor+' '+v.ano),'Wallapop']];let cs=[];for(let [u,s] of urls){let t=await fetcher(u);let parts=t.split(/(?=BMW|Mercedes|Audi|Volkswagen|Seat|Peugeot|Ford|Toyota|Opel|Renault|Citroen|Nissan|Kia|Hyundai|Skoda|Volvo|Mazda|Honda|Fiat|Dacia|Jeep|Mini|Lexus|Tesla|Cupra|Land Rover)/i);for(let p of parts){if(!ok(v,p))continue;let y=[...p.matchAll(/\b20\d{2}\b/g)].map(x=>+x[0]).find(y=>Math.abs(y-v.ano)<=1),k=km(p),pr=price(p);if(y&&pr){let sim=85;if(k)sim-=Math.min(25,Math.round(Math.abs(k-v.km)/Math.max(v.km,1)*35));cs.push({text:p.slice(0,350),year:y,km:k,price:pr,sim,source:s})}}}let seen=new Set();cs=cs.filter(c=>{let z=c.text+'|'+c.price+'|'+c.year+'|'+c.km;if(seen.has(z))return false;seen.add(z);return true}).sort((a,b)=>b.sim-a.sim).slice(0,15);if(!cs.length){$('out').innerHTML='<div class="panel"><div class="score">SIN DATOS</div><p class="hint">No se han encontrado anuncios compatibles. No invento una tasación.</p></div>';return}let vals=cs.map(c=>{if(!c.km)return c.price;let d=c.km-v.km,r=Math.abs(d)<=10000?55:Math.abs(d)<=25000?45:Math.abs(d)<=50000?32:22;return Math.round((c.price+Math.max(-1800,Math.min(1800,-d/1000*r)))/100)*100}).sort((a,b)=>a-b),med=vals.length%2?vals[(vals.length-1)/2]:(vals[vals.length/2-1]+vals[vals.length/2])/2,market=Math.round(med/100)*100; $('out').innerHTML='<div class="panel"><div class="hint">VALOR DE MERCADO · V1 / MOTOR V56</div><div class="score">'+e(market)+'</div><p class="hint">Rango observado: '+e(Math.min(...cs.map(c=>c.price)))+' – '+e(Math.max(...cs.map(c=>c.price)))+'</p><b>'+cs.length+' comparables</b></div><div class="panel"><b>PUJA MÁXIMA GLOW CARS</b><div class="score">'+e(Math.max(0,Math.round((market-4600)/100)*100))+'</div></div><div class="panel"><table class="table"><tr><th>Vehículo</th><th>Año</th><th>KM</th><th>Precio</th><th>Similitud</th><th>Fuente</th></tr>'+cs.map(c=>'<tr><td>'+c.text+'</td><td>'+c.year+'</td><td>'+(c.km?c.km.toLocaleString('es-ES')+' km':'—')+'</td><td>'+e(c.price)+'</td><td>'+c.sim+'%</td><td>'+c.source+'</td></tr>').join('')+'</table><p class="hint">Curva progresiva de KM aplicada. Los KM nunca se interpretan como precio.</p></div>'}</script></body></html>

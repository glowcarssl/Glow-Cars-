<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOW CARS · Tasación V60</title><style>body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;width:92%;margin:auto}.panel{background:#111;border:1px solid #292929;border-radius:16px;padding:20px;margin:20px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#d8b36a;font-size:12px;font-weight:bold;margin:10px 0 6px}input,select{width:100%;box-sizing:border-box;background:#090909;color:#fff;border:1px solid #333;border-radius:8px;padding:12px}.btn{display:block;width:100%;margin-top:18px;padding:15px 18px;border:0;border-radius:10px;background:#d8b36a;color:#111;font-weight:bold;font-size:16px;cursor:pointer}.score{font-size:40px;font-weight:900;color:#d8b36a}.hint{color:#999;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="panel"><h1>GLOW CARS</h1><p class="hint">Tasación profesional · Motor V60</p><div class="grid"><div><label>MARCA</label><input id="marca"></div><div><label>MODELO</label><input id="modelo"></div><div><label>MOTOR / VERSIÓN</label><input id="motor"></div><div><label>AÑO</label><input id="ano" type="number"></div><div><label>KILÓMETROS</label><input id="km" type="number"></div><div><label>COMBUSTIBLE</label><select id="comb"><option>Diésel</option><option>Gasolina</option><option>Híbrido</option><option>Eléctrico</option></select></div><div><label>CAMBIO</label><select id="cambio"><option>Manual</option><option>Automático</option></select></div><div><label>CARROCERÍA</label><select id="carro"><option>Berlina</option><option>Compacto</option><option>Familiar</option><option>SUV</option><option>Coupé</option><option>Cabrio</option><option>GT</option><option>Otro</option></select></div></div><button type="button" class="btn" onclick="tasar()">🔎 ANALIZAR MERCADO</button></div><section id="out"></section></main><script>function tasar(){const g=id=>document.getElementById(id).value;document.getElementById('out').innerHTML='<div class="panel"><div class="score">BUSCANDO…</div><p class="hint">Analizando '+g('marca')+' '+g('modelo')+' '+g('motor')+' '+g('ano')+' '+g('comb')+'…</p></div>'}</script></body></html>

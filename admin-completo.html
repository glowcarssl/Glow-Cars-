o,filters);let search='';const originalRender=w.render;const originalLoad=w.load;function norm(v){return String(v==null?'':v).normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase()}function allRows(){return Array.isArray(w.rows)?w.rows:[]}function doRender(){const all=allRows();if(!search){info.textContent='';originalRender();return}const q=norm(search);const filtered=all.filter(r=>norm([r['Marca-modelo'],r.Precio,r['Año'],r['Kilómetros'],r.Combustible,r.Cambio,r.estado,r['Descripción']].join(' ')).includes(q));w.rows=filtered;originalRender();w.rows=all;info.textContent='Mostrando '+filtered.length+' vehículo'+(filtered.length===1?'':'s')+' que coincide'+(filtered.length===1?'':'n')+' con «'+search+'»'}box.addEventListener('input',function(){search=box.value.trim();doRender()});w.load=async function(){await originalLoad();doRender()};})();})();</script></body></html>

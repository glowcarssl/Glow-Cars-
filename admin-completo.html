<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>GLOW CARS · Administrador</title><style>html,body{margin:0;width:100%;height:100%;background:#080808}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="admin" src="./admin.html?v=20260822"></iframe><script>(function(){const frame=document.getElementById('admin');frame.addEventListener('load',function(){const w=frame.contentWindow,d=frame.contentDocument;if(!d||!w)return;const sections=[...d.querySelectorAll('section.panel')];const veh=sections.find(s=>{const h=s.querySelector('h2');return h&&h.textContent.trim()==='Vehículos'});if(!veh)return;const filters=veh.querySelector('.filters');if(!filters)return;const box=d.createElement('input');box.type='search';box.placeholder='🔎 Buscar coche por marca, modelo, año, km, precio, combustible…';box.autocomplete='off';box.style.cssText='width:100%;box-sizing:border-box;margin:15px 0 8px;font-size:16px;padding:14px 16px;background:#090909;color:#fff;border:1px solid #555;border-radius:8px;font:inherit';filters.parentNode.insertBefore(box,filters);const info=d.createElement('div');info.style.cssText='color:#888;min-height:18px;margin-bottom:12px';filters.parentNode.insertBefore(info,filters);let search='';const originalRender=w.render;function getRows(){try{return w.eval('rows')}catch(e){return []}}function norm(v){return String(v==null?'':v).normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase()}w.render=function(){const all=getRows();if(!search){info.textContent='';return originalRender()}const q=norm(search);const filtered=all.filter(r=>norm([r['Marca-modelo'],r.Precio,r['Año'],r['Kilómetros'],r.Combustible,r.Cambio,r.estado,r['Descripción']].join(' ')).includes(q));try{w.eval('rows=__gcSearchRows')}catch(e){}w.__gcSearchRows=filtered;w.eval('rows=window.__gcSearchRows');originalRender();w.eval('rows=window.__gcAllRows');info.textContent='Mostrando '+filtered.length+' vehículo'+(filtered.length===1?'':'s')+' que coincide'+(filtered.length===1?'':'n')+' con «'+search+'»'};w.__gcAllRows=getRows();box.addEventListener('input',function(){search=box.value.trim();w.__gcAllRows=getRows();w.render()});const originalLoad=w.load;w.load=async function(){await originalLoad();w.__gcAllRows=getRows();w.render()};})();})();</script></body></html>

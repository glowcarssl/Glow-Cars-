<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOW CARS · Tasación</title><style>body{margin:0;background:#070707;color:#fff;font-family:Arial}.w{max-width:900px;width:92%;margin:auto}.p{background:#111;border:1px solid #292929;border-radius:16px;padding:20px;margin:18px 0}.q{width:100%;box-sizing:border-box;background:#090909;color:#fff;border:1px solid #444;border-radius:10px;padding:16px;font-size:17px}.btn{width:100%;margin-top:14px;padding:15px;border:0;border-radius:10px;background:#d8b36a;color:#000;font-weight:bold;font-size:16px}.btn:disabled{opacity:.5}.score{font-size:38px;font-weight:900;color:#d8b36a}.hint{color:#999;font-size:13px}.t{width:100%;border-collapse:collapse;font-size:12px}.t th,.t td{padding:8px;border-bottom:1px solid #292929;text-align:left;vertical-align:top}.t th{color:#d8b36a}</style></head><body><main class="w"><div class="p"><h1>GLOW CARS</h1><div class="hint">TASACIÓN PROFESIONAL · COLECTOR DE MERCADO · V57</div><p>Introduce el vehículo en una frase:</p><input id="q" class="q" placeholder="BMW Serie 3 320i gasolina automático 2019 135.000 km"><button id="go" class="btn">🔎 TASAR VEHÍCULO</button><p class="hint">Año ±1 · motor y modelo filtrados · combustible/cambio filtrados · KM normalizados.</p></div><div id="out"></div></main><script>const API='https://hqsiglpdnylsfbideglc.supabase.co/functions/v1/tasacion-market-search-v2';const $=id=>document.getElementById(id),eur=x=>Number(x||0).toLocaleString('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0});function parse(s){const z=s.trim();const y=+(z.match(/\b20\d{2}\b/)||[])[0]||0;const km=+((z.match(/(\d{1,3}(?:[.\s]\d{3})+|\d{4,7})\s*km/i)||[])[1]||'').replace(/[.\s]/g,'')||0;const comb=/diesel|di[eé]sel/i.test(z)?'Diésel':/gasolina|petrol/i.test(z)?'Gasolina':/h[ií]brid|hybrid/i.test(z)?'Híbrido':/electric|eléctrico/i.test(z)?'Eléctrico':'';const cambio=/auto|autom[aá]tic|dsg|cvt|steptronic|tiptronic/i.test(z)?'Automático':/manual/i.test(z)?'Manual':'';const marca=(z.match(/^(BMW|Mercedes(?:-Benz)?|Audi|Volkswagen|Seat|Skoda|Peugeot|Renault|Ford|Opel|Toyota|Hyundai|Kia|Nissan|Volvo|Mazda|Honda|Citroen|Citroën|Fiat|Dacia)\b/i)||[])[1]||'';let rest=z.replace(/^\S+\s*/,'').replace(/\b20\d{2}\b.*$/,'').replace(/\b\d{1,3}(?:[.\s]\d{3})+\s*km\b/i,'').trim();let motor='';const mc=rest.match(/\b\d{3}[a-z]{1,3}\b|\b\d(?:\.\d)?[a-z]{1,3}\b/i);if(mc){motor=mc[0];rest=rest.replace(mc[0],'').trim()}rest=rest.replace(/\b(gasolina|diesel|di[eé]sel|petrol|h[ií]brido|hybrid|eléctrico|electric|autom[aá]tico|automatic|manual)\b/gi,'').replace(/\s+/g,' ').trim();const modelo=rest||'';return{marca,modelo,motor,ano:y,km,comb,cambio,carro:'',margin:3000,transport:500,preparation:600,warranty:500}}async function run(){const s=$('q').value.trim();if(!s)return;$('go').disabled=true;$('go').textContent='🔎 TASANDO…';$('out').innerHTML='<div class="p">Buscando comparables en el colector…</div>';try{const v=parse(s);if(!v.marca||!v.modelo||!v.ano||!v.km)throw Error('Necesito marca, modelo, año y kilómetros.');const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)}),d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||'Error del colector');if(!d.valuation){$('out').innerHTML='<div class="p"><div class="score">SIN DATOS</div><p>No hay suficientes comparables compatibles.</p><div class="hint">Datos encontrados: '+(d.rawComparableCount||0)+' · Comparables tras filtro: '+((d.comparables||[]).length)+'</div></div><div class="p"><b>Diagnóstico</b>'+((d.diagnostics||[]).map(x=>'<p class="hint">'+x.source+' · '+(x.ok?'OK':'ERROR')+' · '+(x.found||0)+' encontrados'+(x.error?' · '+x.error:'')+'</p>').join(''))+'</div>';return}const c=d.comparables||[];$('out').innerHTML='<div class="p"><div class="hint">VALOR DE MERCADO · MOTOR V57</div><div class="score">'+eur(d.valuation.marketValue)+'</div><p>Rango: '+eur(d.valuation.range.low)+' – '+eur(d.valuation.range.high)+'</p><div class="hint">'+d.valuation.comparableCount+' comparables · confianza '+d.valuation.confidence+' · año ±1</div></div><div class="p"><div class="hint">PUJA MÁXIMA GLOW CARS</div><div class="score">'+eur(d.auction.maximumBid)+'</div><p class="hint">Venta rápida: '+eur(d.valuation.quickSale)+' · Optimizada: '+eur(d.valuation.optimizedSale)+'</p></div><div class="p"><b>🚗 Comparables utilizados</b><table class="t"><tr><th>Vehículo</th><th>Año</th><th>KM</th><th>Precio</th><th>KM ajustado</th><th>Sim.</th><th>Fuente</th></tr>'+c.map(x=>'<tr><td>'+String(x.title||'').slice(0,220)+'</td><td>'+x.year+'</td><td>'+(x.km?x.km.toLocaleString('es-ES'):'—')+'</td><td>'+eur(x.price)+'</td><td>'+eur(x.normalizedPrice)+'</td><td>'+(x.similarity||0)+'%</td><td>'+x.source+'</td></tr>').join('')+'</table></div><div class="p"><b>🔎 Diagnóstico de fuentes</b>'+((d.diagnostics||[]).map(x=>'<p class="hint">'+x.source+' · '+(x.ok?'OK':'ERROR')+' · '+(x.found||0)+' encontrados'+(x.error?' · '+x.error:'')+'</p>').join(''))+'</div>'}catch(e){$('out').innerHTML='<div class="p"><div class="score">ERROR</div><p>'+String(e.message||e)+'</p></div>'}finally{$('go').disabled=false;$('go').textContent='🔎 TASAR VEHÍCULO'}}$('go').onclick=run;$('q').onkeydown=e=>{if(e.key==='Enter')run()};</script></body></html>

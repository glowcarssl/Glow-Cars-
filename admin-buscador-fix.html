<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOW CARS · Administrador</title></head><body><iframe id="admin" src="./admin.html" style="width:100%;height:100vh;border:0"></iframe><script>(function(){const f=document.getElementById('admin');function i(){const d=f.contentDocument,w=f.contentWindow;if(!d)return;d.addEventListener('click',function(e){const b=e.target.closest&&e.target.closest('button');if(!b||b.textContent.trim()!=='Modificar')return;e.preventDefault();e.stopPropagation();const m=(b.getAttribute('onclick')||'').match(/edit\((\d+)\)/);if(!m)return;try{w.edit(Number(m[1]));const x=d.getElementById('editor');if(x){x.hidden=false;x.scrollIntoView({behavior:'smooth',block:'start'});}}catch(err){const s=d.getElementById('status');if(s)s.textContent='Error al abrir el editor: '+err.message}},true)}f.addEventListener('load',()=>setTimeout(i,100))})();</script></body></html>

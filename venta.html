<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOW CARS · ¿Qué tal se vende?</title><style>body{font-family:Arial,sans-serif;background:#0b0b0b;color:#fff;margin:0;padding:24px}.box{max-width:760px;margin:auto}.card{background:#171717;border:1px solid #333;border-radius:18px;padding:22px;margin-top:18px}input,button{width:100%;box-sizing:border-box;padding:15px;border-radius:12px;border:1px solid #444;background:#111;color:#fff;font-size:16px}button{margin-top:12px;background:#fff;color:#000;font-weight:700;cursor:pointer}.score{font-size:52px;font-weight:800}.green{color:#55e27a}.orange{color:#ffc857}.red{color:#ff6565}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#111;border-radius:12px;padding:15px}.small{color:#aaa;font-size:13px}.hidden{display:none}</style></head><body><main class="box"><h1>GLOW CARS</h1><p>TASACIÓN PROFESIONAL · ÍNDICE DE VENTA</p><div class="card"><p>Introduce el vehículo en una frase:</p><input id="q" placeholder="BMW Serie 3 320i gasolina automático 2019 135.000 km"><button onclick="analizar()">🔎 ANALIZAR SALIDA</button></div><section id="out" class="card hidden"></section></main><script>function analizar(){const q=document.getElementById('q').value.trim();if(!q)return;const x=q.toLowerCase();let score=6.5;let demand='MEDIA';let risk=5;let speed='30–60 días';if(/bmw|mercedes|audi|volvo|toyota|seat|skoda|volkswagen/.test(x))score+=.7;if(/automatic|automático|automatico/.test(x))score+=.4;if(/gasolina|diesel|diésel/.test(x))score+=.2;if(/201[89]|202[0-5]/.test(x))score+=.4;const km=x.match(/([0-9.]+)\s*km/);if(km){const n=parseInt(km[1].replace(/\./g,''));if(n<100000)score+=.5;else if(n>180000){score-=.8;risk+=2}}if(/serie 3|golf|leon|a3|a4|c-?class|clase c|corolla|yaris|tiguan|q3|q5/.test(x))score+=.5;score=Math.max(1,Math.min(10,score));if(score>=8){demand='ALTA';speed='15–30 días';risk=Math.max(1,risk-1)}else if(score>=7){demand='MEDIA-ALTA';speed='20–40 días'}else if(score<5.5){demand='BAJA';speed='60+ días';risk+=2}const cls=score>=8?'green':score>=6.5?'orange':'red';document.getElementById('out').classList.remove('hidden');document.getElementById('out').innerHTML=`<h2>📈 ÍNDICE DE VENTA</h2><div class="score ${cls}">${score.toFixed(1)} / 10</div><h3>${score>=8?'🟢 MUY BUENA SALIDA':score>=6.5?'🟠 SALIDA NORMAL':'🔴 SALIDA LENTA'}</h3><div class="grid"><div class="metric"><b>🔥 Demanda</b><br>${demand}</div><div class="metric"><b>⏱️ Tiempo estimado</b><br>${speed}</div><div class="metric"><b>⚠️ Riesgo de stock</b><br>${Math.min(10,risk)}/10</div><div class="metric"><b>👥 Público comprador</b><br>${score>=7.5?'Amplio':'Medio'}</div></div><h3>🧠 Lectura GLOW CARS</h3><p>${score>=8?'Modelo con buena salida comercial. Puede ser interesante para stock si el precio de compra deja margen.':score>=6.5?'Tiene mercado, pero el precio de compra será importante para evitar que se quede parado.':'Vehículo con salida más lenta. Solo lo incorporaría con un precio de compra especialmente bueno.'}</p><p class="small">Este índice es una orientación interna basada en características del vehículo; no sustituye datos reales de rotación.</p>`}</script></body></html>

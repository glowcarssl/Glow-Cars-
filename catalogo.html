<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOW CARS | Catálogo</title><style>body{background:#090909;color:#f6f4f0;font:16px Arial;margin:0}header{padding:24px 5%;border-bottom:1px solid #44392a;display:flex;justify-content:space-between;align-items:center}a{color:#d8b36a}main{max-width:1200px;margin:auto;padding:35px 5%}h1{font-size:40px}h1 span{color:#d8b36a}.tabs button{padding:12px;background:#222;color:white;border:1px solid #66573e;cursor:pointer;border-radius:6px;margin:5px}.tabs button.active{background:#d8b36a;color:black}input{padding:13px;background:#222;color:white;border:1px solid #555;border-radius:6px;width:min(95%,400px);margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:20px}.card{background:#181818;border:1px solid #333;border-radius:10px;overflow:hidden}.pic{height:210px;position:relative;overflow:hidden;background:#252525;color:#aaa;display:flex;align-items:center;justify-content:center}.pic img{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.gallery{display:flex;gap:7px;overflow-x:auto;padding:10px;background:#111}.gallery img{flex:0 0 70px;width:70px;height:56px;object-fit:cover;border-radius:5px;cursor:pointer}.body{position:relative;background:#181818;clear:both}.description{white-space:pre-line;overflow-wrap:anywhere;color:#ddd;line-height:1.5}.card{min-width:0}@media(max-width:600px){.grid{grid-template-columns:minmax(0,1fr)}.pic{height:230px}.body{padding:16px}}.body{padding:18px}.specs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.specs span{border:1px solid #514630;background:#24211b;padding:8px 10px;border-radius:7px;font-weight:600;font-size:14px}.price{color:#d8b36a;font-size:24px;font-weight:bold}.btn{display:inline-block;padding:11px;background:#d8b36a;color:black;text-decoration:none;border-radius:6px;font-weight:bold}.muted{color:#aaa}.pic img{cursor:zoom-in}.zoom{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.95);align-items:center;justify-content:center}.zoom.show{display:flex}.zoom img{max-width:94vw;max-height:85vh;object-fit:contain}.zoom button{position:absolute;top:15px;right:15px;padding:12px;font-size:24px}.zoom .prev,.zoom .next{top:50%;right:auto;transform:translateY(-50%);background:#222a;color:white;border:0;border-radius:50%;width:48px;height:48px;cursor:pointer}.zoom .prev{left:8px}.zoom .next{right:8px;left:auto}.zoom .count{position:absolute;bottom:18px;color:white;font-size:15px}.zoom img{touch-action:pan-y}.zoom .prev,.zoom .next{z-index:10001;background:rgba(25,25,25,.85);font-size:30px}.zoom .count{z-index:10001;background:#111a;padding:7px 12px;border-radius:12px}</style></head><body><header><b>GLOW <span style="color:#d8b36a">CARS</span></b><a href="index.html">Inicio</a></header><main><h1>Catálogo <span>GLOW CARS</span></h1><p class="muted">Compraventa · Importación · Premium Cars</p><div class="tabs"><button id="bD" onclick="setTab('D')">En venta</button><button id="bR" onclick="setTab('R')">Reservados</button><button id="bV" onclick="setTab('V')">Vendidos</button></div><input id="search" placeholder="Buscar marca o modelo..."><div class="grid" id="grid">Cargando vehículos...</div></main><div id="zoom" class="zoom" onclick="if(event.target===this)closeZoom()"><button aria-label="Cerrar" onclick="closeZoom()">×</button><button class="prev" aria-label="Foto anterior" onclick="stepZoom(-1)">‹</button><img id="zoomImg" alt="Fotografía ampliada"><button class="next" aria-label="Foto siguiente" onclick="stepZoom(1)">›</button><span id="zoomCount" class="count"></span></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>const URL_DB='https://geztxedkzckbnijmkpkh.supabase.co',KEY='sb_publishable_LRN_urSBqO5rfuoki5C28g_qu08nJWk';const sb=window.supabase.createClient(URL_DB,KEY);const money=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let cars=[],tab='D';let zoomPhotos=[],zoomIndex=0,zoomStartX=0;function openZoom(id,index){const c=cars.find(x=>x.id===id);if(!c)return;zoomPhotos=(Array.isArray(c.image_urls)&&c.image_urls.length?c.image_urls:[c.image_path]).map(photoUrl).filter(Boolean);if(!zoomPhotos.length)return;zoomIndex=Math.max(0,Math.min(Number(index)||0,zoomPhotos.length-1));document.getElementById('zoom').classList.add('show');document.body.style.overflow='hidden';drawZoom()}function drawZoom(){document.getElementById('zoomImg').src=zoomPhotos[zoomIndex];document.getElementById('zoomCount').textContent=(zoomIndex+1)+' / '+zoomPhotos.length;document.querySelector('.zoom .prev').style.display=zoomPhotos.length>1?'block':'none';document.querySelector('.zoom .next').style.display=zoomPhotos.length>1?'block':'none'}function stepZoom(d){if(!zoomPhotos.length)return;zoomIndex=(zoomIndex+d+zoomPhotos.length)%zoomPhotos.length;drawZoom()}function closeZoom(){document.getElementById('zoom').classList.remove('show');document.body.style.overflow=''}document.addEventListener('keydown',e=>{if(!document.getElementById('zoom').classList.contains('show'))return;if(e.key==='Escape')closeZoom();if(e.key==='ArrowLeft')stepZoom(-1);if(e.key==='ArrowRight')stepZoom(1)});document.getElementById('zoom').addEventListener('touchstart',e=>{zoomStartX=e.changedTouches[0].screenX},{passive:true});document.getElementById('zoom').addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-zoomStartX;if(Math.abs(dx)>45)stepZoom(dx<0?1:-1)},{passive:true});function photoUrl(p){if(!p)return '';if(p.startsWith('https://res.cloudinary.com/zzejwd9p/image/upload/'))return p;if(p.startsWith('vehicle-photos/'))return sb.storage.from('vehicle-photos').getPublicUrl(p.slice(15)).data.publicUrl;return ''}function setTab(t){tab=t;for(const x of ['D','R','V'])document.getElementById('b'+x).classList.toggle('active',x===t);render()}function render(){const q=document.getElementById('search').value.toLowerCase();const a=cars.filter(c=>c.status===tab&&c.name.toLowerCase().includes(q));document.getElementById('grid').innerHTML=a.map(c=>{const photos=(Array.isArray(c.image_urls)&&c.image_urls.length?c.image_urls:[c.image_path]).map(photoUrl).filter(Boolean);const img=photos[0]||'';return '<article class="card"><div class="pic">'+(img?'<img loading="lazy" onclick="openZoom('+c.id+',0)" src="'+escapeHTML(img)+'" onerror="this.replaceWith(document.createTextNode(\'Fotografía pendiente\'))">':'Fotografía pendiente')+'</div>'+(photos.length>1?'<div class="gallery">'+photos.map((p,i)=>'<img loading="lazy" onclick="this.closest(\'.card\').querySelector(\'.pic img\').src=this.src;openZoom('+c.id+','+i+')" src="'+escapeHTML(p)+'"  alt="Foto '+(i+1)+'">').join('')+'</div>':'')+'<div class="body"><p class="muted">'+({D:'EN VENTA',R:'RESERVADO',V:'VENDIDO'}[c.status])+'</p><h3>'+escapeHTML(c.name)+'</h3><div class="specs"><span>Año: '+escapeHTML(c.year||'—')+'</span><span>Kilómetros: '+(c.mileage==null?'Consultar':Number(c.mileage).toLocaleString('es-ES')+' km')+'</span></div>'+(c.description?'<p class="description">'+escapeHTML(c.description)+'</p>':'')+(tab==='D'?'<p class="price">'+money(c.price)+'</p><a class="btn" target="_blank" rel="noopener" href="https://wa.me/34644469249?text='+encodeURIComponent('Hola, quiero información del '+c.name)+'">Consultar vehículo</a>':'')+'</div></article>'}).join('')||'<p>No hay vehículos en esta categoría.</p>'}document.getElementById('search').oninput=render;async function load(){const {data,error}=await sb.from('vehicles').select('*').order('id',{ascending:false});if(error){document.getElementById('grid').textContent='Error al cargar catálogo: '+error.message;return}cars=data||[];setTab('D')}load();</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOW CARS | Catálogo</title><style>body{background:#090909;color:#f6f4f0;font:16px Arial;margin:0}header{padding:24px 5%;border-bottom:1px solid #44392a;display:flex;justify-content:space-between;align-items:center}a{color:#d8b36a}main{max-width:1200px;margin:auto;padding:35px 5%}h1{font-size:40px}h1 span{color:#d8b36a}.tabs button{padding:12px;background:#222;color:white;border:1px solid #66573e;cursor:pointer;border-radius:6px;margin:5px}.tabs button.active{background:#d8b36a;color:black}input{padding:13px;background:#222;color:white;border:1px solid #555;border-radius:6px;width:min(95%,400px);margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:20px}.card{background:#181818;border:1px solid #333;border-radius:10px;overflow:hidden}.pic{height:190px;display:grid;place-items:center;background:#252525;color:#aaa}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:18px}.price{color:#d8b36a;font-size:24px;font-weight:bold}.btn{display:inline-block;padding:11px;background:#d8b36a;color:black;text-decoration:none;border-radius:6px;font-weight:bold}.muted{color:#aaa}</style></head><body><header><b>GLOW <span style="color:#d8b36a">CARS</span></b><a href="index.html">Inicio</a></header><main><h1>Catálogo <span>GLOW CARS</span></h1><p class="muted">Compraventa · Importación · Premium Cars</p><div class="tabs"><button id="bD" onclick="setTab('D')">En venta</button><button id="bR" onclick="setTab('R')">Reservados</button><button id="bV" onclick="setTab('V')">Vendidos</button></div><input id="search" placeholder="Buscar marca o modelo..."><div class="grid" id="grid">Cargando vehículos...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>const URL_DB='https://wlkvsmfyxuhwjphffqsk.supabase.co',KEY='sb_publishable_3zqDbu_zPW9tqhb1sbkiYA_KIIu9L9n';const sb=window.supabase.createClient(URL_DB,KEY);const money=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let cars=[],tab='D';function setTab(t){tab=t;for(const x of ['D','R','V'])document.getElementById('b'+x).classList.toggle('active',x===t);render()}function render(){const q=document.getElementById('search').value.toLowerCase();const a=cars.filter(c=>c.status===tab&&c.name.toLowerCase().includes(q));document.getElementById('grid').innerHTML=a.map(c=>{const img=c.image_path?.startsWith('vehicle-photos/')?sb.storage.from('vehicle-photos').getPublicUrl(c.image_path.slice(15)).data.publicUrl:'';return '<article class="card"><div class="pic">'+(img?'<img loading="lazy" src="'+escapeHTML(img)+'" onerror="this.replaceWith(document.createTextNode(\'Fotografía pendiente\'))">':'Fotografía pendiente')+'</div><div class="body"><p class="muted">'+({D:'EN VENTA',R:'RESERVADO',V:'VENDIDO'}[c.status])+'</p><h3>'+escapeHTML(c.name)+'</h3><p>Año '+escapeHTML(c.year||'—')+'</p>'+(tab==='D'?'<p class="price">'+money(c.price)+'</p><a class="btn" target="_blank" rel="noopener" href="https://wa.me/34644469249?text='+encodeURIComponent('Hola, quiero información del '+c.name)+'">Consultar vehículo</a>':'')+'</div></article>'}).join('')||'<p>No hay vehículos en esta categoría.</p>'}document.getElementById('search').oninput=render;async function load(){const {data,error}=await sb.from('vehicles').select('*').order('id',{ascending:false});if(error){document.getElementById('grid').textContent='Error al cargar catálogo: '+error.message;return}cars=data||[];setTab('D')}load();</script></body></html>
